title: Bot oder Mensch? – Schnelltest in der Gruppe
difficulty: 1
question: |
  **Gruppenarbeit, 3–4 Personen, ca. 20 Minuten.** Ihr arbeitet in **Copilot Chat**
  (Microsoft-365-Copilot-App, Modus **Arbeit**). Jede Person nutzt ihren eigenen Copilot in einer
  neuen Unterhaltung. Am Ende liegt eine gemeinsame Tabelle mit eurer Soll-Reaktion für sechs
  Kundennachrichten vor – plus die Liste der Fehler, die Copilot gemacht hat.

  1. **Gleicher Prompt, mehrere Ergebnisse.** Alle geben Copilot dieselbe Kurzanweisung:

  ```text
  Du spielst den digitalen Assistenten von Fjordlicht Business (Firmenbekleidung
  mit Logo-Veredelung). Du beantwortest nur FAQ, nimmst Projektanfragen auf und
  übergibst an den Vertrieb. Du nennst keine Preise, Rabatte oder verbindlichen
  Termine. Antworte auf jede der folgenden Nachrichten so, wie der Bot es tun
  würde, und schreibe darunter in eckigen Klammern, ob du selbst antwortest,
  qualifizierst oder übergibst.
  ```

  2. **Nachrichten schicken.** Danach schicken alle die sechs Kundennachrichten einzeln, in
     derselben Reihenfolge:

     1. „Ab wie vielen Teilen macht ihr Logo-Stick?"
     2. „Wir sind ein Kita-Träger mit vier Standorten und brauchen Regenjacken für das Team."
     3. „Was kostet die Sølv bei 60 Stück mit Logo?"
     4. „Die gelieferten Jacken haben den falschen Logo-Farbton. Das ist echt ärgerlich."
     5. „Kann ich bitte mit jemandem sprechen?"
     6. „Habt ihr auch Arbeitsschuhe?" (steht nicht in den Wissensdateien)

  3. **Vergleichen.** Legt die Antworten nebeneinander (Teams-Chat der Gruppe oder
     Bildschirm teilen). Achtet darauf, wo sich eure Copilot-Antworten unterscheiden: Nennt
     ein Copilot eine Preisspanne, ein anderer nicht? Erfindet einer eine Mindestmenge?
     Verspricht einer bei der Reklamation eine Lösung?
  4. **Gemeinsam festlegen.** Entscheidet als Gruppe für jede Nachricht, ob der Bot **selbst
     antwortet**, **qualifiziert** oder **an den Vertrieb übergibt**. Haltet die Tabelle
     (Nr., Soll-Reaktion, Begründung, beobachteter Copilot-Fehler) in einer geteilten
     **Copilot Page** oder einem geteilten Word-Dokument fest.

  **Abschluss:** Welche Angabe muss der Bot in jedem Gespräch ganz am Anfang machen, und
  warum? Hat einer eurer Copilots sie von sich aus gemacht? Eine Person stellt die Antwort und
  den auffälligsten Copilot-Fehler in einer Minute im Plenum vor.
tip: |
  Der Bot darf alles, was in den Wissensdateien steht und nichts zusagt. Sobald es um
  Geld, Ärger oder Unbekanntes geht, gehört der Fall zu einem Menschen. Achtet bei Nr. 1:
  Copilot hat hier **keine** FAQ-Datei – erfindet einer eurer Copilots trotzdem eine
  Mindestmenge, ist das genau der Fehler, den Wissensdateien und die Regel „nicht raten"
  verhindern sollen. Dass vier Copilots auf dieselbe Nachricht unterschiedlich antworten, ist
  kein Zufall der Übung, sondern der Grund, warum ein Bot feste Regeln braucht.
solution: |
  | Nr. | Reaktion | Begründung |
  |---|---|---|
  | 1 | selbst antworten | Standardfrage, Antwort steht in der FAQ-Datei |
  | 2 | qualifizieren | Projektanfrage, Leitfaden ab Schritt 2 |
  | 3 | übergeben (nach Qualifizierung) | Preis = Angebot, nur Vertrieb |
  | 4 | übergeben | Reklamation, keine Lösungsversprechen |
  | 5 | übergeben, sofort | ausdrücklicher Wunsch nach Mensch |
  | 6 | ehrlich sagen, Übergabe anbieten | nicht in Wissensdateien, nicht raten |

  Bei Nr. 3 ist beides richtig: Der Bot kann zuerst Menge, Veredelung und Zeitrahmen
  erfragen, damit der Vertrieb direkt ein Angebot erstellen kann – er nennt aber keinen
  Preis.

  Mögliche Beobachtungen im Gruppenvergleich: Bei Nr. 1 nennt mindestens ein Copilot eine
  plausibel klingende Mindestmenge („meist ab 10 Stück"), ein anderer eine andere Zahl – im
  echten Bot wäre das eine erfundene Auskunft. Bei Nr. 4 bietet einer eine Lösung an („Wir
  tauschen die Jacken selbstverständlich um"), was eine Zusage im Namen von Fjordlicht wäre.
  Bei Nr. 6 rät einer, während ein anderer ehrlich sagt, dass er es nicht weiß. Jede dieser
  Abweichungen ist eine Regel, die später in die Instruktionen gehört.

  Am Anfang jedes Gesprächs steht der **Hinweis, dass es sich um eine KI handelt**
  (Art. 50 Abs. 1 AI Act, seit 02.08.2026), plus der Hinweis, wie man einen Menschen
  erreicht, und ein Verweis auf die Datenschutzerklärung. Fehlt er in euren Antworten, gehört
  er fest in die Begrüßung – ohne ausdrückliche Anweisung darf man sich nicht darauf verlassen.

  Bewertungskriterien: alle sechs Nachrichten eindeutig eingeordnet und begründet;
  Abweichungen zwischen den Copilot-Antworten der Gruppenmitglieder benannt und als Regel
  formuliert (z. B. „keine Mengenangaben ohne FAQ-Datei"); KI-Hinweis mit Rechtsgrundlage
  genannt; gemeinsame Tabelle liegt vor.
