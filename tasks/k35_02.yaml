title: Storyboard und Videoprompts im geteilten Word-Dokument
difficulty: 2
question: |
  **Gruppenarbeit:** 3–4 Personen, etwa 30 Minuten, in **Copilot in Word**. **Rollen:**
  Storyboard-Verantwortliche (legt das Dokument an und promptet), Prüferin (prüft Handlung und
  Hook), die übrigen schreiben mit. Für Schritt 3 teilt ihr die Einstellungen untereinander auf.
  **Am Ende liegt vor:** ein gemeinsames Word-Dokument „Storyboard-Tind" mit Storyboard-Tabelle
  und einem Videoprompt je Einstellung. Für den optionalen Generierungsschritt braucht ihr ein
  Videowerkzeug mit Testkontingent (Veo, Runway, Kling, Luma, Firefly Video).

  1. **Storyboard (Storyboard-Verantwortliche).** Lege im OneDrive-Ordner „Fjordlicht-Kurs" ein
     neues Word-Dokument „Storyboard-Tind" an und teile es mit der Gruppe. Lass Copilot einen
     Entwurf erstellen: den Storyboard-Prompt aus Abschnitt 35.5, angepasst auf ein
     **10-Sekunden-Reel** für den Rucksack „Tind" (Ziel: Herbstwanderung am Wochenende), mit
     Verweis auf `/Fjordlicht-Basisdaten` (aus Kap. 11). Für Nachhaltigkeit nur die
     Platzhalterzeile, keine eigene Aussage. Liegt das Storyboard als Fließtext vor, lass es in
     eine Tabelle umwandeln.
  2. **Prüfen und gezielt überarbeiten (Prüferin, alle lesen mit).** Hat jede Einstellung genau
     eine Handlung? Sind die ersten zwei Sekunden ohne Ton verständlich? Setzt an jede
     problematische Zeile einen Word-Kommentar. Die Storyboard-Verantwortliche markiert dann nur
     diese Zeilen und lässt sie von Copilot umschreiben – nicht das ganze Dokument neu erzeugen.
  3. **Videoprompts (Arbeitsteilung).** Jede Person übernimmt eine Einstellung, setzt den Cursor
     unter die Tabelle und lässt Copilot im gemeinsamen Dokument einen vollständigen Videoprompt
     mit allen sieben Bausteinen aus Abschnitt 35.3 schreiben, überschrieben mit der Nummer der
     Einstellung.
  4. **Gegenprüfung.** Tauscht die Prompts reihum: Jede Person prüft den Prompt der nächsten und
     stellt Copilot eine Frage zum Dokument: „Welcher der sieben Bausteine fehlt im Prompt zu
     Einstellung [Nr.] oder ist zu vage?" Vergleicht Copilots Antwort mit eurem eigenen Urteil
     und bessert nach.
  5. **Generieren (optional).** Wählt gemeinsam den stärksten Prompt. Eine Person erzeugt den
     Clip im Videowerkzeug mit dem vollständigen Prompt, eine andere mit einer Kurzfassung von
     höchstens 15 Wörtern. Notiert den Vergleich unter dem Prompt im Word-Dokument.

  Zum Abschluss: Entscheidet, welche Einstellung ihr als einzige wirklich produzieren würdet, und
  begründet das in zwei Sätzen.
tip: |
  Der häufigste Fehler im Storyboard ist eine Einstellung mit zwei oder drei Handlungen. Streicht
  lieber, als zu verdichten – zehn Sekunden sind kürzer, als sie sich beim Planen anfühlen. Das
  gezielte Umschreiben einer markierten Zeile hält die guten Einstellungen unangetastet. Achtet
  bei der Gegenprüfung darauf, ob Copilots Antwort und euer Urteil zum selben Baustein kommen –
  und wenn nicht, wer recht hat.
solution: |
  Beispiel-Prompt für den Entwurf mit Copilot in Word:

  ```text
  Du bist Art Director für kurze Social-Media-Videos.
  Erstelle ein Storyboard für ein Instagram-Reel (9:16, 10 Sekunden) zum
  Rucksack "Tind" von Fjordlicht. Nutze Markenstimme und Produktfakten aus
  /Fjordlicht-Basisdaten.
  Ziel: Lust auf eine Herbstwanderung am Wochenende.
  Format: Tabelle mit den Spalten Nr., Dauer, Bildinhalt, Handlung,
  Kamerabewegung, Ton, Texteinblendung.
  Regeln: 3 bis 4 Einstellungen, jede mit genau einer Handlung.
  Die ersten 2 Sekunden müssen ohne Ton verständlich sein.
  Keine Nachhaltigkeitsaussagen außer: [belegte Aussage aus Claim-Liste].
  Ton: ruhig, ehrlich, leicht nordisch-trocken, keine Superlative.
  ```

  Ein brauchbares Storyboard hat drei bis vier Einstellungen – passend zur Gruppengröße:

  | Nr. | Dauer | Bild/Handlung | Kamera | Text |
  |---|---|---|---|---|
  | 1 | 2 s | Nebel über Waldweg, Morgenlicht | static shot | „Samstag, 7:40 Uhr" |
  | 2 | 3 s | Hand schließt Deckel des Rucksacks | dolly in | – |
  | 3 | 3 s | Person geht mit Rucksack den Weg hinauf | tracking shot | – |
  | 4 | 2 s | Rucksack am Gipfelkreuz, Weite | slow pan | „Tind. Für den Weg nach oben." |

  Beispiel-Videoprompt für Einstellung 3:

  ```text
  Szene: schmaler Waldweg im Herbst, Morgennebel, feuchtes Laub.
  Motiv und Handlung: eine Person von hinten mit einem schlichten dunkelgrünen
  Wanderrucksack geht ruhig den Weg hinauf.
  Kamera: Tracking Shot von hinten auf Hüftenhöhe, gleichmäßig.
  Licht und Stil: weiches Morgenlicht, natürliche Farben, dokumentarisch.
  Ton: Schritte auf Laub, Vögel, keine Musik.
  Format: 9:16, 3 Sekunden. Kein Text, keine Logos.
  ```

  Worauf die Prüferin im ersten Entwurf achten sollte: ob eine Einstellung zwei Handlungen
  enthält („Nebel lichtet sich, Person tritt ins Bild") und ob eine Texteinblendung einen
  Superlativ oder eine Nachhaltigkeitsaussage enthält, die nicht in den Basisdaten steht. Beides
  wird über das Umschreiben der markierten Zeile gelöst.

  Bei Einstellung 2 und 4 ist das Produkt im Bild: Gute Gruppen halten im Prompt fest, dass
  hierfür Bild-zu-Video mit dem echten Produktfoto genutzt wird, weil ein reiner Textprompt den
  Rucksack erfindet. Beim optionalen Vergleich lohnt der Blick darauf, ob die Kurzfassung
  Kamerabewegung, Look oder Text im Bild anders trifft als die vollständige Fassung.

  Bewertungskriterien: Das Storyboard hat je Einstellung genau eine Handlung und einen stummen
  Hook; Änderungen wurden gezielt an markierten Zeilen vorgenommen. Jede Einstellung hat einen
  Videoprompt mit allen sieben Bausteinen. Die Gegenprüfung ist im Dokument sichtbar
  (Kommentare oder Nachbesserungen), und die Gruppe hat benannt, wo Copilots Antwort auf die
  Dokumentfrage von ihrem eigenen Urteil abwich. Die Schlussentscheidung ist begründet.
