title: Einsatzfelder der Customer Journey zuordnen
difficulty: 1
question: |
  Ordne die folgenden Marketingaufgaben von Fjordlicht der passenden Phase der Customer Journey
  zu – Aufmerksamkeit, Interesse und Erwägung, Kauf, Bindung, Empfehlung – und nenne jeweils
  einen konkreten Beitrag, den generative KI leisten kann.

  1. Willkommensstrecke für neue Newsletter-Abonnenten
  2. TikTok-Clip zum Wandern im Münsterland
  3. Zwei Varianten der Produktseite für den Rucksack „Tind"
  4. Auswertung von 300 Kundenbewertungen zur Fleecejacke „Skog"
  5. Ratgeberartikel „Zwiebelprinzip im Herbst" im Blog „Draußen-Notizen"

  Nenne anschließend eine Aufgabe aus der Liste, bei der der Nutzen von KI am größten ist, und
  begründe in zwei Sätzen.
tip: |
  Frage dich bei jeder Aufgabe: In welchem Moment begegnet die Person dem Inhalt – kennt sie die
  Marke noch nicht, vergleicht sie gerade, kauft sie oder ist sie schon Kundin?
solution: |
  | Nr. | Phase | Beitrag der KI |
  |---|---|---|
  | 1 | Bindung | Aufbau der Sequenz, Betreffzeilen, Textentwürfe je Mail |
  | 2 | Aufmerksamkeit | Hook-Ideen, Skript, Storyboard, Untertitel |
  | 3 | Kauf | Textvarianten mit genau einer veränderten Variable für den Test |
  | 4 | Empfehlung | Themen- und Stimmungsanalyse, häufige Kritikpunkte bündeln |
  | 5 | Interesse und Erwägung | Gliederung, Rohfassung, FAQ-Block |

  Größter Nutzen: meist Nr. 4 oder Nr. 3. Bei der Bewertungsauswertung erledigt KI in Minuten,
  was von Hand Stunden dauert, und die Datengrundlage liegt vollständig vor. Bei den Varianten
  spielt KI ihre Kernstärke aus – viele Fassungen auf Basis bekannter Fakten.

  Auch Nr. 5 ist vertretbar, wenn die Begründung die Prüfzeit mitdenkt. Wer „Blogartikel" ohne
  Hinweis auf Faktencheck und eigene Erfahrung nennt, hat den realistischen Nutzen überschätzt.
