title: Ein Zielgruppenprofil auf dem Prüfstand – mit verteilten Rollen
difficulty: 3
question: |
  **Gruppe:** 3–4 Personen, ca. 30 Minuten. **Rollen ab Schritt 2:** **Faktenprüferin**
  (Copilot Chat, Modus Web), **Prompt-Prüfer** (P.R.O.M.P.T.-Diagnose), **Planerin** (führt
  das gemeinsame Word-Dokument „Analyseplan-Business.docx"), bei 4 Personen zusätzlich
  **Advocatus Diaboli**. **Am Ende liegt vor:** ein geteiltes Word-Dokument mit Bewertung des
  Profils, Analyseplan und erstem Prompt.

  Eine Kollegin hat für „Fjordlicht Business" (Firmenbekleidung) in fünf Minuten folgendes Profil
  mit Copilot erstellt – ohne Daten, nur mit dem Prompt „Beschreibe die Zielgruppe für nachhaltige
  Firmenbekleidung":

  ```text
  Zielgruppe: Entscheiderinnen und Entscheider in modernen, nachhaltigkeits-
  orientierten Unternehmen (50-500 MA), meist HR- oder Marketingleitung,
  35-55 Jahre. 78 % der deutschen Unternehmen planen, ihre Arbeitskleidung
  bis 2027 auf nachhaltige Materialien umzustellen. Wichtigste Kriterien:
  Nachhaltigkeit, Corporate Design, Preis. Sie informieren sich vor allem
  auf LinkedIn und erwarten innovative Lösungen.
  ```

  1. **Gleicher Prompt, mehrere Ergebnisse.** Alle geben denselben Prompt in Copilot Chat ein
     (Modus **Arbeit**, ohne Dateien) und kopieren das Ergebnis in den Teams-Chat der Gruppe.
     Vergleicht eure Ergebnisse untereinander und mit dem Profil oben: Welche Muster wiederholen
     sich, was variiert?
  2. **Bewerten in Rollen.** Die Faktenprüferin prüft die 78-%-Zahl in Copilot Chat im Modus
     **Web** und öffnet jede genannte Quelle selbst. Die übrigen bewerten das Profil Satz für
     Satz: Was ist Vermutung, was eine ungeprüfte Zahl, was ist zu allgemein, um nutzbar zu sein?
     Der Advocatus Diaboli verteidigt das Profil („Das klingt doch plausibel!") und zwingt die
     Gruppe, jede Kritik zu begründen.
  3. **Ursache.** Der Prompt-Prüfer erklärt der Gruppe, welche Bausteine des
     P.R.O.M.P.T.-Frameworks im Ausgangsprompt fehlten und warum das zu genau diesem Ergebnis
     führt.
  4. **Analyseplan.** Die Planerin legt „Analyseplan-Business.docx" im Ordner „Fjordlicht-Kurs"
     an und teilt es. Gemeinsam entwerft ihr den Plan: Welche drei Quellen nutzt Fjordlicht, mit
     welchen Copilot-Funktionen wertet ihr sie aus (z. B. Copilot in Excel, Copilot Chat mit
     `/`-Verweis auf Dateien, Modus Web), und wie validiert ihr die Ergebnisse?
  5. **Erster Schritt.** Jede Person schreibt einen eigenen Prompt für den ersten Copilot-Schritt
     des Plans. Wählt gemeinsam den besten aus, übernehmt ihn ins Dokument und stellt ihn in
     zwei Minuten im Plenum vor.
tip: |
  Achtet besonders auf die Zahl. Sie ist präzise, hat keine Quelle und passt verdächtig gut zur
  Botschaft, die man gern hören möchte. Genau so sehen Halluzinationen in Zielgruppenprofilen
  aus. Prüft beim Vergleich in Schritt 1, ob in euren Ergebnissen ebenfalls Prozentzahlen
  auftauchen – und ob es bei allen dieselben sind. Legt im Plan fest, **welche** Dateien als
  Quelle gelten, statt Copilot im Modus Arbeit frei suchen zu lassen.
solution: |
  1. Mögliche Beobachtung beim Nachstellen: wieder „nachhaltigkeitsorientierte Unternehmen",
  HR/Marketing als Entscheider, LinkedIn – das Modell liefert den Durchschnitt, nur anders
  formuliert. Unterscheiden sich die Ergebnisse der Gruppenmitglieder, dann meist im Wortlaut
  und in Details wie Altersspannen oder Zahlen, kaum in der Grundaussage.

  2. Bewertung:

  | Aussage | Problem |
  |---|---|
  | Entscheider in „modernen, nachhaltigkeitsorientierten" Firmen | Zirkelschluss: beschreibt die gewünschte, nicht die tatsächliche Kundschaft |
  | HR- oder Marketingleitung, 35–55 | Vermutung; im Handwerk entscheidet oft Inhaber oder Einkauf |
  | „78 % … bis 2027" | ungeprüfte, vermutlich erfundene Zahl – ohne geöffnete passende Quelle nicht verwenden |
  | Kriterien Nachhaltigkeit, Design, Preis | plausibel, aber zu allgemein; Haltbarkeit, Nachbestellbarkeit, Größenspektrum fehlen |
  | LinkedIn, „innovative Lösungen" | Floskel ohne Handlungswert |

  3. Es fehlten **Persona** (Analyst statt Werbetexter), **Modifier** (keine Zahl ohne Quelle,
  Hypothesen markieren, Daten nutzen) und vor allem Material: Ohne Daten bleibt dem Modell nur der
  Durchschnitt. **Purpose** war nur angedeutet – wofür wird das Profil gebraucht?

  4. Analyseplan, zum Beispiel: (a) Anfragen und Angebote der letzten zwölf Monate aus dem CRM,
  pseudonymisiert als Excel-Tabelle mit Branche, Größe, Anfrageanlass – Auswertung mit Copilot in
  Excel (zusammenfassen, sortieren/filtern, Diagramm); (b) Gesprächsnotizen des Vertriebs als
  Word-Datei – Jobs-to-be-done mit Copilot Chat per `/`-Verweis; (c) Desk Research zu
  Firmenbekleidung mit Copilot Chat im Modus Web, jede Zahl an der geöffneten Quelle geprüft.
  Validierung: fünf Gespräche mit Bestandskunden, Abgleich mit dem Vertrieb.

  5. Erster Prompt:

  ```text
  Du bist B2B-Marktanalyst. Gruppiere die 40 pseudonymisierten Anfragen
  in /Anfragen-Business nach Branche, Unternehmensgröße und Anlass der
  Anfrage. Format: Tabelle Cluster | Anzahl | typischer Anlass |
  wörtliches Zitat. Regeln: Nur Daten aus der Datei, keine externen
  Annahmen; unklare Fälle als [UNKLAR]. Zweck: Grundlage für ein
  Zielgruppenbriefing Fjordlicht Business.
  ```

  Die Anzahl je Cluster prüft ihr anschließend in Excel nach – beim Zählen ist ein Sprachmodell
  unzuverlässig.

  Bewertungskriterien: Gemeinsamkeiten und Abweichungen zwischen den Ergebnissen der
  Gruppenmitglieder sind benannt; die 78-%-Zahl ist mit geöffneten Quellen geprüft oder
  verworfen; jede Kritik am Profil hat dem Advocatus Diaboli standgehalten; der Plan nennt drei
  Quellen, passende Copilot-Funktionen und einen Validierungsweg; die Auswahl des ersten Prompts
  ist begründet.
