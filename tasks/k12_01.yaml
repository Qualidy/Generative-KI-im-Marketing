title: SCAMPER zuordnen und mit Copilot gegenprüfen
difficulty: 1
question: |
  **Gruppe:** 3–4 Personen · **Dauer:** ca. 20 Minuten · **Aufteilung:** erst still allein, dann
  gemeinsam; in Schritt 3 zwei Untergruppen · **Am Ende liegt vor:** eine gemeinsame
  SCAMPER-Zuordnung und ein Satz, warum ihr SCAMPER im Prompt vorgebt.

  Die folgenden Ideen für den Fjordlicht-Instagram-Kanal sind bereits entstanden:

  1. Statt Produktfotos im Studio zeigen wir die Jacken nur noch in echtem Regen.
  2. Wir übernehmen das Format „Vorher/Nachher" aus Renovierungskanälen für Reparaturen.
  3. Follower stellen die Fragen, das Team antwortet im Video.
  4. Pflegetipp und Wetterprognose werden zu einem Wochen-Post verbunden.
  5. Wir verzichten im Herbst komplett auf Rabattaktionen.
  6. Alte Kampagnenfotos werden als Puzzle-Motiv für Familien genutzt.
  7. Reels werden auf 7 Sekunden verkürzt.

  1. **Still zuordnen:** Jede Person ordnet jede Idee **allein** einem SCAMPER-Buchstaben zu
     (Substitute, Combine, Adapt, Modify, Put to other uses, Eliminate, Reverse). Danach
     vergleicht ihr: Wo seid ihr euch einig, wo nicht? Einigt euch auf eine Gruppenzuordnung mit
     kurzer Begründung.
  2. **Gegenprobe:** Eine Person gibt die Liste in **Copilot Chat** ein und lässt Copilot zuordnen
     und begründen. Notiert, wo Copilot von eurer Gruppenzuordnung abweicht und ob seine
     Begründung vertretbar ist.
  3. **Untergruppen-Duell:** Teilt euch in zwei Untergruppen. Jede Person startet einen **neuen**
     Chat in ihrem eigenen Copilot.
     - Untergruppe A: „Gib mir kreative Instagram-Ideen für eine Outdoor-Marke im Herbst."
     - Untergruppe B: SCAMPER mit Kontext – je Buchstabe eine Idee, mit Verweis auf
       `/Fjordlicht-Basisdaten`.
  4. **Gemeinsame Auswertung:** Legt alle Ergebnisse nebeneinander. Zählt: Wie viele Ideen aus A
     könnte jede andere Outdoor-Marke genauso posten? Wie ähnlich sind sich die Ergebnisse
     innerhalb von A, wie ähnlich innerhalb von B? Formuliert als Gruppe einen Satz, warum ihr
     SCAMPER ausdrücklich vorgebt, und wählt eine Idee aus B für das Plenum.
tip: |
  Manche Ideen lassen sich zwei Buchstaben zuordnen. Entscheidend ist, welche Denkbewegung im
  Vordergrund steht: austauschen, verbinden, übernehmen, verändern, umnutzen, weglassen, umkehren.
  Abweichungen in der Gruppe und zu Copilot sind kein Fehler, solange beide Zuordnungen begründet
  sind – genau darüber lohnt es sich zu sprechen. Achtet in Schritt 4 darauf, ob sich dieselben
  Ideen in mehreren Ergebnissen von Untergruppe A wiederholen.
solution: |
  | Nr. | Buchstabe | Begründung |
  |---|---|---|
  | 1 | Substitute | Studiosetting wird durch echte Umgebung ersetzt |
  | 2 | Adapt | Format aus einem anderen Bereich wird übernommen |
  | 3 | Reverse | die übliche Richtung (Marke spricht, Kunde hört) wird umgekehrt |
  | 4 | Combine | zwei Inhalte werden zu einem verbunden |
  | 5 | Eliminate | ein gewohntes Element fällt weg |
  | 6 | Put to other uses | vorhandenes Material bekommt einen neuen Zweck |
  | 7 | Modify | Länge wird verändert (verkleinert) |

  Mögliche Abweichungen: Idee 1 als „Modify" (die Fotos werden verändert) oder Idee 3 als
  „Substitute". Beides ist vertretbar, wenn die Begründung stimmt.

  Beispielprompt für Untergruppe B:

  ```text
  Wende SCAMPER auf den Instagram-Kanal der Fjordlicht GmbH an.
  Marke, Markenstimme und Produkte: /Fjordlicht-Basisdaten
  Liefere je Buchstabe genau eine Idee als Tabelle mit den Spalten
  Buchstabe, Idee, Warum sie nur zu Fjordlicht passt.
  Keine Rabattaktionen, keine unbelegten Nachhaltigkeitsaussagen.
  ```

  Möglicher Befund: In A tauchen Laub, Packliste, Herbstwanderweg und „Gewinnspiel" auf – und
  zwar in mehreren Ergebnissen der Untergruppe fast gleich. In B erscheinen Reparaturservice, Sølv
  im Münsterländer Regen oder die nordisch-trockene Stimme. Grund für die Vorgabe: Ohne Methode
  und Kontext liefert das Modell die wahrscheinlichsten Ideen. SCAMPER zwingt es in sieben
  Denkrichtungen und sortiert die Ergebnisse nachvollziehbar.

  Bewertungskriterien: Gruppenzuordnung vollständig und begründet, Abweichungen zu Copilot
  benannt; zur Zusammenarbeit: Einzelzuordnungen entstanden vor der Diskussion, Uneinigkeit in der
  Gruppe wurde begründet aufgelöst, beide Untergruppen haben ihren Prompt selbst ausgeführt, und
  Ähnlichkeiten innerhalb der Untergruppen wurden benannt und erklärt.
