title: Prototyp als Copilot-Agent – bauen und im Rollenspiel testen
difficulty: 2
question: |
  **Gruppenarbeit, 3–4 Personen, ca. 30 Minuten.** Ihr baut gemeinsam einen Prototyp mit dem
  **Agent Builder** in Microsoft 365 Copilot – nur intern, nur mit fiktiven Daten. Am Ende
  liegen ein geteilter Agent „Fjordlicht Business Assistent (Prototyp)", drei Wissensdateien
  im Ordner „Fjordlicht-Kurs/CRM-Bot" und ein kurzes Testprotokoll vor.

  **Rollen:** **Agent-Verantwortliche** (baut und teilt den Agent), **Kundin** (spielt die
  Anfragende), **Prüferin** (achtet auf Regeln und Steckbrief), **Protokoll** (hält Fehler und
  Änderungen fest). Zu dritt übernimmt die Agent-Verantwortliche auch das Protokoll.

  1. **Wissensdateien in Arbeitsteilung.** Die Agent-Verantwortliche legt in ihrem
     OneDrive-Ordner „Fjordlicht-Kurs" den Unterordner „CRM-Bot" an und teilt ihn mit der
     Gruppe. Je eine Person erstellt darin eine kurze Word-Datei: `FAQ` (drei bis fünf Fragen
     mit fiktiven Antworten, z. B. Mindestmenge, Veredelungsarten, Lieferzeit),
     `Lead-Kriterien` (Stufen A/B/C aus Abschnitt 27.2) und `Steckbrief-Vorlage` (Feldnamen
     aus 27.3). Nutzt dafür **Entwurf mit Copilot** in Word. Die Prüferin liest die FAQ
     gegen: Steht irgendwo ein Preis? Dann raus damit.
  2. **Agent erstellen.** Die Agent-Verantwortliche legt im Agent Builder den Agent
     „Fjordlicht Business Assistent (Prototyp)" an und trägt als Anweisungen ein:

  ```text
  Du bist der digitale Assistent von Fjordlicht Business (Firmenbekleidung mit
  Logo-Veredelung). Beginne jedes Gespräch mit dem Hinweis, dass du eine KI bist
  und man mit "Mensch" das Vertriebsteam erreicht. Beantworte FAQ nur aus der
  Datei FAQ. Qualifiziere Projektanfragen mit diesen Fragen, IMMER NUR EINE PRO
  NACHRICHT: Firma und Branche, Einsatzzweck, Produkte und Personenzahl
  insgesamt, Logo, Zeitrahmen, Rolle und Kontaktweg. Fasse danach zusammen und
  bitte um Bestätigung. Erst nach einem ausdrücklichen "ja" erzeuge den
  LEAD-STECKBRIEF exakt nach der Datei Steckbrief-Vorlage. Fehlende Angaben:
  "offen". Schlage eine Lead-Stufe nach der Datei Lead-Kriterien vor und
  begründe sie in einem Satz. Nenne nie Preise, Rabatte oder Preismodelle.
  ```

     Sie fügt die drei Dateien als **Wissen** hinzu, legt zwei **Startprompts** an („Ich habe
     eine Frage", „Ich möchte eine Anfrage stellen") und teilt den Agent mit der Gruppe.
  3. **Rollenspiel.** Die Kundin öffnet den geteilten Agent und spielt die Inhaberin eines
     Fahrradladens mit 12 Beschäftigten, die Softshells mit Logo will, „irgendwann im
     Frühjahr". Sie antwortet bewusst unvollständig und fragt zwischendurch nach einem
     Mengenrabatt. Die anderen schauen zu (Bildschirm teilen).
  4. **Prüfen und nachbessern.** Die Prüferin hakt ab: Eine Frage pro Nachricht? KI-Hinweis
     am Anfang? Steckbrief vollständig, mit „offen" statt Erfundenem? Rabatt abgelehnt, ohne
     unfreundlich zu werden? Die Gruppe einigt sich auf **eine** Änderung an den Anweisungen,
     die Agent-Verantwortliche setzt sie um, dann **Rollen tauschen** und denselben Fall noch
     einmal testen.

  **Abschluss:** Das Protokoll hält in drei Zeilen fest: Fehler, Änderung, Ergebnis des
  zweiten Tests. Der Ordner „CRM-Bot" bleibt bestehen – ihr braucht ihn im Workshop.

  Hinweis: Ein Agent aus dem Agent Builder läuft innerhalb von Microsoft 365. Für einen
  Chatbot auf der Website braucht es eine andere Plattform, etwa die Chatbot-Funktion des CRM
  (Abschnitt 27.1) – die Anweisungen und Wissensdateien nehmt ihr dorthin mit.
tip: |
  Testet nicht den Idealfall. Ein Bot, der bei vollständigen Antworten funktioniert, ist
  wenig wert – interessant ist, was er mit „weiß ich noch nicht" macht. Die Lead-Kriterien
  liegen bewusst in einer eigenen Datei: So kann der Vertrieb sie ändern, ohne die
  Anweisungen anzufassen. Ändert zwischen zwei Tests immer nur **eine** Regel, sonst wisst
  ihr nicht, welche gewirkt hat.
solution: |
  Mögliche Beobachtungen – achtet darauf, welche davon bei euch auftreten:

  | Prüfpunkt | mögliches Ergebnis | Gegenmittel |
  |---|---|---|
  | KI-Hinweis | erscheint, wenn er in den Anweisungen steht; fehlt evtl. beim Einstieg über einen Startprompt | Begrüßung als erste Regel, auch für Startprompts |
  | eine Frage pro Nachricht | anfangs eingehalten, später gebündelt | Regel in Großbuchstaben, am Ende wiederholen |
  | „offen" statt Erfundenem | Zeitrahmen wird zu „März" konkretisiert | Regel „übernimm Angaben wörtlich" |
  | Rabattfrage | korrekt abgelehnt oder „in der Regel gibt es Staffelpreise" | Regel: keine Aussagen zu Preismodellen |
  | Bestätigung | wird übersprungen | Steckbrief erst nach ausdrücklichem „ja" |
  | Feldnamen | Reihenfolge weicht von der Vorlage ab | Vorlage in die Anweisungen kopieren oder Datei eindeutig benennen |

  Ein guter Steckbrief für diesen Fall:

  ```text
  LEAD-STECKBRIEF
  firma: [Name Fahrradladen]
  branche: Fahrradhandel
  einsatzzweck: offen
  produkte: Softshelljacken
  menge: 12 Personen
  veredelung: Logo, Details offen
  zeitrahmen: Frühjahr, noch offen
  rolle_anfragende: Inhaberin, entscheidet
  kontakt_weg: offen
  lead_stufe_vorschlag: C
  begründung: unter 25 Teilen, Zeitrahmen offen
  offene_punkte: Einsatzzweck, Logo-Datei, Kontaktweg
  einwilligung_kontakt: offen
  ```

  Fragt der Agent klug nach weiteren Bedarfen (Saisonkräfte, zweiter Standort), gehört das
  in `offene_punkte`.

  Bewertungskriterien: drei Wissensdateien ohne Preise im Ordner „CRM-Bot"; Agent mit
  Anweisungen, Wissen und Startprompts gebaut und mit der Gruppe geteilt; Rollenspiel mit
  unvollständigen Antworten und Rabattfrage; genau eine Änderung zwischen erstem und zweitem
  Test, Wirkung im Protokoll festgehalten; der zweite Test wurde von einer anderen Person
  gespielt, und Unterschiede zwischen beiden Durchläufen wurden benannt.
