title: Eine Wissensdatei aufbereiten
difficulty: 3
question: |
  Der Fjordlicht-Styleguide liegt als Fließtext vor (Auszug):

  ```text
  Fjordlicht ist mehr als eine Marke - es ist ein Gefühl. Gegründet 2015
  von zwei Freunden nach einer Wanderung in Norwegen, steht Fjordlicht für
  Ruhe. Unsere Farben sind Moosgrün (#4A5D3A) und Nebelgrau. Wir sprechen
  unsere Kundinnen und Kunden mit Du an, so wie man es unter Wandernden tut.
  Wir vermeiden Superlative wie "der beste" oder "einzigartig", weil sie
  nicht zu unserer Bescheidenheit passen. Unsere Fotos zeigen echte Menschen.
  Schreibe in kurzen Sätzen. Begriffe wie "umweltfreundlich" oder "grün"
  verwenden wir nicht ohne konkreten Nachweis. Statt "Abenteuer" sagen wir
  lieber "draußen sein". Unsere Schrift ist die Fjord Sans.
  ```

  1. **Selbst aufbereiten:** Lege in Word die Datei **„Fjordlicht_Markenstimme_2026-10.docx"** im
     Ordner „Fjordlicht-Kurs" an – als Wissensdatei für einen **Text**-Assistenten: sinnvolle
     Abschnitte mit Word-Überschriftenformaten (keine Textfelder), nur relevante Inhalte, eindeutige
     Regeln, mindestens ein Beispiel vorher/nachher.
  2. Begründe, welche Inhalte du entfernt hast und warum.
  3. **Copilot-Fassung:** Füge den Auszug in ein zweites, leeres Word-Dokument ein und lass ihn mit
     **Copilot in Word** zur Wissensdatei umschreiben. Vergleiche mit deiner Fassung: Wo hat Copilot
     etwas hinzugefügt, das nicht im Original steht?
  4. **Auffindbarkeit testen:** Stelle in **Copilot Chat** zwei Fragen an deine Datei (per `/` einbinden):
     „Welches Wort verwenden wir statt ‚Abenteuer'?" und „Dürfen wir ‚grün' schreiben?" Findet
     Copilot die Antworten eindeutig?
tip: |
  Eine Wissensdatei ist kein Markenbuch. Frage bei jedem Satz: Hilft das dem Assistenten, einen
  Text zu schreiben oder zu prüfen? Achte im Copilot-Vergleich auf „hilfreiche" Ergänzungen – sie
  sind genau das Problem. Der Auffindbarkeitstest zeigt dir, was ein Agent später aus der Datei
  herausholt: nur das, was klar gegliedert dasteht.
solution: |
  Mögliche Wissensdatei (Überschriften als Word-Formatvorlagen):

  ```text
  Fjordlicht_Markenstimme_2026-10
  Gilt für: alle Texte (Web, Newsletter, Social). Stand: Oktober 2026.

  Grundhaltung
  Ruhig, bescheiden, ehrlich.
  Anrede
  Du-Ansprache.
  Satzbau
  Kurze Sätze.
  Wortwahl
  Vermeiden: Superlative ("der beste", "einzigartig").
  Vermeiden ohne konkreten Nachweis: "umweltfreundlich", "grün".
  Bevorzugt: "draußen sein" statt "Abenteuer".
  Beispiel
  So nicht: "Das ultimative Abenteuer-Fleece - einzigartig grün!"
  Besser: "Ein Fleece für kühle Morgen draußen."
  ```

  Entfernt: Gründungsgeschichte (für Produkttexte unnötig, könnte aber in eine eigene Datei
  „Über uns" wandern), Farbcodes, Schrift, Fotohinweis (gehören in einen Bildsprache-Guide,
  Kap. 32), „mehr als eine Marke – ein Gefühl" (keine Regel).

  Typische Copilot-Zusätze im Vergleich: zusätzliche Tabu-Wörter, eine erfundene Zielgruppe, eine
  Regel zu Emojis oder Hashtags, eine „Tonalität: inspirierend". Jede dieser Ergänzungen wäre ab
  dann verbindlich für den Assistenten – ohne dass das Team sie je beschlossen hat. Deshalb gilt:
  Copilot darf beim Aufbereiten helfen, aber jede Regel braucht eine Quelle im Original.

  Im Auffindbarkeitstest beantwortet Copilot beide Fragen bei der gegliederten Datei meist direkt
  und mit Verweis auf die Datei. Wer denselben Test mit dem unbearbeiteten Fließtext macht, bekommt
  oft eine korrekte, aber vermischte Antwort – etwa Farbcodes neben der Wortwahl.

  Bewertungskriterien: Gliederung mit echten Überschriftenformaten, nur textrelevante Inhalte,
  Beispiel vorhanden, mindestens eine Copilot-Ergänzung erkannt und begründet abgelehnt,
  Auffindbarkeitstest dokumentiert.
