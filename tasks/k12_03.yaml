title: Copilot-Bewertung von Ideen in Excel prüfen
difficulty: 3
question: |
  Diese Übung machst du in **Copilot Chat** und **Copilot in Excel**.

  1. Lass dir in Copilot Chat mit einem Ideen-Fächer (Zielgruppe × Format × Anlass) **15
     Content-Ideen** für Fjordlicht im Januar erzeugen. Verweise auf `/Fjordlicht-Basisdaten`
     (falls nicht vorhanden: Kap. 11, Kurzübung 1).
  2. Lass Copilot die Ideen nach dem gewichteten Bewertungsraster aus Abschnitt 12.6 bewerten
     (Zielgruppenrelevanz 3, Markenpassung 3, Aufwand 2, Wiederverwertbarkeit 1, Ziel-Beitrag 2;
     Skala 1–5) und übernimm Ideen und Punkte in eine Excel-Tabelle im Ordner „Fjordlicht-Kurs".
  3. Bewerte **dieselben** 15 Ideen in eigenen Spalten unabhängig selbst, ohne auf die
     Copilot-Punkte zu schauen (z. B. Spalten vorher ausblenden).
  4. Lass **Copilot in Excel** zwei Spalten für die gewichtete Gesamtpunktzahl (Copilot und
     eigene) und eine Spalte für die Differenz vorschlagen, die Ideen mit der größten Abweichung
     hervorheben und beide Rangfolgen nebeneinanderstellen.
  5. Erkläre die drei größten Abweichungen und verbessere den Bewertungsprompt so, dass diese
     Schwächen kleiner werden. Teste den neuen Prompt in einem neuen Chat.
  6. Speichere den verbesserten Prompt in der **Prompt Gallery** (falls in eurer Umgebung
     freigegeben) oder in eurer Prompt-Bibliothek (Kap. 10).
tip: |
  Prüfe die Formeln, die Copilot in Excel vorschlägt, bevor du sie einfügst: Stimmen die Gewichte,
  stimmen die Spaltenbezüge? Typische Abweichungen entstehen bei Aufwand und Markenpassung, weil
  Copilot eure Ressourcen und eure Geschichte nicht kennt. Achte auch darauf, ob die
  Copilot-Punktzahlen auffällig eng beieinanderliegen – ein Blick auf Minimum und Maximum genügt.
solution: |
  Beispielprompt für Copilot in Excel:

  ```text
  Füge eine Spalte "Gesamt Copilot" hinzu: Relevanz*3 + Marke*3 + Aufwand*2
  + Wiederverwertbarkeit*1 + Ziel*2 aus den Copilot-Spalten. Dasselbe als
  "Gesamt Team" aus meinen Spalten. Füge eine Spalte "Differenz" hinzu und
  hebe die drei Zeilen mit der größten absoluten Differenz hervor.
  ```

  Typische Beobachtungen:

  - Copilot vergibt **wenig Spreizung** (viele Ideen zwischen 3,5 und 4,2) und bewertet eigene
    Ideen eher wohlwollend.
  - **Aufwand** wird unterschätzt, etwa bei Videoformaten, weil Drehaufwand und Freigaben nicht
    bekannt sind.
  - **Markenpassung** wird überschätzt, wenn eine Idee formal zu „nachhaltig" passt, aber
    Greenwashing-Risiko hat (z. B. „Wie Fjordlicht das Klima schützt").
  - Bei **Zielgruppenrelevanz** liegt Copilot oft nah am Team.

  Verbesserter Bewertungsprompt (Auszug):

  ```text
  Bewerte die Ideen nach dem Raster unten. Regeln:
  - Erzwinge eine Rangfolge: keine zwei Ideen mit gleicher Gesamtpunktzahl.
  - Nutze die volle Skala von 1 bis 5.
  - Aufwand: Unser Team hat 5 Personen, keine eigene Videoproduktion,
    Freigaben dauern 3 Tage.
  - Markenpassung: Vergib höchstens 2 Punkte, wenn die Idee eine
    Nachhaltigkeitsaussage braucht, die nicht unter "Belegte Claims" in
    /Fjordlicht-Basisdaten steht.
  - Nenne für die Top 3 jeweils das stärkste Gegenargument.
  ```

  Bewertungskriterien: eigene Bewertung unabhängig erstellt, Formeln von Copilot in Excel
  geprüft, mindestens drei konkrete Abweichungen mit Ursache benannt, verbesserter Prompt
  enthält Kontext zu Ressourcen und Claims sowie eine Regel gegen eng beieinanderliegende
  Punktzahlen und ist für das Team abgelegt. Lernziel: KI-Bewertungen sind Vorsortierung, keine
  Entscheidung.
