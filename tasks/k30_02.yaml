title: Ein Baustein nach dem anderen
difficulty: 2
question: |
  Diese Übung machst du direkt in einem Bildwerkzeug (ChatGPT Images, Gemini, Copilot oder
  Firefly). Ziel ist ein Pinterest-Pin für den Blogartikel „Herbstwanderung mit Kindern: 7 Tipps"
  im Blog „Draußen-Notizen" von Fjordlicht – oder für ein Thema deiner Wahl.

  1. **Stufe 0:** Schreibe den Prompt so knapp, wie du ihn spontan tippen würdest.
  2. **Stufe 1:** Ergänze Motiv, Umgebung und Stil.
  3. **Stufe 2:** Ergänze Licht, Komposition, Kamera, Farbstimmung und Format (Pinterest:
     Hochformat 2:3, oben Platz für den Titel).
  4. **Variablentest:** Ändere in Stufe 2 nur **einen** Baustein – zuerst das Licht (z. B. von
     „diffus, bedeckt" zu „goldene Stunde"), danach in einem zweiten Durchgang nur die
     Perspektive.

  Halte in einer Tabelle fest, was sich bei jeder Stufe und jeder Variation am Bild geändert hat.
tip: |
  Starte jede Stufe in einem neuen Chat oder mit leerem Verlauf. Sonst übernimmt das Werkzeug
  Informationen aus den vorherigen Bildern, und du misst nicht mehr die Wirkung deines Prompts.
solution: |
  Beispiel für Stufe 2:

  ```text
  Dokumentarisches Foto: Ein Vater und zwei Kinder (etwa 6 und 9 Jahre) in
  Regenjacken wandern auf einem Waldweg, das jüngere Kind trägt einen
  Stock. Licht: bedeckter Herbsttag, weiches diffuses Licht. Komposition:
  Familie in der unteren Bildhälfte, von schräg hinten, obere Bildhälfte
  ruhiges Blätterdach für einen Titel. Kamera: Totale, Augenhöhe.
  Farben: gedeckte Orange-, Braun- und Grüntöne. Format: Hochformat 2:3.
  ```

  | Variante | Typische Beobachtung |
  |---|---|
  | Stufe 0 | Durchschnittsbild, oft frontal und gestellt, kein Platz für Text |
  | Stufe 1 | Situation stimmt, Ausschnitt und Format zufällig |
  | Stufe 2 | kanaltauglich, oben ruhige Fläche, markengerechte Farben |
  | Licht geändert | Stimmung deutlich wärmer, oft auch kontrastreicher; Gesichter teils im Schatten |
  | Perspektive geändert | Wirkung verschiebt sich stark (z. B. Froschperspektive: Kinder wirken größer, abenteuerlicher) |

  Eine gute Bearbeitung zeigt, dass **ein** geänderter Baustein sichtbar wirkt – und dass Licht
  und Perspektive die Stimmung oft stärker verändern als zusätzliche Adjektive.
