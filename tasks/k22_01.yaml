title: Unproblematisch oder Spam? – Bewertung im Paar
difficulty: 1
question: |
  **Gruppe:** Paare · **Dauer:** etwa 15–20 Minuten · **Format:** Rollen mit Wechsel
  (Fragende und Quellenprüferin) · **Am Ende liegt vor:** eine gemeinsame Bewertung der sechs
  Fälle mit geprüfter Primärquelle und ein Streitfall für das Plenum.

  Bewertet die folgenden Vorhaben aus Sicht von Googles Haltung zu KI-Inhalten (Abschnitt 22.4):
  **eher unproblematisch** oder **eher problematisch** (scaled content abuse, Täuschung)?
  Begründet jeweils in einem Satz.

  1. Fjordlicht lässt von der KI 300 Seiten „Regenjacke kaufen in [Stadt]" erzeugen, die sich
     nur im Ortsnamen unterscheiden.
  2. Die KI überarbeitet Titles und Meta-Descriptions von 40 Blogartikeln, eine Redakteurin
     prüft jede Variante.
  3. Die KI schreibt „Erfahrungsberichte" von Kundinnen, die es nicht gibt, für die Produktseite
     der Wanderhose „Vidde".
  4. Die Werkstattleiterin diktiert ihre Erfahrungen zu Reißverschlussschäden, die KI macht
     daraus einen gegliederten Ratgeber, den sie prüft.
  5. Die KI erzeugt Schema.org-Daten mit 4,8 Sternen für den Rucksack „Tind", obwohl im Shop
     noch keine Bewertungen stehen.
  6. Englische Blogartikel werden mit KI ins Deutsche übersetzt und von einer Muttersprachlerin
     redigiert.

  So geht ihr vor:

  1. **Allein (3 Minuten):** Jede Person bewertet zuerst selbst.
  2. **Runde 1:** Person A stellt in **Copilot Chat** mit dem Umschalter auf **Web** die Frage:
     „Was versteht Google unter scaled content abuse, und wie steht Google zu KI-erzeugten
     Inhalten? Antworte mit Quellen." Person B ist **Quellenprüferin**: Sie öffnet mindestens eine
     genannte Quelle und prüft, ob sie von Google Search Central stammt und das Behauptete
     tatsächlich sagt.
  3. **Runde 2 (Rollentausch):** Person B lässt Copilot die sechs Fälle anhand dieser Quellen
     bewerten. Person A prüft, ob die Begründungen zur Primärquelle passen.
  4. **Abgleich:** Vergleicht eure beiden Einzelbewertungen und die Copilot-Bewertung. Einigt
     euch auf eine gemeinsame Bewertung. Den Fall, bei dem ihr am längsten diskutiert habt,
     stellt ihr in einer Minute im Plenum vor.
tip: |
  Der Maßstab ist nicht, ob KI beteiligt war, sondern ob die Seite Menschen hilft und ehrlich
  ist. Prüft außerdem: Entspricht das, was die Suchmaschine sieht, dem, was auf der Seite steht?
  Bei der Quellenprüfung zählt die Primärquelle von Google, nicht ein SEO-Blog, der sie
  zusammenfasst. Achtet darauf, ob Copilot die Fälle 4 und 6 vorsichtiger bewertet, nur weil KI
  beteiligt ist.
solution: |
  | Nr. | Bewertung | Begründung |
  |---|---|---|
  | 1 | problematisch | Schablonenseiten ohne Mehrwert, klassischer Fall von scaled content abuse |
  | 2 | unproblematisch | KI unterstützt, Mensch prüft, Inhalt wird präziser zusammengefasst |
  | 3 | problematisch | erfundene Erfahrungen täuschen Kundinnen; zudem Irreführung nach UWG |
  | 4 | unproblematisch | echte Erfahrung (E-E-A-T), KI übernimmt nur die Struktur |
  | 5 | problematisch | strukturierte Daten widersprechen dem sichtbaren Inhalt, Verstoß gegen Richtlinien |
  | 6 | unproblematisch | Übersetzung mit menschlicher Prüfung schafft Mehrwert für deutschsprachige Leserinnen |

  Gemeinsamer Nenner der problematischen Fälle: Masse ohne Mehrwert oder Aussagen, die nicht
  stimmen. In beiden Fällen ist die KI nur das Werkzeug – das Problem wäre dasselbe, hätte ein
  Mensch die Texte geschrieben.

  Zum Copilot-Schritt: Eine gute Antwort verweist auf die Spam-Richtlinien und die Hinweise zu
  KI-Inhalten in Google Search Central. Nennt Copilot nur Sekundärquellen, fragt gezielt nach der
  Originalseite. Bewertet Copilot Fall 4 oder 6 vorsichtiger („kann problematisch sein"), hilft die
  Rückfrage: „Was ist laut Google das entscheidende Kriterium?"

  Bewertungskriterien:

  - Beide haben vor dem Copilot-Schritt selbst bewertet.
  - Mindestens eine Primärquelle von Google Search Central wurde geöffnet und mit der
    Copilot-Aussage abgeglichen.
  - Die gemeinsame Bewertung begründet jeden Fall mit Hilfreichkeit und Ehrlichkeit, nicht mit
    der Frage, ob KI beteiligt war.
  - Abweichungen zwischen den beiden Personen und Copilot sind benannt; der Plenumsfall erklärt,
    woran sich die Diskussion entzündet hat.
