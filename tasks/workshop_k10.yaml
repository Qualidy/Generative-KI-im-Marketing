title: Die Prompt-Bibliothek für das Fjordlicht-Marketing
difficulty: 4
question: |
  **Szenario:** Das fünfköpfige Marketingteam der Fjordlicht GmbH hat in den letzten Wochen viele
  Prompts entwickelt – verstreut über Chatverläufe, Notizen und Mails. Die Teamleitung beauftragt
  dich, daraus bis Monatsende eine Prompt-Bibliothek zu bauen, die ab sofort verbindlich ist und die
  auch eine neue Kollegin am ersten Tag nutzen kann. Du kannst alternativ die Bibliothek für ein
  Unternehmen deiner Wahl anlegen.

  ```text
  Rahmen:
  Kanäle: Newsletter, Instagram, TikTok, LinkedIn (B2B), Pinterest, Blog, Webshop.
  Vorhanden: Microsoft 365, ChatGPT-Business-Konten, keine weitere Software.
  Markenstimme: ruhig, ehrlich, naturverbunden, Du-Ansprache, keine Superlative.
  Nachhaltigkeitsaussagen nur aus der freigegebenen Claim-Liste.
  Nur Platzhalter, keine echten Kunden- oder Preisdaten.
  ```

  ---

  **Runde 1 – Struktur und Einträge.** Lege eine Kategorienstruktur und eine Benennungskonvention
  fest. Erstelle **acht** vollständige Einträge mit allen Feldern aus Abschnitt 10.2, verteilt über
  mindestens vier Kanäle und mindestens drei Aufgabentypen (z. B. Entwurf, Überarbeitung, Prüfung).
  Mindestens ein Eintrag ist ein **Claim-Check**-Prompt, der für alle Texte gilt. Teste jeden Eintrag
  mindestens zweimal.

  **Runde 2 – Ablage und Governance.** Entscheide über den Ablageort und begründe die Wahl mit den
  Kriterien aus Abschnitt 10.4. Lege Rollen, Freigabeweg, Versionierungsregel, Datenklassen und
  einen Pflegerhythmus fest.

  **Runde 3 – Die Komplikation.** Beim ersten Durchgang fällt auf: Von der Instagram-Caption
  kursieren drei Versionen, eine davon enthält echte Bestelldaten eines Kunden als Beispiel, und
  eine Kollegin hat die Hashtag-Regel ohne Test geändert, worauf die Captions doppelt so lang
  wurden. Bereinige die Lage: Lege fest, welche Version gilt, entferne die vertraulichen Daten,
  rekonstruiere die Versionshistorie und ergänze eine Regel, die so etwas künftig verhindert.

  **Runde 4 – Entscheidung unter Abwägung.** Die Teamleitung möchte die Bibliothek abschaffen,
  sobald der Content-Assistent (Kap. 26) läuft: „Dann steckt doch alles im Assistenten."
  **Widersprich** dort, wo die Bibliothek weiterhin unverzichtbar ist, erkenne an, welche Vorlagen
  tatsächlich in den Assistenten wandern sollten, und entscheide begründet, wie Bibliothek und
  Assistent künftig zusammenspielen.

  **Deliverable:**

  1. Kategorienstruktur, Benennungskonvention und acht getestete Einträge
  2. Entscheidung zum Ablageort und Governance-Dokument (maximal eine Seite)
  3. Bereinigungsprotokoll zu Runde 3 mit gültiger Version, Versionshistorie und neuer Regel
  4. begründete Entscheidung zum Zusammenspiel von Bibliothek und Assistent

  **Fertig bist du erst, wenn** jeder Eintrag ein Beispielergebnis, anwendbare Prüfpunkte,
  Testfälle und eine Datenklasse hat, keine Vorlage vertrauliche Daten enthält, eine Person ohne
  Vorwissen zwei beliebige Einträge ohne Rückfrage nutzen kann und deine Entscheidung aus Runde 4
  die Werkzeugabhängigkeit ausdrücklich berücksichtigt.
tip: |
  Der Lernkern: Eine Bibliothek lebt von Pflege und Regeln, nicht von der Menge der Einträge. In
  Runde 3 zeigt sich, warum Versionierung und „Änderung nur mit Test" keine Bürokratie sind. In
  Runde 4 hilft die Frage: Was passiert mit unserem Wissen, wenn sich das Werkzeug ändert – wie beim
  angekündigten Übergang von Custom GPTs zu Plugins?
solution: |
  Bewertungskriterien: (1) Struktur und Benennung sind konsistent, die acht Einträge sind vollständig,
  getestet und decken Kanäle und Aufgabentypen ab, inklusive eines funktionierenden Claim-Checks;
  (2) Ablageort und Governance passen zu Teamgröße und vorhandenen Werkzeugen, Rollen und
  Freigabeweg sind eindeutig; (3) die Bereinigung legt eine gültige Version fest, entfernt
  vertrauliche Daten vollständig, macht die Historie nachvollziehbar und ergänzt eine wirksame Regel
  wie „Änderung nur durch die Eigentümerin nach Testlauf"; (4) die Entscheidung in Runde 4 sieht die
  Bibliothek als werkzeugunabhängige Quelle und Dokumentation, überführt häufige Vorlagen in den
  Assistenten und regelt, wo Änderungen zuerst erfolgen.

  Lernziel: Eine teamtaugliche Prompt-Bibliothek mit Struktur, Metadaten, Versionierung und
  Governance aufbauen und ihr Verhältnis zu KI-Assistenten begründet festlegen.
