title: KI-Rechtsauskunft mit Quellen prüfen – Arbeit gegen Web
difficulty: 3
question: |
  **Gruppenarbeit:** 4 Personen in zwei Untergruppen, ca. 30 Minuten, in **Copilot Chat**. Am
  Ende liegen eine gemeinsame Bewertung der fünf Aussagen, eine geprüfte Quellenliste und drei
  Teamregeln in einer geteilten **Copilot Page** vor.

  Ein Kollege hat einen KI-Chat gefragt, was Fjordlicht beim KI-Einsatz rechtlich beachten muss,
  und will die Antwort als Teamrichtlinie verschicken. Auszug:

  ```text
  1. Ab 2026 muss jeder KI-generierte Inhalt mit "KI-generiert" gekennzeichnet werden.
  2. KI-Bilder gehören dem Nutzer, der den Prompt geschrieben hat, und sind urheberrechtlich
     geschützt.
  3. Das Training von KI mit fremden Werken ist in Deutschland seit dem GEMA-Urteil endgültig
     verboten.
  4. Wenn das Tool die kommerzielle Nutzung erlaubt, kann nichts passieren.
  5. Chatbots müssen nicht als KI gekennzeichnet werden, wenn sie freundlich formulieren.
  ```

  1. **Eigene Bewertung:** Bewertet in der Gruppe jede Aussage: **richtig**, **teilweise
     richtig** oder **falsch** – mit Begründung und Verweis auf den Abschnitt in diesem Kapitel.
  2. **Gegenprobe Arbeit gegen Web:** Untergruppe A stellt in Copilot Chat im Modus **Arbeit**
     die Frage „Was muss ein deutsches Marketingteam beim KI-Einsatz rechtlich beachten?",
     Untergruppe B stellt dieselbe Frage im Modus **Web**. Vergleicht: Welche Fehler aus dem
     Auszug tauchen wieder auf, welche verschwinden? Welche Antwort nennt Quellen?
  3. **Quellencheck mit Arbeitsteilung:** Untergruppe B lässt im Modus **Web** die Aussagen 1
     und 3 mit Quellenangaben prüfen. Jede Person der Gruppe übernimmt mindestens eine der
     genannten Quellen, öffnet sie und prüft: Ist es eine Primärquelle (z. B. EUR-Lex,
     Gerichtsmitteilung) oder eine Sekundärquelle? Trägt die Quelle die Aussage wirklich? Werden
     Gericht, Datum und **Rechtskraft** korrekt genannt?
  4. **Teamregeln:** Eine Person übernimmt die Antwort aus Schritt 3 in eine **Copilot Page**
     und teilt sie. Ergänzt dort gemeinsam eure Quellenbewertung und drei Regeln, wie euer Team
     KI-Antworten zu Rechtsfragen künftig behandelt. Jede Person speichert einen Prüf-Prompt
     dazu in ihrer **Prompt Gallery**.
  5. **Abschluss:** Nennt im Plenum die Quelle, die euch am meisten überrascht hat – positiv
     oder negativ.
tip: |
  Solche Fehler entstehen selten aus dem Nichts. Meist wird eine richtige Teilaussage
  übergeneralisiert oder ein Urteil ohne seinen Status wiedergegeben. Achtet bei Urteilen immer
  auf Gericht, Datum und Rechtskraft. Quellenangaben machen eine Antwort überprüfbar, nicht
  automatisch richtig – öffnet die Quelle und lest nach, ob sie die Aussage wirklich trägt.
  Achtet beim Vergleich der Modi darauf, ob Fristen und der Status von Verfahren in beiden
  Antworten gleich dargestellt werden.
solution: |
  | Nr. | Bewertung | Begründung |
  |---|---|---|
  | 1 | falsch | Art. 50 verlangt Offenlegung bei Deepfakes und Texten zu öffentlichem Interesse ohne redaktionelle Verantwortung; normale Werbetexte meist nicht (39.4) |
  | 2 | falsch | ohne menschliche schöpferische Leistung i. d. R. kein Schutz nach § 2 Abs. 2 UrhG (39.1) |
  | 3 | falsch | TDM nach § 44b UrhG mit Opt-out; GEMA ./. OpenAI betrifft Memorisierung und ist nicht rechtskräftig (39.2) |
  | 4 | teilweise richtig | Bedingungen klären die Nutzung, nicht die Rechte Dritter im Output (39.3) |
  | 5 | falsch | Art. 50 Abs. 1: Hinweis, sofern KI-Interaktion nicht offensichtlich ist (39.4) |

  Mögliche Beobachtungen beim Vergleich: Die Antwort im Modus **Web** enthält Quellenangaben und
  kann dadurch aktuellere Fristen und Urteile nennen, übernimmt aber unter Umständen Fehler aus
  schwachen Quellen. Die Antwort im Modus **Arbeit** lässt sich nicht an Webquellen
  nachprüfen; gerade Daten und der Status von Verfahren sollten dann besonders kritisch
  kontrolliert werden.

  Beispiel-Prompt für den Quellencheck (Modus Web):

  ```text
  Prüfe zwei Aussagen zum deutschen und europäischen Recht und belege jede
  Einschätzung mit Quellen. Bevorzuge Primärquellen (EUR-Lex, Gesetzestexte,
  Pressemitteilungen der Gerichte). Nenne bei Urteilen Gericht, Datum,
  Aktenzeichen, soweit verfügbar, und ob das Urteil rechtskräftig ist.
  Aussage A: [Aussage 1]
  Aussage B: [Aussage 3]
  Kennzeichne, wo Quellen sich widersprechen oder du unsicher bist.
  ```

  Worauf die Gruppe beim Quellencheck achten sollte: ob Primär- und Sekundärquellen (Kanzlei-Blogs,
  News) gemischt werden und ob bei Aussage 3 der Status „nicht rechtskräftig" genannt wird – genau
  hier lohnt die eigene Kontrolle.

  Mögliche Teamregeln:

  1. KI-Antworten zu Rechtsfragen sind Recherche-Einstieg, keine Richtlinie.
  2. Jede genannte Norm, Frist und jedes Urteil wird an einer Primärquelle (z. B. EUR-Lex) oder
     durch die Rechtsabteilung geprüft – inklusive Rechtskraft.
  3. Interne Richtlinien zu Recht gibt nur frei, wer dafür benannt ist.

  Bewertungskriterien:

  - Alle fünf Aussagen sind korrekt eingeordnet; Aussage 4 ist als teilweise richtig
    differenziert.
  - Der Vergleich Arbeit gegen Web ist konkret; Abweichungen zwischen den Antworten der beiden
    Untergruppen sind benannt und erklärt.
  - Jede Person hat mindestens eine Quelle selbst geöffnet und als Primär- oder
    Sekundärquelle eingeordnet; die Bewertung steht in der gemeinsamen Page.
  - Die Teamregeln sind konkret anwendbar.
