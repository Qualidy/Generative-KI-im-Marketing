title: Newsletter-Betreffzeilen arbeitsteilig mit Copilot in Excel auswerten
difficulty: 2
question: |
  **Gruppe:** 3–4 Personen · **Dauer:** etwa 30 Minuten · **Format:** Arbeitsteilung in einer
  geteilten Excel-Datei · **Am Ende liegen vor:** „Newsletter-Analyse.xlsx" mit Ergebnistabelle,
  Diagramm und nachgerechnetem Wert sowie zwei gemeinsam formulierte Testhypothesen.

  **Vorbereitung (eine Person):** Speichere den folgenden fiktiven Fjordlicht-Export als
  Textdatei `newsletter.csv`, öffne sie in Excel und speichere sie als „Newsletter-Analyse.xlsx"
  in deinem OneDrive-Ordner „Fjordlicht-Kurs". Formatiere den Bereich als Tabelle, prüfe, ob die
  Zahlen als Zahlen erkannt wurden, und teile die Datei mit der Gruppe.

  ```text
  datum;betreff;thema;öffnungsrate;klickrate
  2026-01-08;Was dein Fleece im Winter wirklich braucht;Pflege;41,2;3,9
  2026-01-22;Neu: Skog Fleece in Moosgrün;Produkt;35,8;4,4
  2026-02-05;Wie viel Regen hält eine Regenjacke aus?;Wissen;43,5;3,1
  2026-02-19;Sølv – jetzt wieder da;Produkt;34,9;4,8
  2026-03-05;Drei Wanderwege rund um Münster;Touren;39,7;2,6
  2026-03-19;Warum wir keine Neuware verbrennen;Haltung;44,1;2,2
  2026-04-02;Frühjahrsputz für deine Wanderhose?;Pflege;42,0;3,7
  2026-04-16;Vidde: die Hose für lange Tage;Produkt;36,3;5,0
  2026-04-30;Packliste für dein erstes Mikroabenteuer;Touren;40,8;3,3
  2026-05-14;Tind Rucksack: 20 Prozent leichter;Produkt;35,1;4,6
  ```

  **Aufteilung (alle arbeiten gleichzeitig in der geteilten Datei mit Copilot in Excel):**

  - **Person 1 – Frageform:** Lass Copilot eine Formelspalte „frage" vorschlagen (ja, wenn der
    Betreff mit „?" endet), prüfe die Formel vor dem Einfügen und lass Copilot Öffnungs- und
    Klickrate nach „frage" vergleichen, mit Fallzahlen.
  - **Person 2 – Thema:** Lass Copilot Öffnungs- und Klickrate nach Thema zusammenfassen
    (Produkt gegen alle übrigen Themen), mit Fallzahlen. Nutze einen Prompt nach dem
    P.R.O.M.P.T.-Framework (Kap. 5).
  - **Person 3 – Diagramm:** Lass Copilot ein Diagramm zu Öffnungs- und Klickrate nach Thema
    erstellen und prüfe, ob Achsen und Beschriftungen stimmen.
  - **Person 4 – Prüferin** (bei drei Personen übernimmt Person 3 diese Rolle zusätzlich):
    Rechne einen Mittelwert aus Person 1 und einen aus Person 2 selbst mit `MITTELWERTWENN`
    nach und trage beide Werte samt Formel in ein Blatt „Prüfung" ein.

  **Zusammenführen (10 Minuten):** Stellt euch die Ergebnisse gegenseitig vor. Formuliert
  gemeinsam zwei **Hypothesen** für einen A/B-Test (Kap. 16) – jeweils mit der Einschränkung,
  warum die Daten allein nicht reichen. Wer das „Fjordlicht-Testlog.xlsx" aus Kap. 16 angelegt
  hat, trägt die Hypothesen dort als geplante Tests ein.
tip: |
  Prüft nach dem Öffnen, ob Excel die Zahlen als Zahlen erkannt hat (Dezimalkomma, Semikolon) –
  eine falsch eingelesene Spalte ist die häufigste Fehlerquelle (Abschnitt 20.4). Copilot in Excel
  braucht eine als Tabelle formatierte Datei in OneDrive oder SharePoint. Achtet beim
  Zusammenführen darauf, ob die Befunde von Person 1 und Person 2 zusammenpassen – und schaut
  genau hin, was mit der Klickrate passiert: Was öffnet, ist nicht unbedingt das, was klickt.
solution: |
  Beispiel-Prompt für Person 2 (Copilot in Excel):

  ```text
  Persona: Du bist Datenanalystin im Content-Marketing.
  Request: Vergleiche Öffnungs- und Klickrate nach "thema" (Produkt gegen
  alle übrigen Themen).
  Output: Übersichtstabelle mit Mittelwert und Anzahl je Gruppe, danach
  drei Befunde in Stichpunkten.
  Modifier: Nenne immer die Fallzahl, kennzeichne Gruppen unter 10 Fällen als
  unsicher, formuliere Zusammenhänge, keine Ursachen.
  Purpose: Hypothesen für A/B-Tests im nächsten Quartal.
  Tone: sachlich.
  ```

  Erwartbares Ergebnis (gerundet):

  | Gruppe | n | Öffnungsrate | Klickrate |
  |---|---|---|---|
  | Frage im Betreff | 2 | 42,8 | 3,4 |
  | keine Frage | 8 | 38,5 | 3,9 |
  | Thema Produkt | 4 | 35,5 | 4,7 |
  | übrige Themen | 6 | 41,9 | 3,1 |

  Nachrechnen, z. B.: `=MITTELWERTWENN(Tabelle1[frage];"ja";Tabelle1[öffnungsrate])` ergibt 42,75
  (Tabellen- und Spaltennamen ggf. anpassen).

  Befund: Produkt-Betreffzeilen werden seltener geöffnet, aber häufiger geklickt – wer öffnet,
  hat Kaufinteresse. Alle Gruppen haben unter 10 Fällen, also **unsicher**. Beim Zusammenführen
  sollte auffallen: Beide Frage-Betreffzeilen gehören zu Themen außer Produkt – Frageform und
  Thema sind vermischt.

  Hypothesen: (1) „Ein Produkt-Newsletter mit Frage-Betreff erzielt eine höhere Öffnungsrate
  als mit Produktnamen-Betreff, ohne Klickrate zu verlieren." (2) „Ein Wissens-Newsletter mit
  einem Produkt-Kasten am Ende erzielt mehr Klicks als ohne." Die Daten reichen nicht als
  Beleg, weil Thema und Betreffform vermischt sind und die Fallzahl klein ist.

  Bewertungskriterien:

  - Daten korrekt eingelesen, Fallzahlen in jeder Ergebnistabelle, Formel für „frage" vor dem
    Einfügen geprüft.
  - Zwei selbst nachgerechnete Werte im Blatt „Prüfung"; Abweichungen zu Copilot sind benannt
    und erklärt.
  - Die Teilergebnisse wurden zusammengeführt; die Gruppe hat erkannt, dass Frageform und Thema
    sich überschneiden.
  - Hypothesen statt Regeln, jeweils mit genau einer veränderten Variable.
