title: Keyword-Cluster für die Wanderhose
difficulty: 2
question: |
  Diese Übung machst du direkt im KI-Werkzeug. Fjordlicht will die Wanderhose „Vidde" und das
  Thema Wandern im Blog besser sichtbar machen.

  1. Formuliere einen Prompt nach dem P.R.O.M.P.T.-Framework (Kap. 5), der mindestens 40
     Suchbegriffe rund um „Wanderhose" sammelt und in 5 bis 8 Cluster ordnet – mit Spalten für
     Suchintention und passenden Seitentyp.
  2. Prüfe das Ergebnis: Hat die KI trotz Verbot Suchvolumina oder Schwierigkeitswerte genannt?
     Gibt es Dubletten, unrealistische Begriffe oder Wettbewerbermarken?
  3. Wähle **ein** Cluster aus und bestimme dafür eine Pillar Page und drei Detailartikel.
  4. Notiere, welche Werte du im nächsten Schritt in welchem Tool nachschlagen würdest.
tip: |
  Gib im Purpose die Zielgruppen von Fjordlicht mit – Familien suchen anders als
  Stadtmenschen, die am Wochenende wandern. Und frag am Ende nach: „Welche dieser Begriffe
  würde ein Mensch tatsächlich so eintippen?" Das sortiert Kunstbegriffe aus.
solution: |
  Beispielprompt:

  ```text
  Persona: Du bist SEO-Spezialistin für Outdoor-E-Commerce.
  Request: Sammle Suchbegriffe rund um "Wanderhose" und ordne sie in Cluster.
  Output: Tabelle Cluster | Suchbegriff | Intention | Seitentyp, mindestens
  40 Begriffe, 5 bis 8 Cluster.
  Modifier: keine Suchvolumina, keine Schwierigkeitswerte, keine
  Wettbewerbermarken, Alltagssprache und Fragen einbeziehen.
  Purpose: Content-Planung für Fjordlicht (nachhaltige Outdoor-Marke);
  Zielgruppen: Stadtmenschen 25 bis 45, Familien.
  Tone: sachlich, ohne Einleitung.
  ```

  Mögliche Cluster: Kaufberatung (Material, Passform), Wanderhose Damen/Herren/Kinder,
  Zip-Off und Funktion, Pflege, Wandern bei Regen/Kälte, Nachhaltigkeit.

  Typische Prüfbefunde: vereinzelt doch Zahlen („hohes Volumen") → streichen; Dubletten wie
  „wanderhose damen" und „damen wanderhose"; Kunstbegriffe wie „Wanderhose
  Performance-Lösung".

  Beispiel Cluster „Pflege": Pillar Page „Outdoor-Hosen richtig pflegen"; Detailartikel
  „Wanderhose waschen ohne Funktion zu verlieren", „Grasflecken aus Wanderhose entfernen",
  „Wanderhose reparieren statt neu kaufen".

  Nachschlagen: Suchvolumen und Saison im Keyword Planner bzw. Google Trends, bestehende
  Sichtbarkeit in der Search Console, Wettbewerb in Sistrix oder Semrush.
