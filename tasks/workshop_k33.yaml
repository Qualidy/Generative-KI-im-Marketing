title: Kampagnenmotive von Briefing bis Freigabe
difficulty: 4
question: |
  **Szenario:** Fjordlicht bringt im November die Regenjacke „Sølv" in einer neuen Farbe
  „Moorbraun" heraus. Das Fotoshooting ist gestrichen worden, das Budget reicht nur für einen
  halben Tag Produktfotografie im Studio. Die Marketingleitung möchte die Kampagnenmotive mit
  Bild-KI in Copilot erstellen und erwartet ein freigabefähiges Motivpaket – als
  PowerPoint-Datei, die sie mit Produktmanagement und Agentur teilen kann. Du kannst stattdessen
  auch ein Produkt eines Unternehmens deiner Wahl verwenden.

  ```text
  Rahmen:
  Produkt: Regenjacke Sølv in Moorbraun (Produktfotos freigestellt vorhanden,
  für die Übung genügt ein eigenes Foto einer beliebigen Jacke als Platzhalter).
  Kanäle: Instagram-Post 4:5, Story 9:16, Newsletter-Header ca. 3:1, Pinterest 2:3.
  Kernbotschaft: "Neue Farbe, gleiche Jacke. Gemacht für graue Tage."
  Bildsprache: /Fjordlicht-Bildsprache (Kap. 32), Fakten: /Fjordlicht-Basisdaten.
  Werkzeuge: Copilot (Chat, Create, Word, Excel, PowerPoint); für Composing
  ggf. Photoshop/Firefly.
  Keine echten Personen, keine fremden Marken, keine Superlative.
  ```

  ---

  **Runde 1 – Briefing und Moodboard.** Lass dir von Copilot in **Word** ein Bildbriefing
  entwerfen (Kampagnenziel, Bildaufgabe je Kanal, Zielgruppe, Kernbotschaft, Produkt, Tabus,
  Formate) – auf Basis von `/Fjordlicht-Basisdaten` und `/Fjordlicht-Bildsprache` (falls nicht
  vorhanden, Kap. 11 bzw. 32 einfügen). Prüfe es, fülle Lücken selbst und speichere es als
  „Bildbriefing-Soelv-Moorbraun.docx" im Ordner „Fjordlicht-Kurs". Erstelle dann mit
  Copilot in **PowerPoint** aus der Briefing-Datei ein **Moodboard** mit mindestens acht
  Referenzen: eigene Fotos oder in Copilot erzeugte Bilder, keine fremden Kampagnenbilder als
  Vorlage. Lass Copilot je Folie eine kurze Beschreibung ergänzen, was das Bild für die
  Bildsprache zeigt.

  **Runde 2 – Serie erzeugen.** Lass dir in Copilot Chat aus dem Briefing mit dem Prompt aus
  Abschnitt 33.6 eine Prompt-Serie ableiten und übernimm sie als Tabelle nach **Excel** – sie
  wird zugleich die Dokumentation. Erzeuge die Motive in Copilot und setze die Kampagnenfolien
  in PowerPoint (je Format eine Folie oder Datei mit passender Größe, Headline und
  Logo-Platzhalter als echte Textfelder). Pflichtkriterien:

  1. Alle Motive nutzen dasselbe Prompt-Gerüst mit wortgleichem Bildsprache-Baustein.
  2. Die Jacke stammt in jedem veröffentlichungsfähigen Motiv aus dem echten Produktfoto
     (Composing: Produktfoto auf generierte Szene, z. B. in PowerPoint, Create oder Photoshop).
  3. Headline und Logo-Platzhalter sind im Layout gesetzt, nicht im Bildprompt.
  4. Jedes Motiv ist im Zielformat geprüft, die Story-Ränder sind frei.

  **Runde 3 – Die Komplikation.** Die Produktmanagerin sieht die Entwürfe und stoppt: Das
  Braun der Jacke sei auf zwei Motiven „eher Rostrot", und auf einem Bild habe die Jacke
  einen Unterarm-Reißverschluss, den das Modell gar nicht hat. Außerdem fragt sie, ob man
  „das mit der KI" irgendwo angeben müsse. Behebe die Produktfehler durch Composing mit dem
  echten Foto und halte in der Excel-Dokumentation fest, welcher Arbeitsschritt den Fehler
  hätte verhindern müssen. Notiere die Kennzeichnungsfrage als offenen Punkt für Kap. 34.
  Beantworte ihre Rückmeldung mit einem Entwurf von Copilot in Outlook, den du selbst
  überarbeitest.

  **Runde 4 – Entscheidung unter Abwägung.** Ein Agenturkontakt bietet an, die Jacke per
  Referenzbild „direkt mitzugenerieren" – das spare das Composing und sehe „zu 95 Prozent echt"
  aus. Prüfe den Vorschlag mit einem Testmotiv in Copilot (Produktfoto hochladen, Jacke in neue
  Szene setzen lassen). **Widersprich** dort, wo er Risiken für Kundschaft und Marke erzeugt,
  und benenne, für welche Einsatzzwecke (zum Beispiel interne Entwürfe, Moodboard) er trotzdem
  sinnvoll ist.

  **Deliverable:**

  1. Bildbriefing (Word) und Moodboard (PowerPoint)
  2. Motivpaket als PowerPoint mit vier Kanalmotiven inklusive Overlay und Prüfprotokoll der
     vier Pflichtkriterien
  3. Korrekturprotokoll zu Runde 3 mit Ursache und vorbeugendem Arbeitsschritt
  4. Dokumentation je Motiv (Excel): Werkzeug, Prompt, Referenzen, Bearbeitungsschritte, Datum
  5. begründete Stellungnahme zum Vorschlag aus Runde 4

  **Fertig bist du erst, wenn** jedes Motiv dem echten Produkt in Farbe und Details entspricht,
  die vier Formate erkennbar eine Kampagne bilden, jede Bearbeitung dokumentiert ist und deine
  Stellungnahme aus Runde 4 zwischen Entwurf und Veröffentlichung klar unterscheidet.
tip: |
  Der Lernkern liegt in Runde 3: Fehler am Produkt fallen nicht beim Generieren auf, sondern
  erst bei jemandem, der das Produkt kennt. Baue diese Prüfung deshalb fest in den Workflow ein,
  bevor Layout und Formate entstehen. In Runde 4 gilt: „95 Prozent echt" heißt bei einem
  Produktbild, dass 5 Prozent eine falsche Produktaussage sind. Lege die Excel-Dokumentation
  von Anfang an mit, nicht erst am Ende – dann ist sie in Runde 3 schon da.
solution: |
  Beispielprompt für das Moodboard in PowerPoint (mit Verweis auf die Briefing-Datei):

  ```text
  Erstelle aus /Bildbriefing-Soelv-Moorbraun ein Moodboard mit acht Folien.
  Jede Folie: ein großes Bild, das Licht, Farbwelt oder Situation der Kampagne
  zeigt, darunter eine Zeile, welche Dimension der Bildsprache es belegt.
  Gedämpfte Herbstfarben, Nebel, Moor, Nieselregen. Keine Produkte, kein Text
  im Bild, keine Superlative.
  ```

  Beispielspalten der Excel-Dokumentation:

  | Nr. | Kanal | Format | Werkzeug | Prompt | Referenzen | Bearbeitung | Produktprüfung | Datum |
  |---|---|---|---|---|---|---|---|---|

  Bewertungskriterien: (1) das Briefing enthält Bildaufgabe je Kanal, Tabus und Formate, das
  Moodboard stützt die Bildsprache ohne fremde Kampagnen zu kopieren; (2) alle vier
  Pflichtkriterien sind belegt erfüllt, insbesondere echtes Produkt und Text im Layout;
  (3) das Korrekturprotokoll benennt die Ursache (Produkt generiert oder nicht gegen das
  Original geprüft) und verankert eine Produktprüfung vor dem Layout-Schritt; (4) die
  Excel-Dokumentation erlaubt, jedes Motiv nachzuvollziehen; (5) die Stellungnahme zu Runde 4
  beruht auf einem Test in Copilot, benennt Täuschungs- und Retourenrisiko (typisch:
  Farbton, Kapuze, Taschen weichen ab) und grenzt sinnvolle interne Einsatzzwecke ab.

  Lernziel: Den Kampagnen-Workflow mit Bild-KI so steuern, dass Konsistenz, Produktwahrheit
  und Nachvollziehbarkeit gesichert sind – und Bild-KI dort einsetzen, wo sie Zeit spart, ohne
  die Aussage über das Produkt zu verfälschen.
