title: Faktencheck im Team – Rollen am geteilten Word-Dokument
difficulty: 3
question: |
  **Gruppe:** 4 Personen (bei 3 Personen entfällt das Protokoll, die Prompt-Verantwortliche
  übernimmt es), ca. 30 Minuten. **Am Ende liegt vor:** ein geteiltes Word-Dokument mit
  Behauptungstabelle, Rechercheprotokoll, geprüfter Neufassung und einem vorbeugenden Prompt.

  Ein KI-Entwurf für den Blog „Draußen-Notizen" enthält folgenden Absatz:

  ```text
  Laut einer Studie des Outdoor-Instituts München aus 2024 waschen
  73 % der Deutschen ihre Regenjacke falsch. Dabei ist es ganz einfach:
  Bei 60 Grad mit normalem Waschmittel waschen, danach in den Trockner -
  die Wärme aktiviert die Imprägnierung. Fjordlicht-Jacken sind
  ohnehin zu 100 % klimaneutral produziert, sodass du bei jeder Wäsche
  ein gutes Gewissen haben kannst.
  ```

  Faktenbasis: Pflegeetikett „30 Grad Feinwäsche, kein Weichspüler, Trockner schonend erlaubt";
  Claim-Liste: „klimaneutral" ist **nicht** freigegeben (siehe auch `/Fjordlicht-Basisdaten`).

  **Rollen:** **Prompt-Verantwortliche** (bedient Copilot in Word), **Quellenprüferin**
  (Copilot Chat, Modus Web), **Claim-Prüfer** (gleicht mit Etikett und Claim-Liste ab),
  **Protokoll** (führt die Tabelle). Nach Schritt 2 tauschen Prompt-Verantwortliche und
  Claim-Prüfer die Rollen.

  1. **Behauptungen auflisten.** Die Prompt-Verantwortliche legt ein Word-Dokument im Ordner
     „Fjordlicht-Kurs" an, fügt den Absatz ein und teilt es mit der Gruppe. Sie fragt
     **Copilot in Word** mit dem Prompt aus Abschnitt 15.5 nach allen prüfbaren Behauptungen und
     übernimmt die Liste als Tabelle ins Dokument. Das Protokoll ergänzt die Spalten Risiko,
     Prüfweg und Entscheidung (behalten / ändern / streichen); der Claim-Prüfer trägt seine
     Einschätzungen als Kommentare ein.
  2. **Quelle suchen (parallel).** Die Quellenprüferin prüft in Copilot Chat im Modus **Web**,
     ob es die genannte Studie gibt, öffnet jeden genannten Link selbst und notiert im Dokument,
     was sie gefunden hat.
  3. **Neu formulieren (nach dem Rollentausch).** Die neue Prompt-Verantwortliche markiert den
     Absatz und lässt ihn von Copilot umschreiben – nur mit belegbaren oder deutlich als
     Empfehlung gekennzeichneten Aussagen. Schaltet **Änderungen nachverfolgen** ein, bevor ihr
     die Neufassung einfügt. Der neue Claim-Prüfer sucht gezielt nach **neuen** Behauptungen, die
     beim Umschreiben hinzugekommen sind.
  4. **Prompt-Duell.** Teilt euch in zwei Paare. Jedes Paar schreibt einen Prompt, der solche
     Absätze schon beim Schreiben verhindert, und lässt damit in Copilot Chat einen kurzen
     Pflegeabsatz schreiben. Vergleicht beide Ergebnisse: Welcher Prompt hat weniger unbelegte
     Aussagen erzeugt? Den Siegerprompt speichert jede Person in ihrer **Prompt Gallery** und fügt
     ihn ins Dokument ein.
tip: |
  Unterscheidet zwischen Aussagen, die falsch sein **können** (Studie), und Aussagen, die
  nachweislich gegen die Faktenbasis verstoßen (60 Grad, klimaneutral). Beide sind ein Problem,
  aber das zweite ist ein sicherer Fehler mit Folgen für Produkt und Recht. Findet die
  Quellenprüferin im Modus Web nichts, beweist das nicht, dass die Studie nicht existiert – aber
  ohne geöffnete Quelle bleibt sie draußen. Achtet in Schritt 3 darauf, ob ein gestrichenes Wort
  durch eine weichere, aber ebenso unbelegte Formulierung ersetzt wird.
solution: |
  | Behauptung | Risiko | Prüfweg | Entscheidung |
  |---|---|---|---|
  | Studie Outdoor-Institut München 2024 | vermutlich erfunden | Websuche, Institut und Studie aufrufen | streichen, solange nicht auffindbar |
  | 73 % waschen falsch | Zahl ohne Beleg | Originalquelle | streichen |
  | 60 Grad, normales Waschmittel | widerspricht dem Etikett, kann Jacke schädigen | Pflegeetikett | ändern |
  | Trockner aktiviert Imprägnierung | teilweise richtig, aber verallgemeinert | Produktmanagement, Etikett | ändern, auf „schonend" begrenzen |
  | 100 % klimaneutral produziert | nicht freigegeben, Greenwashing, UWG-Risiko | Claim-Liste | streichen |

  Mögliche Beobachtung in Schritt 2: Die Suche findet kein „Outdoor-Institut München" oder nur
  Seiten, die die Zahl nicht enthalten. Mögliche Beobachtung in Schritt 3: „klimaneutral" wird
  durch „umweltschonend hergestellt" ersetzt – auch das ist unbelegt und muss raus.

  Neufassung (Beispiel):

  ```text
  Viele Regenjackenprobleme entstehen beim Waschen. Für Fjordlicht-Jacken
  gilt: 30 Grad im Feinwaschgang, ohne Weichspüler. Danach darf die Jacke
  schonend in den Trockner - laut Etikett ist das erlaubt, und bei vielen
  Imprägnierungen hilft die Wärme, den Abperleffekt aufzufrischen.
  ```

  Vorbeugender Prompt (Beispiel für den Siegerprompt):

  ```text
  Nutze für Pflegehinweise ausschließlich dieses Etikett: [Etikett].
  Nutze für Produktfakten und Nachhaltigkeitsaussagen nur
  /Fjordlicht-Basisdaten. Nenne keine Studien und keine Prozentzahlen,
  die dort nicht stehen. Wo du eine Zahl oder Quelle brauchst,
  schreibe [QUELLE FEHLT].
  ```

  Bewertungskriterien: alle fünf Behauptungen erkannt, Etikett und Claim-Liste als Prüfmaßstab
  genutzt, Websuche mit selbst geöffneten Links im Dokument dokumentiert, Neufassung mit
  nachverfolgten Änderungen und ohne neue Behauptungen; Rollen wurden getauscht, und der neue
  Claim-Prüfer hat die Neufassung unabhängig geprüft; im Prompt-Duell ist der Unterschied
  zwischen beiden Ergebnissen benannt und die Wahl des Siegerprompts begründet; der Prompt
  enthält einen Platzhalter für fehlende Quellen.
