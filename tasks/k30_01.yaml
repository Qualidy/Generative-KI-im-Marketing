title: Bausteine eines Bildprompts erkennen
difficulty: 1
question: |
  Untersuche den folgenden Bildprompt für einen Instagram-Post von Fjordlicht.

  ```text
  Foto von einer Familie mit zwei Kindern beim Picknick im Wald, Herbst,
  goldene Stunde, Gegenlicht, gedeckte warme Farben, keine Handys,
  ultra-detailed, masterpiece, 8K
  ```

  1. **Ausprobieren.** Erzeuge mit genau diesem Prompt ein Bild in Copilot Chat. Notiere in
     einem Satz, was dir am Ergebnis auffällt (Format, Bildaufbau, Look).
  2. Welche der acht Bausteine (Motiv, Umgebung, Stil, Licht, Komposition, Kamera,
     Farbstimmung, Format) sind enthalten, welche fehlen?
  3. Welche Angaben sind **Füllwörter**, die kaum etwas beitragen?
  4. Formuliere die negative Angabe „keine Handys" positiv um.
  5. Ergänze die beiden fehlenden Bausteine, die für einen Instagram-Post am wichtigsten sind,
     streiche die Füllwörter und erzeuge das Bild in einer **neuen** Unterhaltung erneut.
     Was hat sich sichtbar verändert?
tip: |
  Überlege bei Frage 5, was ein Instagram-Post technisch zwingend braucht und was bei einem
  Familienbild am häufigsten „irgendwie falsch" wirkt. Ein Blick auf das erste Bild aus
  Schritt 1 verrät es dir meist.
solution: |
  Typische Beobachtung in Schritt 1: Das Bild ist quadratisch oder im Querformat, die Familie
  sitzt mittig und frontal, alle lächeln in die Kamera, der Look ist glatt und sehr gesättigt –
  ein Werbefamilien-Bild.

  | Baustein | enthalten? | Fundstelle |
  |---|---|---|
  | Motiv | ja | Familie mit zwei Kindern beim Picknick |
  | Umgebung | ja | Wald, Herbst |
  | Stil | teilweise | „Foto" – ohne Anmutung (dokumentarisch? inszeniert?) |
  | Licht | ja | goldene Stunde, Gegenlicht |
  | Komposition | nein | – |
  | Kamera | nein | – |
  | Farbstimmung | ja | gedeckte warme Farben |
  | Format | nein | – |

  Füllwörter: „ultra-detailed, masterpiece, 8K" – sie bringen bei aktuellen Modellen wenig und
  schieben das Bild eher in einen überglatten Hochglanz-Look.

  Positive Umformulierung: „Die Familie ist ins Gespräch vertieft, die Hände halten Becher und
  Brot" – so ist klar, was stattdessen zu sehen ist.

  Wichtigste Ergänzungen:

  ```text
  Format: Hochformat 4:5 für Instagram.
  Komposition: Familie im unteren Bilddrittel, aus leichter Distanz,
  ungestellt, nicht in die Kamera blickend.
  ```

  Das Format ist zwingend für den Kanal, die Komposition verhindert das typische frontale
  „Werbefamilien"-Bild. Im zweiten Durchgang wirkt das Bild meist ruhiger und
  dokumentarischer, die Familie ist kleiner im Bild, und es gibt Umgebung. Falls Copilot das
  Hochformat nicht exakt umsetzt, ist das ein Hinweis, das Format später beim Zuschnitt zu
  sichern – der Prompt bleibt trotzdem richtig.
