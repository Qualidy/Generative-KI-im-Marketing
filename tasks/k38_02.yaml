title: Gesprächsleitfaden für die Sprecherin – im Team mit Rollenspiel
difficulty: 2
question: |
  **Gruppenarbeit:** 4 Personen (bei 3 Personen übernimmt eine Person zwei Bausteinpaare),
  ca. 25–30 Minuten. Ihr arbeitet gemeinsam in einem geteilten Word-Dokument mit **Copilot in
  Word** und nutzt zusätzlich **Copilot Chat**. Am Ende liegt ein gemeinsamer Gesprächsleitfaden
  mit Tabelle, Fragen der Sprecherin und Kommentaren für die Rechtsprüfung vor.

  Fjordlicht möchte mit seiner Sprecherin, die seit drei Jahren Erklärvideos einspricht, über
  einen Stimmklon sprechen. Einsatz: kurze Produkt-FAQ-Videos und Audioversionen von
  Blogartikeln, auf Deutsch und Englisch.

  1. **Dokument anlegen und teilen:** Eine Person legt in ihrem Ordner „Fjordlicht-Kurs" das
     Word-Dokument **„Sprecherin-Gesprächsleitfaden"** an und teilt es mit der Gruppe zum
     Bearbeiten. Sie lässt Copilot in Word mit dem Prompt aus Abschnitt 38.3 eine Checkliste
     für das Gespräch entwerfen und ergänzt im Prompt `/Fjordlicht-Basisdaten`, damit Kanäle und
     Markenstimme passen.
  2. **Arbeitsteilung:** Teilt die acht Vertragsbausteine aus der Tabelle in 38.3 auf – jede
     Person übernimmt zwei (z. B. Zweck/Umfang, Freigabe/Werkzeug, Dauer/Löschung,
     Vergütung/Kennzeichnung). Prüft im gemeinsamen Dokument, ob eure Bausteine vollständig
     abgedeckt sind, und ergänzt fehlende Punkte direkt. Danach markiert eine Person die
     Checkliste und lässt Copilot sie in eine **Tabelle** umwandeln (Baustein | Frage an die
     Sprecherin | unser Vorschlag).
  3. **Rollenspiel:** Eine Person übernimmt die Rolle der **Sprecherin**. Sie lässt in Copilot
     Chat die Fragen formulieren, die die Sprecherin wahrscheinlich stellen wird, und stellt
     die fünf wichtigsten davon der Gruppe – mündlich, als wäre es das echte Gespräch. Die
     anderen antworten jeweils in einem Satz aus Fjordlicht-Sicht. Die „Sprecherin" sagt bei
     jeder Antwort, ob sie überzeugt ist oder nachhaken würde. Übernehmt Fragen und Antworten
     ins Dokument.
  4. **Abschluss:** Einigt euch auf die drei Punkte, die ihr auf keinen Fall ohne
     Rechtsabteilung oder Anwältin festlegen würdet, und markiert sie mit je einem
     **Word-Kommentar**. Wer die Sprecherin gespielt hat, nennt im Plenum die Antwort, die sie
     am wenigsten überzeugt hat.
tip: |
  Der Perspektivwechsel im Rollenspiel ist der Kern. Eine Sprecherin lebt von ihrer Stimme – ihre
  wichtigsten Fragen betreffen Kontrolle („Was sagt meine Stimme ohne mich?") und Zukunft („Was
  passiert, wenn wir uns trennen?"). Kann die Gruppe die nicht klar beantworten, ist das Angebot
  nicht reif. Lasst Copilot keine fertigen Vertragsklauseln formulieren – das Dokument ist eine
  Gesprächsvorbereitung. Achtet in Schritt 2 darauf, ob der Copilot-Entwurf Löschung und Widerruf
  ausreichend behandelt.
solution: |
  Beispiel-Prompt für das Rollenspiel (Copilot Chat):

  ```text
  Du bist eine freiberufliche Sprecherin, die seit drei Jahren für Fjordlicht
  Erklärvideos einspricht. Fjordlicht möchte deine Stimme klonen lassen
  (Produkt-FAQ, Blog-Hörfassungen, Deutsch und Englisch). Welche zehn Fragen
  stellst du im ersten Gespräch? Sortiere nach Wichtigkeit für dich und
  begründe jede Frage in einem halben Satz.
  ```

  Typische Fragen der Sprecherin und gute Antworten:

  | Frage | Antwort aus Fjordlicht-Sicht |
  |---|---|
  | Sehe ich jeden Text vorher? | Ja, oder eine definierte Rahmenfreigabe für FAQ-Texte mit Vetorecht. |
  | Wofür wird meine Stimme nie benutzt? | Keine Politik, keine Werbung für Dritte, keine Aussagen über Personen. |
  | Wer hat Zugriff auf das Modell? | Zwei benannte Personen, Unternehmenskonto mit Zwei-Faktor-Anmeldung. |
  | Was passiert bei Trennung oder Widerruf? | Modell und Rohaufnahmen werden gelöscht, Löschung wird bestätigt. |
  | Wie werde ich bezahlt? | Pauschale pro Jahr plus Honorar für neue Studioaufnahmen. |
  | Wird erkennbar, dass es KI ist? | Ja, Kennzeichnung in Video und Beschreibung. |
  | Darf meine Stimme Englisch sprechen? | Nur wenn ausdrücklich vereinbart; Übersetzungen prüft ein Mensch. |

  Punkte für die juristische Prüfung (als Kommentar markiert): Formulierung von Einwilligung und
  Widerruf, Datenschutz (Stimmprofil, Auftragsverarbeitung mit dem Anbieter) und Vergütungs-
  sowie Haftungsregelung.

  Bewertungskriterien:

  - Das gemeinsame Word-Dokument deckt alle acht Bausteine ab; jede Person hat ihre zwei
    Bausteine sichtbar geprüft und ergänzt.
  - Die Tabelle enthält mindestens fünf Fragen aus Sprecherinnensicht mit konkreten, nicht
    ausweichenden Antworten.
  - Die „Sprecherin" hat mindestens eine Antwort als nicht überzeugend markiert, und die Gruppe
    hat sie nachgebessert.
  - Drei Kommentare für die Rechtsprüfung sind gesetzt und von der Gruppe gemeinsam
    ausgewählt.
  - Problematische Stellen im Copilot-Entwurf wurden erkannt, etwa bereits ausformulierte
    Klauseln oder fehlende Punkte zu Löschung und Widerruf.
