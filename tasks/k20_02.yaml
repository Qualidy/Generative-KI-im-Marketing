title: Newsletter-Betreffzeilen mit der Datenanalyse auswerten
difficulty: 2
question: |
  Diese Übung machst du direkt im KI-Werkzeug (ChatGPT mit Datenanalyse, alternativ Claude,
  Gemini oder Copilot). Kopiere den folgenden fiktiven Fjordlicht-Export in eine Textdatei
  `newsletter.csv` oder füge ihn direkt in den Chat ein.

  ```text
  datum;betreff;thema;öffnungsrate;klickrate
  2026-01-08;Was dein Fleece im Winter wirklich braucht;Pflege;41,2;3,9
  2026-01-22;Neu: Skog Fleece in Moosgrün;Produkt;35,8;4,4
  2026-02-05;Wie viel Regen hält eine Regenjacke aus?;Wissen;43,5;3,1
  2026-02-19;Sølv – jetzt wieder da;Produkt;34,9;4,8
  2026-03-05;Drei Wanderwege rund um Münster;Touren;39,7;2,6
  2026-03-19;Warum wir keine Neuware verbrennen;Haltung;44,1;2,2
  2026-04-02;Frühjahrsputz für deine Wanderhose?;Pflege;42,0;3,7
  2026-04-16;Vidde: die Hose für lange Tage;Produkt;36,3;5,0
  2026-04-30;Packliste für dein erstes Mikroabenteuer;Touren;40,8;3,3
  2026-05-14;Tind Rucksack: 20 Prozent leichter;Produkt;35,1;4,6
  ```

  1. Lass prüfen, ob **Fragen im Betreff** und das **Thema** mit Öffnungs- und Klickrate
     zusammenhängen. Nutze einen Prompt nach dem P.R.O.M.P.T.-Framework (Kap. 5).
  2. Lass dir den **Rechenweg** zeigen und prüfe einen Mittelwert selbst nach.
  3. Formuliere zwei **Hypothesen** für einen A/B-Test – inklusive der Einschränkung, warum die
     Daten allein nicht reichen.
tip: |
  Achte auf das Dezimalkomma und das Semikolon als Trennzeichen – sag beides im Prompt dazu.
  Und schau genau hin, was mit der Klickrate passiert: Was öffnet, ist nicht unbedingt das,
  was klickt.
solution: |
  Beispielprompt:

  ```text
  Persona: Du bist Datenanalystin im Content-Marketing.
  Request: Werte die Tabelle aus (Semikolon-getrennt, Dezimalkomma). Ergänze
  eine Spalte "frage" (ja, wenn der Betreff mit ? endet). Vergleiche Öffnungs-
  und Klickrate nach "frage" und nach "thema".
  Output: Tabelle mit Mittelwert und Anzahl je Gruppe, danach drei Befunde.
  Modifier: Nenne immer die Fallzahl, kennzeichne Gruppen unter 10 Fällen als
  unsicher, formuliere Zusammenhänge, keine Ursachen.
  Purpose: Hypothesen für A/B-Tests im nächsten Quartal.
  Tone: sachlich.
  ```

  Erwartbares Ergebnis (gerundet):

  | Gruppe | n | Öffnungsrate | Klickrate |
  |---|---|---|---|
  | Frage im Betreff | 2 | 42,8 | 3,4 |
  | keine Frage | 8 | 38,5 | 3,9 |
  | Thema Produkt | 4 | 35,5 | 4,7 |
  | übrige Themen | 6 | 41,9 | 3,1 |

  Befund: Produkt-Betreffzeilen werden seltener geöffnet, aber häufiger geklickt – wer öffnet,
  hat Kaufinteresse. Alle Gruppen haben unter 10 Fällen, also **unsicher**.

  Hypothesen: (1) „Ein Produkt-Newsletter mit Frage-Betreff erzielt eine höhere Öffnungsrate
  als mit Produktnamen-Betreff, ohne Klickrate zu verlieren." (2) „Ein Wissens-Newsletter mit
  einem Produkt-Kasten am Ende erzielt mehr Klicks als ohne." Die Daten reichen nicht als
  Beleg, weil Thema und Betreffform vermischt sind und die Fallzahl klein ist.
