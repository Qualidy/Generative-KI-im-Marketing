title: Einen Listening-Bericht in der Gegenprobe prüfen
difficulty: 3
question: |
  **Gruppe:** 4 Personen in zwei Paaren · **Dauer:** etwa 30 Minuten · **Format:** Gegenprobe
  Mensch gegen Copilot, danach gemeinsames Dokument · **Am Ende liegen vor:** eine überarbeitete
  Management Summary in „Agenturbericht-Q3.docx" und ein gemeinsam geprüfter Outlook-Entwurf
  (nicht gesendet).

  Eine Agentur legt Fjordlicht folgenden KI-erstellten Kurzbericht vor:

  ```text
  Social Listening Q3 - Management Summary
  Sentiment gesamt: 64,7 % positiv (+8,3 Prozentpunkte zum Vorquartal)
  Ursache: Die neue Herbstkampagne hat die Markenwahrnehmung deutlich verbessert.
  Top-Thema: Nachhaltigkeit (41 %), überwiegend positiv.
  Auffällig: Nutzerin @wanderherz_ms (12 Beiträge) äußert sich wiederholt
  kritisch; wir empfehlen, ihr Profil und ihr Umfeld genauer zu beobachten.
  Empfehlung: Budget für TikTok verdoppeln, dort ist die Stimmung am besten.
  ```

  Im Anhang steht: Datenbasis 212 Beiträge, davon 180 von Instagram, 32 von TikTok; Stichprobe
  zur Prüfung der KI-Einstufung: keine.

  1. **Vorbereitung:** Eine Person legt den Bericht samt Anhang als Word-Datei
     „Agenturbericht-Q3.docx" in ihrem Ordner „Fjordlicht-Kurs" an und teilt sie mit der Gruppe.
  2. **Gegenprobe (10 Minuten):**
     - **Paar A (ohne KI)** notiert alle Schwächen des Berichts – methodisch, inhaltlich und
       rechtlich.
     - **Paar B (mit Copilot)** stellt **Copilot in Word** Fragen zum Dokument, etwa: „Welche
       Aussagen sind durch die genannte Datenbasis nicht gedeckt?" und „Welche Aussagen sind
       datenschutzrechtlich problematisch?"
     - Danach vergleicht ihr: Was hat nur Paar A gefunden, was nur Copilot? Haltet die Lücken auf
       beiden Seiten fest.
  3. **Gemeinsam überarbeiten:** Paar B markiert die Management Summary und lässt sie von
     Copilot in Word so umschreiben, dass sie nur aussagt, was die Daten tragen. Paar A prüft das
     Ergebnis Satz für Satz mit **Änderungen nachverfolgen** und Kommentaren im geteilten
     Dokument. Einigt euch auf eine Endfassung.
  4. **Rückfragen an die Agentur:** Rollenwechsel – eine Person aus Paar A lässt **Copilot in
     Outlook** eine E-Mail an die Agentur mit drei Rückfragen entwerfen und nutzt danach das
     **Coaching durch Copilot**, um Ton und Klarheit zu prüfen. Die Gruppe entscheidet, welche
     Hinweise aus dem Coaching übernommen werden. Nicht senden – nur Entwurf und Prüfung.
  5. **Abschluss:** Eine Person stellt im Plenum in zwei Minuten vor: die wichtigste Schwäche des
     Berichts und eine Lücke, die Copilot übersehen hat – oder die nur Copilot gefunden hat.
tip: |
  Lest jeden Satz mit der Frage: Welche Daten würden diese Aussage stützen – und liegen sie vor?
  Achtet besonders auf Nachkommastellen, auf Ursachenbehauptungen und auf den Umgang mit
  einzelnen Personen. Paar B sollte beobachten, ob Copilot den Datenschutzpunkt von sich aus
  nennt oder erst auf die gezielte Nachfrage (Kap. 4). Paar A sollte sich nicht vorab ansehen,
  was Copilot findet – sonst ist die Gegenprobe wertlos.
solution: |
  | Aussage | Schwäche |
  |---|---|
  | 64,7 %, +8,3 Punkte | Scheingenauigkeit; ohne Stichprobenprüfung ist unklar, ob die Einstufung stimmt |
  | Ursache Herbstkampagne | Kausalbehauptung ohne Beleg; Korrelation ist keine Kausalität |
  | Nachhaltigkeit 41 %, positiv | keine Beispiele, keine Fallzahl; gerade hier ist Ironie häufig |
  | Beobachtung von @wanderherz_ms | datenschutzrechtlich problematisch: Profilbildung über eine Einzelperson, Nutzername ungeschwärzt |
  | TikTok-Budget verdoppeln | 32 Beiträge sind keine Grundlage; Stimmung im Listening sagt nichts über Werbewirkung |
  | Datenbasis | stark verzerrt Richtung Instagram; Quellenauswahl nicht begründet |

  Beispiel-Prompt für das Umschreiben in Word (Summary markiert):

  ```text
  Schreibe diese Zusammenfassung so um, dass sie nur Aussagen enthält, die
  durch die Datenbasis im Anhang gedeckt sind. Nenne Fallzahlen, runde Werte,
  kennzeichne vorläufige Ergebnisse, streiche Ursachenbehauptungen und jeden
  Bezug auf einzelne Personen.
  ```

  Überarbeitete Summary (Zielbild):

  ```text
  Datenbasis: 212 öffentliche Beiträge Q3 (180 Instagram, 32 TikTok).
  Stimmung: überwiegend positiv, Tendenz besser als Q2 - Einstufung noch
  nicht stichprobenartig geprüft, Werte daher vorläufig.
  Häufigstes Thema: Nachhaltigkeit; darunter wiederkehrende kritische
  Nachfragen zu Recycling-Anteilen (Beispiele: IDs ...).
  Ursachen für die Veränderung sind aus den Daten nicht ableitbar.
  TikTok: Fallzahl zu gering für eigene Aussagen.
  ```

  Rückfragen für den Outlook-Entwurf: (1) Wie wurde die KI-Einstufung geprüft, und wie hoch war
  die Übereinstimmung? (2) Welche Suchbegriffe und Quellen wurden genutzt, warum fehlen
  Bewertungsportale und Foren? (3) Werden Nutzernamen vor der KI-Verarbeitung entfernt, und auf
  welcher Rechtsgrundlage und mit welchem Werkzeug (AVV) werden die Daten verarbeitet?

  Die Empfehlung zur Beobachtung einer Einzelperson gehört ersatzlos gestrichen; kritische Beiträge
  werden inhaltlich beantwortet, nicht personenbezogen ausgewertet.

  Bewertungskriterien:

  - Paar A hat seine Liste ohne KI erstellt; der Vergleich benennt konkret, was nur Menschen und
    was nur Copilot gefunden haben.
  - Die Endfassung der Summary enthält keine Kausalbehauptung, keinen Personenbezug und nennt
    die Fallzahlen; die Prüfung ist im Dokument als nachverfolgte Änderungen und Kommentare
    sichtbar.
  - Der Mail-Entwurf ist sachlich, enthält die drei Rückfragen, die Übernahme von
    Coaching-Hinweisen ist bewusst entschieden, und die Mail wurde nicht versendet.
  - Die Plenumsvorstellung nennt eine konkrete Lücke statt einer allgemeinen Aussage wie
    „Copilot war ganz gut".
