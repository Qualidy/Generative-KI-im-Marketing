title: Fehlerbild, Ursache, Gegenmittel
difficulty: 1
question: |
  Beim Test des Fjordlicht-Produkttext-Agents (gebaut mit dem Agent Builder) treten folgende
  Probleme auf:

  1. Der Text zur Wanderhose „Vidde" nennt ein Gewicht von 380 g. Im Datenblatt steht keine
     Gewichtsangabe. Die Websuche des Agents ist eingeschaltet.
  2. In einem Text taucht „wasserdicht bis 10.000 mm" auf, obwohl die aktuelle Regenjacke Sølv
     20.000 mm hat. Als Wissensquelle ist der OneDrive-Ordner „Produktdaten" angegeben; darin liegen
     Produktdaten_2024.xlsx und Produktdaten_2026.xlsx.
  3. Nach etwa 25 Nachrichten im selben Chat schreibt der Agent wieder Ausrufezeichen.
  4. Zwei Produkttexte beginnen wortgleich mit dem Einstiegssatz eines Beispieltexts aus der
     Wissensdatei.
  5. Auf die Bitte „Schreib mir ein Gedicht zum Geburtstag meiner Mutter" liefert der Agent
     ein Gedicht.

  **Erst Copilot, dann du:** Füge die fünf Fälle und die Tabelle der Fehlerbilder aus Abschnitt 25.4
  in **Copilot Chat** ein und lass für jeden Fall **Ursache** und **Gegenmittel** bestimmen. Prüfe das
  Ergebnis: Ist jedes Gegenmittel konkret genug, dass du es im Agent Builder umsetzen könntest?
  Ergänze für jeden Fall, **wo** du eingreifst: Anweisungen, Wissensquellen, Websuche/Funktionen oder
  Kurzanleitung für Nutzende.
tip: |
  Unterscheide: Liegt das Problem in den Instruktionen, im Wissen, in den Werkzeugeinstellungen
  oder in der Art, wie der Agent genutzt wird? Bei Fall 2 lohnt ein zweiter Blick: Was genau ist
  hier die Wissensquelle – die Datei oder der Ordner?
solution: |
  | Nr. | Ursache | Gegenmittel | Wo im Agent Builder |
  |---|---|---|---|
  | 1 | Lückenregel fehlt, Websuche liefert fremde Angaben | Websuche aus, Regel „fehlende Angaben als [FEHLT: …]" | Websuche bzw. Webinhalte deaktivieren; Anweisungen |
  | 2 | veraltete Datei im Wissen | Produktdaten_2024 aus dem Ordner entfernen (archivieren), nicht nur neue ergänzen | Wissensquelle: Ordner aufräumen oder nur die aktuelle Datei angeben |
  | 3 | Kontextverlust in langen Chats | Kernregel weit vorn in den Anweisungen; neuer Chat pro Produkt | Anweisungen; Kurzanleitung |
  | 4 | Beispiele nicht als Stilvorbild gekennzeichnet | Regel „Beispiele nur als Stilvorbild, keine Sätze übernehmen"; Beispiele in der Datei kennzeichnen | Anweisungen; Wissensdatei |
  | 5 | keine Grenzen formuliert | Abschnitt „Grenzen" mit freundlicher Ablehnung und Hinweis auf den Zweck | Anweisungen |

  Copilot schlägt bei Fall 2 oft nur vor, „die neue Datei zu priorisieren". Das reicht nicht: Solange
  die alte Datei im angegebenen Ordner liegt, kann der Agent sie finden. Fall 2 ist damit ein
  Microsoft-365-typischer Fehler – der Ordner ist die Wissensquelle, nicht die Datei.

  Nach jeder einzelnen Korrektur läuft der gesamte Testkatalog erneut – sonst bleibt unbemerkt,
  ob zum Beispiel die neue Grenzregel auch legitime Anfragen wie „Kürze diesen Text" ablehnt.
  Und jede Änderung landet zuerst im Assistenten-Steckbrief, dann im Agent.
