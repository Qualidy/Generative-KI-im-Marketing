title: Kennzeichnen – ja, nein oder freiwillig? – Prompt-Duell in der Gruppe
difficulty: 1
question: |
  **Gruppenarbeit:** 4 Personen in zwei Paaren (bei 3 Personen: ein Paar und eine Einzelperson),
  ca. 20 Minuten, in **Copilot Chat** (Modus **Arbeit**). Am Ende liegt eine gemeinsame
  Einordnung aller sechs Fälle vor, und ihr wisst, welcher der beiden Prompts die bessere
  Vorprüfung geliefert hat.

  Ordnet die folgenden Inhalte von Fjordlicht ein: Ist nach **Art. 50 AI Act** eine Offenlegung
  **Pflicht**, **eingeschränkte Pflicht**, **keine Pflicht** oder eine **Grauzone**? Spielen
  zusätzlich **Plattformregeln** oder das **UWG** eine Rolle?

  ```text
  1. Instagram-Caption zum Fleece „Skog", mit Copilot entworfen und redigiert
  2. Realistisches Video: Ein bekannter Bergsteiger lobt die Regenjacke „Sølv" – er hat nie
     zugestimmt, Stimme und Gesicht sind generiert
  3. Comic-artige Illustration eines Fuchses mit Rucksack „Tind" für Pinterest
  4. Blogbeitrag zu neuen EU-Vorgaben für Textilrecycling, vollständig KI-generiert und ohne
     Prüfung veröffentlicht
  5. Fotorealistisches TikTok-Bild: fiktive Familie beim Zelten an einem namenlosen See
  6. Chatbot im Webshop, der Größenfragen beantwortet
  ```

  1. **Arbeitsteilung:** Jedes Paar ordnet drei Fälle mit dem Entscheidungsbaum aus Abschnitt
     39.5 ein (Paar A: Fälle 1–3, Paar B: Fälle 4–6) und erklärt dem anderen Paar danach in je
     einem Satz pro Fall seine Entscheidung. Das andere Paar darf widersprechen.
  2. **Unsichere Fälle wählen:** Einigt euch auf die zwei Fälle, bei denen die Gruppe am
     unsichersten ist.
  3. **Prompt-Duell:** Beide Paare prüfen dieselben zwei Fälle in Copilot Chat, aber mit
     unterschiedlichen Prompts. **Paar A** nutzt den Prompt **„Kennzeichnungs-Vorprüfung"** aus
     Abschnitt 39.5. **Paar B** fragt kurz: „Muss dieser Inhalt nach dem AI Act gekennzeichnet
     werden?"
  4. **Vergleich und Entscheidung:** Legt die Antworten nebeneinander. Wo stimmen sie mit eurer
     Einordnung überein, wo nicht? Welche Antwort markiert Unsicherheiten zu Recht mit
     [UNKLAR], welche ist zu sicher? Entscheidet gemeinsam, welcher Prompt sich für den Alltag
     eignet, und speichert ihn jeweils in eurer eigenen **Prompt Gallery**.
tip: |
  Fragt zuerst: Ist es Bild, Audio oder Video, das fälschlich echt wirkt? Dann: Ist es Text zu
  einem Thema von öffentlichem Interesse? Und erst danach: Was verlangen Plattform und UWG? Achtet
  im Prompt-Duell darauf, ob die Kurzfrage von Paar B die Plattformregeln und das UWG überhaupt
  anspricht. Wenn ihr den Prompt aus 39.5 in die Prompt Gallery speichert, habt ihr ihn für den
  Workshop und den Alltag griffbereit.
solution: |
  | Nr. | AI Act | Weitere Regeln |
  |---|---|---|
  | 1 | keine Pflicht – normaler Werbetext | keine |
  | 2 | Pflicht (Deepfake einer realen Person, Art. 50 Abs. 4) | darf so gar nicht erscheinen: Persönlichkeitsrecht, KUG, UWG |
  | 3 | keine Pflicht – wirkt nicht fälschlich echt | keine |
  | 4 | Pflicht – Text zu öffentlichem Interesse ohne redaktionelle Verantwortung | Faktencheck fehlt, Reputationsrisiko |
  | 5 | Grauzone – keine reale Person, aber realistisch | TikTok-Label für realistische KI-Inhalte setzen |
  | 6 | Pflicht – Hinweis auf KI-Interaktion (Art. 50 Abs. 1) | Datenschutzhinweis |

  Der wichtigste Punkt steckt in Nr. 2: Eine Kennzeichnung macht den Inhalt **nicht** zulässig.
  Ohne Einwilligung des Bergsteigers verletzt das Video sein Persönlichkeitsrecht und ist als
  erfundene Empfehlung irreführend. Kennzeichnungspflicht und Zulässigkeit sind zwei getrennte
  Fragen. Bei Nr. 4 würde eine fachliche Prüfung mit benannter Verantwortung die Pflicht entfallen
  lassen – und den Beitrag nebenbei besser machen.

  Zum Prompt-Duell: Häufig unsicher sind Nr. 4 und Nr. 5. Eine gute Antwort nennt bei Nr. 4 die
  Ausnahme der redaktionellen Verantwortung und markiert bei Nr. 5 die AI-Act-Einordnung als
  [UNKLAR], verweist aber klar auf das Plattformlabel. Prüft, ob die Antwort auf die Kurzfrage
  bei Nr. 5 pauschal „keine Pflicht" sagt – dann fehlt der Blick auf die Plattformregeln. Der
  strukturierte Prompt aus 39.5 fragt diese Punkte ausdrücklich ab und ist deshalb für den
  Alltag die bessere Wahl.

  Bewertungskriterien:

  - Alle sechs Fälle sind in der Gruppe richtig eingeordnet; Widersprüche zwischen den Paaren
    wurden geklärt.
  - Beide Prompts wurden an denselben zwei Fällen getestet.
  - Die Unterschiede zwischen den Antworten der beiden Paare sind benannt und mit dem
    Prompt-Aufbau erklärt.
  - Die Gruppe hat begründet entschieden, welchen Prompt sie speichert.
