title: Copilot-Bilderzeugung, Midjourney-Parameter und Werkzeugwahl
difficulty: 1
question: |
  **Teil A – in Copilot ausprobieren:** Öffne Copilot Chat in der Microsoft-365-Copilot-App und
  erzeuge ein schnelles Stimmungsbild für den Fjordlicht-Newsletter:

  ```text
  Erstelle ein Bild: Thermobecher und gefaltete Wollmütze auf einem
  verwitterten Holztisch, im Hintergrund unscharf ein nebliger Garten.
  Ruhiges, natürliches Foto, bedeckter Morgen, gedämpfte Grün- und Brauntöne.
  Querformat, linke Hälfte ruhig für eine Headline. Kein Text, keine Logos.
  ```

  Verfeinere das Bild danach in **zwei** Runden im Gespräch (z. B. „mehr Nebel", „Becher weiter
  nach rechts"). Notiere: Was ließ sich per Zuruf steuern, was nicht (Format, Varianten,
  Wiederholbarkeit eines Ergebnisses)?

  **Teil B – Parameter zuordnen:** In Copilot steuerst du alles über natürliche Sprache.
  Midjourney nutzt dafür Parameter. Ordne jedem Ziel den passenden Midjourney-Parameter zu
  (`--ar`, `--stylize`, `--chaos`, `--no`, `--seed`, `--sref`) und notiere, wie du dasselbe
  Ziel in Copilot formulieren würdest – oder ob es dort nicht geht.

  1. Das Bild soll im Hochformat für Instagram (4:5) erscheinen.
  2. Die Varianten eines Durchlaufs sollen sich für ein Moodboard stark unterscheiden.
  3. Es soll kein Text im Bild auftauchen.
  4. Der Look soll sich an einem freigegebenen Kampagnenbild orientieren.
  5. Das Bild soll sachlicher und näher am Prompt sein, weniger „künstlerisch".
  6. Du willst möglichst nah an ein früheres Ergebnis herankommen.

  **Teil C – Werkzeugwahl:** Copilot ist euer Ausgangswerkzeug. Wann reicht es, wann
  greifst du zu einem Werkzeug aus Kapitel 31 – und warum?

  - (a) Hintergrund eines echten Produktfotos für ein Banner verbreitern
  - (b) Plakatentwurf mit Überschrift, Unterzeile und Datum
  - (c) schnelles Stimmungsbild, das du danach im Gespräch mehrfach anpasst
  - (d) stimmungsvolles Kampagnenmotiv mit starkem eigenem Look
tip: |
  Bei Teil C gibt es manchmal zwei vertretbare Antworten. Entscheidend ist die Begründung über
  die Stärke des Werkzeugs. Halte deine Beobachtungen aus Teil A fest – sie sind die erste Zeile
  der Vergleichsmatrix im Workshop.
solution: |
  **Teil A – typische Beobachtungen:** Motiv, Licht, Farben und Bildaufbau lassen sich per Zuruf
  gut steuern; Copilot kennt das vorherige Bild im Gespräch. Das Seitenverhältnis wird oft nur
  grob umgesetzt (quer, hoch, quadratisch) – exakte Formate entstehen dann per Zuschnitt im
  Layout. Ein bestimmtes Ergebnis lässt sich nicht gezielt wiederholen, und nach mehreren Runden
  „wandern" Details mit (31.2: dann neuen Chat starten und bestes Bild hochladen).

  **Teil B:**

  | Nr. | Midjourney | in Copilot |
  |---|---|---|
  | 1 | `--ar 4:5` | „Hochformat 4:5" in den Prompt; ggf. im Layout zuschneiden |
  | 2 | `--chaos` (z. B. 30 bis 50) | um „vier deutlich unterschiedliche Varianten" bitten, Unterschiede benennen |
  | 3 | `--no text` | „Kein Text, keine Schrift, keine Logos im Bild" |
  | 4 | `--sref` | freigegebenes Bild hochladen: „Übernimm Licht, Farbwelt und Look, nicht das Motiv" |
  | 5 | `--stylize` niedrig, ggf. `--style raw` | „sachliches, dokumentarisches Foto, kein Hochglanz, keine Effekte" |
  | 6 | `--seed` | nicht steuerbar; im selben Chat weiterarbeiten oder Bild hochladen und nur die Änderung beschreiben |

  **Teil C:**

  | Aufgabe | Werkzeug | Begründung |
  |---|---|---|
  | (a) | Firefly in Photoshop (Generatives Erweitern) | bearbeitet das echte Foto, Produkt bleibt unverändert |
  | (b) | Copilot oder Ideogram für den Entwurf, finale Texte im Layout (z. B. PowerPoint, Express) | Ideogram stärker bei mehreren Textelementen; Pixeltext ist nicht korrigierbar |
  | (c) | Copilot Chat (alternativ ChatGPT Images) | Bearbeitung auf Zuruf im Gespräch, läuft im Mandanten |
  | (d) | Midjourney, Copilot als Entwurfswerkzeug | starke Ästhetik und Art Direction |

  Parameternamen und Funktionsumfang ändern sich bei allen Anbietern – im Zweifel die aktuelle
  Dokumentation prüfen.
