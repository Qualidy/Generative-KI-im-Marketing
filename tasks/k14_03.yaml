title: Kritischer Kommentar unter dem Launch-Post
difficulty: 3
question: |
  Unter dem Launch-Post der Regenjacke „Sølv" steht folgender (fiktiver) Kommentar mit
  bereits 140 Likes:

  ```text
  "Recyceltes Polyamid" klingt super, aber eure Jacken werden in Asien
  genäht und per Schiff hergekarrt. Ist das jetzt nachhaltig oder nur
  Marketing?
  ```

  Fjordlicht weiß: Produktion in Portugal und Vietnam, Transport überwiegend per Seefracht,
  Lieferkette nach einem anerkannten Sozialstandard geprüft, eine Klimabilanz der Jacke gibt
  es **nicht**.

  **Gruppe:** 4 Personen · **Dauer:** ca. 30 Minuten · **Rollen:** Prompt-Verantwortliche
  (baut Prompt und Agent), Faktenprüferin, Advocatus Diaboli (spielt kritische Follower),
  Freigabe (entwirft die Freigabeanfrage und führt das Protokoll) · **Am Ende liegt vor:** ein
  geteilter Agent „Fjordlicht Community-Entwürfe", ein geprüfter Antwortentwurf und eine
  Gruppenentscheidung zum Ausblenden.

  1. **Basisdaten (alle):** Jede Person ergänzt in ihrer eigenen „Fjordlicht-Basisdaten.docx"
     einen kurzen Abschnitt **Lieferkette** mit genau diesen vier Fakten.
  2. **Prompt:** Die Prompt-Verantwortliche schreibt einen Antwort-Prompt mit festen
     Leitplanken, der verhindert, dass Copilot Aussagen ergänzt, die Fjordlicht nicht belegen
     kann, und testet ihn in **Copilot Chat** mit Verweis auf `/Fjordlicht-Basisdaten`.
  3. **Prüfung:** Die Faktenprüferin geht den Entwurf Satz für Satz gegen die Faktenliste durch:
     Was wird übernommen, was gestrichen?
  4. **Agent:** Die Prompt-Verantwortliche legt aus dem geprüften Prompt mit dem **Agent Builder**
     den Agent **„Fjordlicht Community-Entwürfe"** an (Anweisungen aus dem Prompt, Wissen aus ihrer
     Basisdaten-Datei, zwei Startprompts) und teilt ihn mit der Gruppe.
  5. **Stresstest:** Der Advocatus Diaboli schreibt zwei weitere Kommentare – eine schärfere
     Nachfrage („Dann nennt doch eure CO₂-Zahlen!") und einen harmlosen Kommentar. Alle vier
     testen den geteilten Agent mit diesen Kommentaren und vergleichen die Antworten: Hält jede
     Antwort die Leitplanken ein? Unterscheiden sich die Entwürfe zwischen den Personen?
  6. **Freigabe:** Die Rolle Freigabe lässt in **Outlook** mit Copilot eine kurze Freigabeanfrage an
     die zuständige Person entwerfen (Entwurf, Kommentar, offene Punkte) – nicht senden. Die Gruppe
     legt fest, wer das im Team sein sollte.
  7. **Gruppenentscheidung:** Wäre „Kommentar ausblenden" vertretbar? Einigt euch und stellt die
     Entscheidung mit dem Antwortentwurf im Plenum in zwei Minuten vor.
tip: |
  Die Stärke einer guten Antwort liegt hier im Eingeständnis dessen, was man nicht weiß. Achtet
  darauf, ob ein Entwurf die Kritik „wegmoderiert" oder Lücken mit freundlichen Allgemeinplätzen
  füllt. Ein Agent spart das Wiederholen der Leitplanken, ersetzt aber nicht die Freigabe: Er
  entwirft, ein Mensch postet. Beim Stresstest lohnt sich der Blick darauf, ob der Agent andere
  Abschnitte der Basisdaten (z. B. den Reparaturservice) heranzieht und damit vom Kern der Kritik
  ablenkt.
solution: |
  Beispielprompt (zugleich Anweisungen für den Agent):

  ```text
  Du bist Community-Managerin bei Fjordlicht. Entwirf eine Antwort auf den
  Kommentar unten. Max. 4 Sätze, Du-Ansprache, ruhig, ehrlich, nicht
  defensiv. Nutze ausschließlich die Abschnitte "Belegte Claims" und
  "Lieferkette" aus /Fjordlicht-Basisdaten.
  Erwähne, was wir nicht wissen. Verwende nicht die Wörter nachhaltig,
  klimaneutral, umweltfreundlich. Kein Werbeversprechen, keine Erstattung,
  kein Rabatt. Gib zusätzlich an: Muss ein Mensch vor dem Posten
  Rücksprache halten? Ja/Nein mit Begründung.
  Kommentar (anonymisiert): [Kommentartext]
  ```

  Mögliche Startprompts für den Agent: „Entwirf eine Antwort auf diesen Kommentar: …" und „Muss
  dieser Kommentar vor der Antwort freigegeben werden? …".

  Mögliche Befunde: Der Entwurf ist brauchbar, enthält aber einen Satz wie „Nachhaltigkeit ist
  uns ein Herzensanliegen" oder eine Aussage über „kurze Transportwege". Beides streichen – das
  Erste ist Floskel, das Zweite falsch. Bei der Nachfrage nach CO₂-Zahlen ist entscheidend, ob der
  Agent klar sagt, dass es keine Klimabilanz gibt, statt eine Zahl oder einen Vergleich
  anzudeuten. Unterscheiden sich die Agent-Antworten zwischen den Gruppenmitgliedern, zeigt das:
  Auch mit festen Anweisungen bleibt jede Antwort ein Entwurf, der geprüft werden muss.

  Freigabe: Die Antwort ist eine öffentliche Umweltaussage unter einem viel gelesenen Post. Sie
  sollte von der Person freigegeben werden, die die Claim-Liste verantwortet (bei Fjordlicht die
  Marketingleitung bzw. die Nachhaltigkeitsverantwortliche), weil eine missverständliche Antwort
  irreführend sein kann (UWG) und sich als Screenshot verbreitet. Den Outlook-Entwurf prüft ihr
  vor dem Senden selbst – achtet darauf, ob Copilot eine Dringlichkeit ergänzt, die ihr nicht
  meint.

  Ausblenden ist nur vertretbar bei Beleidigungen, Spam oder Verstößen gegen die Netiquette. Eine
  sachliche Kritik auszublenden wirkt wie ein Eingeständnis und verschärft die Lage meist.

  Bewertungskriterien: Faktenliste in den Basisdaten ergänzt und im Prompt begrenzt, ausdrückliche
  Wissenslücke, mindestens eine gestrichene Copilot-Formulierung mit Begründung, Agent angelegt,
  geteilt und mit drei Kommentaren getestet, konkrete Freigaberolle; zur Zusammenarbeit: der
  Advocatus Diaboli hat den Agent sichtbar herausgefordert, Abweichungen zwischen den
  Agent-Antworten der Gruppenmitglieder wurden benannt und erklärt, und die Entscheidung zum
  Ausblenden ist eine begründete Gruppenentscheidung.
