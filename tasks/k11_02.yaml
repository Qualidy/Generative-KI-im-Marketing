title: Gezielte Überarbeitung in einer Copilot Page
difficulty: 2
question: |
  Diese Übung machst du in **Copilot Chat** und **Copilot Pages** (falls in eurer Umgebung
  freigegeben; sonst in Word mit Copilot).

  Ausgangstext für einen Newsletter-Teaser:

  ```text
  Unser neues Fleece Skog ist einfach das beste Fleece, das es gibt!!!
  Es ist super warm, mega nachhaltig und rettet quasi den Planeten.
  Jetzt zuschlagen, bevor es weg ist! Das Material besteht zu 80 Prozent
  aus recyceltem Polyester. Erhältlich in drei Farben.
  ```

  1. Gib den Text in Copilot Chat ein und bitte darum, ihn **unverändert** zurückzugeben.
     Übernimm die Antwort in eine **Page** – ab jetzt arbeitest du nur noch dort.
  2. Markiere in der Page **nur den ersten Satz** und lass ihn in Fjordlicht-Markenstimme
     überarbeiten (ruhig, ehrlich, keine Superlative). Verweise dafür auf
     `/Fjordlicht-Basisdaten` (falls nicht vorhanden: Kap. 11, Kurzübung 1, oder die Markenstimme
     direkt einfügen).
  3. Überarbeite danach **nur den zweiten Satz** so, dass keine unbelegte Nachhaltigkeitsaussage
     übrig bleibt.
  4. Verlange nach jedem Schritt eine Änderungsliste.
  5. Prüfe am Ende selbst: Sind „80 Prozent", „recyceltes Polyester" und „drei Farben" unverändert?
     Und hat Copilot außerhalb der Markierung etwas angefasst?
  6. Öffne den Versionsverlauf der Page bzw. des Dokuments und stelle fest, ob du zur
     Ausgangsfassung zurückspringen könntest.
tip: |
  Formuliere jede Anweisung mit einer Grenze („Ändere ausschließlich …") und einem Schutz für
  Zahlen und Produktnamen. Ohne diese Grenze schreibt Copilot oft den ganzen Absatz neu. Wenn du
  in Word arbeitest, schalte vorher „Änderungen nachverfolgen" ein: Dann prüfst du übernommene
  Copilot-Vorschläge wie die Korrektur einer Kollegin.
solution: |
  Beispielanweisung für Schritt 2 (zur markierten Stelle in der Page):

  ```text
  Überarbeite ausschließlich den markierten Satz in der Markenstimme aus
  /Fjordlicht-Basisdaten: ruhig, ehrlich, leicht nordisch-trocken,
  Du-Ansprache, keine Superlative, keine Ausrufezeichen.
  Alles andere bleibt wortgleich. Liste danach auf, was du geändert hast.
  ```

  Mögliches Ergebnis nach Schritt 2 und 3:

  ```text
  Das neue Fleece Skog hält warm, ohne aufzutragen.
  Sein Material besteht zu 80 Prozent aus recyceltem Polyester.
  Jetzt zuschlagen, bevor es weg ist! Das Material besteht zu 80 Prozent
  aus recyceltem Polyester. Erhältlich in drei Farben.
  ```

  Beobachtung: Der zweite Satz wiederholt jetzt die Materialangabe – ein typischer Effekt, wenn
  man eine unbelegte Aussage durch die einzige belegte ersetzt. Das ist kein Fehler der
  Anweisung, sondern ein Strukturproblem, das du erst beim Lesen des Ganzen erkennst (Phase 2).
  Der dritte Satz („Jetzt zuschlagen …") wurde korrekt **nicht** angefasst, passt aber auch nicht
  zur Marke – ein Kandidat für den nächsten gezielten Schritt.

  Zum Werkzeug: Die Page hält den Text als eigenes Objekt neben dem Chat, du kannst Stellen
  markieren und weiterbearbeiten und sie später teilen. Ob Copilot wirklich nur die Markierung
  ändert, musst du trotzdem prüfen – die Änderungsliste ist eine Hilfe, kein Beweis.

  Eine gute Bearbeitung zeigt: Zahlen und Produktname unverändert, Änderungslisten vorhanden,
  mindestens eine Stelle, an der du die Änderungsliste mit dem Text abgeglichen hast, und ein
  Blick in den Versionsverlauf.
