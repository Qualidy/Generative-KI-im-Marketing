title: Die Geschäftsführerin als digitaler Zwilling – Vorlage im Team
difficulty: 3
question: |
  Die Geschäftsführerin von Fjordlicht, Frau Brink (fiktiv), ist von einer HeyGen-Demo
  begeistert. Sie schlägt per Mail vor:

  ```text
  - eigener Avatar und geklonte Stimme von ihr
  - jede Woche ein 60-Sekunden-Video "Neues aus Münster" für Instagram und LinkedIn
  - Skripte schreibt der Content-Assistent, das Marketing gibt frei, sie selbst schaut nur gelegentlich rein
  - Übersetzung ins Niederländische per Ein-Klick-Funktion
  - Kennzeichnung "nicht nötig, ich bin es ja selbst"
  ```

  **Gruppenarbeit:** 4 Personen (bei 3 übernimmt eine Person zwei Dimensionen), etwa 30 Minuten.
  **Am Ende liegt vor:** eine einseitige Entscheidungsvorlage in einem geteilten Word-Dokument und
  ein Antwortentwurf in Outlook; im Plenum nennt ihr eure Empfehlung in einer Minute.

  1. **Arbeitsteilung nach Dimensionen.** Jede Person übernimmt eine Dimension und lässt Copilot
     Chat (Modus **Arbeit**) Chancen und Risiken dafür aufstellen: **Recht** (Einwilligung,
     Art. 50 AI Act, Plattformregeln), **Sicherheit** (Missbrauch der Stimme, Verweis Kap. 38),
     **Qualität/Freigabe**, **Markenwirkung**. Hakt nach, wenn Copilot Einwilligung und
     Transparenz vermischt.
  2. **Entscheidungsvorlage in Word.** Eine Person legt im Ordner „Fjordlicht-Kurs" ein
     Word-Dokument „Entscheidung-Avatar-GF" an und teilt es; alle fügen ihre Ergebnisse unter
     ihrer Dimension ein. Markiert die gesammelten Ergebnisse und lasst Copilot in Word sie zu
     einer einseitigen Vorlage umschreiben (Ausgangslage, Chancen, Risiken, Empfehlung). Ergänzt gemeinsam eine **Empfehlung** mit
     mindestens fünf konkreten, prüfbaren Regeln, unter denen das Vorhaben vertretbar ist – oder
     begründet, warum ihr abratet. Jede Person prüft mit „Änderungen nachverfolgen", ob ihre
     Dimension in der Kurzfassung noch korrekt steht.
  3. **Antwort und Rollenspiel.** Eine Person lässt in Outlook von Copilot eine kurze Antwort an
     Frau Brink entwerfen, die die Vorlage anhängt und beim Punkt Kennzeichnung klar, aber
     respektvoll widerspricht, und nutzt das **Coaching durch Copilot**. Eine zweite Person liest
     den Entwurf in der Rolle von Frau Brink und reagiert spontan. Die Gruppe prüft: Ist die
     Kernaussage noch erkennbar? Passt den Ton danach selbst an.
tip: |
  Der Kern liegt im letzten Punkt: Dass die Geschäftsführerin selbst zustimmt, klärt die
  Einwilligung – nicht die Frage, ob das Publikum weiß, dass sie gar nicht gesprochen hat. Achtet
  darauf, ob Copilots Entwurf den Widerspruch gegenüber der Vorgesetzten so weich formuliert, dass
  er verschwindet. Das Rollenspiel zeigt schnell, ob die Mail ihr Ziel erreicht.
solution: |
  Beispiel-Prompt für die Dimension Recht in Copilot Chat (für die anderen Dimensionen
  entsprechend anpassen):

  ```text
  Unsere Geschäftsführerin möchte einen KI-Avatar mit geklonter Stimme von
  sich für wöchentliche Social-Videos (Vorschlag unten). Stelle Chancen und
  Risiken nur für die Dimension Recht auf: Einwilligung, Art. 50 Abs. 4
  AI Act, Plattformlabels. Trenne ausdrücklich Einwilligung (stimmt die
  Person zu?) und Transparenz (weiß das Publikum, dass es ein Avatar ist?).
  Ausgabe: Tabelle, danach zwei prüfbare Regeln. Keine Rechtsberatung,
  kennzeichne unsichere Punkte.
  [Vorschlag einfügen]
  ```

  **Chancen:** sichtbares Gesicht der Marke, regelmäßige Präsenz ohne Drehtermine,
  mehrsprachige Varianten, konsistente Qualität.

  | Dimension | Risiko |
  |---|---|
  | Recht | Einwilligung liegt vor, sollte aber schriftlich Zweck, Dauer, Widerruf regeln. Ein realistischer Avatar einer realen Person, der fälschlich echt wirkt, ist ein Deepfake im Sinne von Art. 50 Abs. 4 AI Act – offenlegen. Plattformen verlangen Labels für realistische KI-Inhalte. |
  | Sicherheit | Geklonte Stimme der Chefin ist ein Einfallstor für CEO-Fraud; Zugang zum Stimmprofil muss streng geregelt sein (Kap. 38). |
  | Qualität/Freigabe | Die Person spricht Aussagen, die sie nie gesehen hat. Fehler oder überzogene Claims werden ihr persönlich zugeschrieben. Ein-Klick-Übersetzung ohne Abnahme ist für die Außenkommunikation zu riskant. |
  | Markenwirkung | Wöchentliche Avatar-Videos können steril wirken (Uncanny Valley) und widersprechen „ehrlich", wenn das Publikum sich getäuscht fühlt. |

  **Empfehlung** (vertretbar unter Regeln):

  1. schriftliche Einwilligung mit Zweck, Kanälen, Laufzeit, Widerruf und Regelung beim Ausscheiden
  2. jedes Video sichtbar gekennzeichnet („mit KI-Avatar erstellt") plus Plattformlabel
  3. die Geschäftsführerin gibt jedes Skript selbst frei
  4. Übersetzungen: Skript prüfen lassen, Video muttersprachlich abnehmen
  5. Stimmprofil nur für zwei benannte Personen zugänglich, Zwei-Faktor-Anmeldung, keine Nutzung für Telefon oder Sprachnachrichten
  6. regelmäßig echte Videos dazwischen, damit die Person greifbar bleibt

  Beispiel-Prompt für den Outlook-Entwurf:

  ```text
  Antworte Frau Brink kurz und respektvoll: Wir unterstützen die Idee unter
  den Regeln in der angehängten Vorlage. Beim Punkt Kennzeichnung widersprechen
  wir klar: Ihre Zustimmung klärt die Einwilligung, nicht die Transparenz
  gegenüber dem Publikum. Schlage einen 20-minütigen Termin zur Abstimmung vor.
  ```

  Typische Reaktion im Rollenspiel: „Aber ich bin es doch wirklich." Eine gute Mail beantwortet
  das schon vorab: Das Gesicht ist echt, das Sprechen nicht – und genau das muss das Publikum
  wissen.

  Bewertungskriterien: Alle vier Dimensionen sind bearbeitet und in der Vorlage korrekt
  wiedergegeben; die Gruppe hat geprüft, ob die Copilot-Kurzfassung Aussagen einzelner
  Dimensionen verkürzt oder verfälscht hat. Die Vorlage trennt Einwilligung und Transparenz,
  benennt die Deepfake-Konstellation korrekt und enthält prüfbare Regeln statt allgemeiner
  Mahnungen. Der Mail-Entwurf enthält nach Coaching und Rollenspiel einen erkennbaren,
  begründeten Widerspruch zur fehlenden Kennzeichnung.
