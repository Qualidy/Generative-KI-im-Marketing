title: Kennzeichnen oder nicht? Fünf Grenzfälle im Team bewerten
difficulty: 3
question: |
  **Gruppe:** 4 Personen (zu dritt übernimmt eine Person zwei Plattformen), ca. 30 Minuten. Am
  Ende liegen eine gemeinsame **Copilot Page** mit geprüfter Plattformrecherche und
  Fallbewertung sowie drei Freigaberegeln in Word vor.

  Fjordlicht plant diese Veröffentlichungen:

  1. Instagram-Post: Echtes Produktfoto der Jacke „Sølv", Hintergrund mit Generative Fill zu
     einer fotorealistischen Moorlandschaft erweitert.
  2. TikTok-Video-Thumbnail: Fotorealistisches Bild eines bekannten Münsteraner
     Fußballspielers in Fjordlicht-Jacke, generiert „als Gag".
  3. LinkedIn: Generiertes Bild einer Werkstatthalle mit Personen in Fjordlicht-Business-
     Kleidung, ohne Hinweis auf KI, Text „So arbeiten unsere Kunden".
  4. Newsletter: Fotorealistisches Bild des Aasees in Münster unter einer geschlossenen
     Schneedecke mit Schlittschuhläufern – „Winter ist zurück".
  5. Pinterest: Stilisierte, erkennbar gemalte Illustration einer Wanderin mit Fleece „Skog".

  **Schritt 1 – Plattformregeln recherchieren (Arbeitsteilung).** Jede Person übernimmt eine
  Plattform: Instagram/Meta, TikTok, LinkedIn oder Pinterest. Lasst Copilot Chat im Modus **Web**
  die aktuellen Regeln dieser Plattform zur Kennzeichnung KI-generierter Bilder zusammenfassen –
  mit Quellen. Jede Person öffnet mindestens zwei Quellen und prüft, ob die Zusammenfassung
  stimmt. Eine Person übernimmt ihre Antwort in eine Copilot Page und teilt sie; die anderen
  ergänzen ihre geprüften Ergebnisse dort mit Quelle und Datum.

  **Schritt 2 – bewerten mit Rollen.** Verteilt die Rollen **AI Act**, **Plattformregeln**,
  **UWG/KUG/Markenrecht** und **Marketing** (vertritt, was die Kampagne erreichen will). Geht die
  Fälle gemeinsam durch: Jede Rolle bringt ihren Blick ein – kann Art. 50 Abs. 4 AI Act
  (Deepfake) betroffen sein, welche Plattformregel gilt, welches weitere Risiko besteht? Die
  Gruppe entscheidet je Fall: veröffentlichen, kennzeichnen, ändern oder verzichten. Haltet
  Entscheidung und Begründung in der Page fest.

  **Schritt 3 – Regeln festhalten.** Leitet drei Regeln für die Freigabe-Checkliste des Teams ab.
  Eine Person lässt sie sich von Copilot in Word knapp und ohne Rückfragebedarf formulieren
  (Entwurf mit Copilot, eure Fallbewertung aus der Page als Text in den Prompt eingefügt) und
  teilt das Dokument.
  Die anderen prüfen per Kommentar, ob Copilot dabei etwas abgeschwächt oder verschärft hat.

  Fall 2 erzeugt ihr nicht – die Übung bewertet ihn nur.
tip: |
  Trennt drei Fragen: Wirkt das Bild fälschlich echt und ähnelt es realen Personen, Orten oder
  Ereignissen (AI Act)? Was verlangt die Plattform? Und unabhängig davon: Täuscht das Bild über
  das Produkt oder über Tatsachen (UWG)? Die Rollen in Schritt 2 sorgen dafür, dass keine der drei
  Fragen untergeht. Plattformregeln ändern sich häufig – deshalb die Recherche mit Quellen und
  Datum.
solution: |
  Rechercheprompt (Modus Web), je Plattform angepasst:

  ```text
  Fasse die aktuellen Regeln von [Plattform] zur Kennzeichnung KI-generierter
  oder KI-bearbeiteter Bilder zusammen: Wann ist ein Label Pflicht, wird es
  automatisch gesetzt (z. B. über C2PA-Daten), was gilt für nur teilweise
  bearbeitete Fotos? Nenne zu jeder Aussage die Quelle mit Datum. Kennzeichne,
  wo die Quellen unklar sind.
  ```

  | Nr. | Art. 50 Abs. 4 | weiteres Risiko | Entscheidung |
  |---|---|---|---|
  | 1 | i. d. R. kein Deepfake, sofern keine reale Landschaft vorgetäuscht wird | Plattformlabel bei fotorealistischer KI prüfen; Produkt echt | veröffentlichen, Plattformregel befolgen, ggf. Label |
  | 2 | Deepfake einer realen Person | Recht am eigenen Bild, Persönlichkeitsrecht, Irreführung über Werbepartnerschaft | verzichten |
  | 3 | wohl kein Deepfake, wenn keine realen Personen erkennbar | UWG: suggeriert echte Kundschaft | ändern: echtes Foto oder Text und Label ehrlich anpassen |
  | 4 | Deepfake möglich: realer Ort, Ereignis wirkt echt | Irreführung, falls es so nicht war | kennzeichnen oder als Illustration gestalten |
  | 5 | keine Pflicht, erkennbar künstlerisch | gering | veröffentlichen, freiwilliger Hinweis möglich |

  Mögliche Regeln für die Checkliste:

  ```text
  1. Keine erkennbaren realen Personen ohne schriftliche Einwilligung –
     auch nicht als Gag.
  2. Fotorealistische Bilder realer Orte oder Ereignisse, die so nicht
     stattgefunden haben, werden gekennzeichnet oder nicht verwendet.
  3. Kein generiertes Bild darf echte Kundschaft, echte Mitarbeitende oder
     echte Produktdetails vortäuschen. Plattformlabels werden immer gesetzt,
     wenn die Plattform sie verlangt.
  ```

  Bewertungskriterien: Recherche für alle vier Plattformen mit geprüften Quellen und Datum in der
  Page; Stellen, an denen Copilots Zusammenfassung von den Quellen abwich, sind benannt; AI Act,
  Plattformregeln und UWG/KUG werden getrennt geprüft, jede Rolle hat ihren Blick eingebracht;
  Nr. 2 und Nr. 3 werden als Hauptrisiken erkannt; Meinungsverschiedenheiten zwischen den Rollen
  (etwa Marketing gegen UWG bei Nr. 3) sind festgehalten und begründet entschieden; die Regeln sind
  ohne Rückfrage anwendbar, Abschwächungen oder Verschärfungen durch Copilot sind kommentiert;
  Hinweis, dass Copilot keine Rechtsberatung ersetzt und im Zweifel die Rechtsabteilung
  entscheidet.
