title: KI-Rechtsauskunft mit Quellen prüfen
difficulty: 3
question: |
  Ein Kollege hat einen KI-Chat gefragt, was Fjordlicht beim KI-Einsatz rechtlich beachten muss,
  und will die Antwort als Teamrichtlinie verschicken. Auszug:

  ```text
  1. Ab 2026 muss jeder KI-generierte Inhalt mit "KI-generiert" gekennzeichnet werden.
  2. KI-Bilder gehören dem Nutzer, der den Prompt geschrieben hat, und sind urheberrechtlich
     geschützt.
  3. Das Training von KI mit fremden Werken ist in Deutschland seit dem GEMA-Urteil endgültig
     verboten.
  4. Wenn das Tool die kommerzielle Nutzung erlaubt, kann nichts passieren.
  5. Chatbots müssen nicht als KI gekennzeichnet werden, wenn sie freundlich formulieren.
  ```

  1. Bewerte jede Aussage **selbst**: **richtig**, **teilweise richtig** oder **falsch** – mit
     Begründung und Verweis auf den Abschnitt in diesem Kapitel.
  2. Stelle in **Copilot Chat** die Frage „Was muss ein deutsches Marketingteam beim KI-Einsatz
     rechtlich beachten?" zweimal: einmal im Modus **Arbeit** ohne Websuche, einmal im Modus
     **Web**. Vergleiche: Welche Fehler tauchen wieder auf, welche verschwinden?
  3. Lass den **Researcher**-Agent (falls in eurer Umgebung freigegeben) die Aussagen 1 und 3
     mit Quellen prüfen. Kontrolliere jede genannte Quelle: Ist es eine Primärquelle (z. B.
     EUR-Lex, Gerichtsmitteilung) oder eine Sekundärquelle? Werden Gericht, Datum und
     **Rechtskraft** korrekt genannt?
  4. Formuliere drei Regeln, wie euer Team KI-Antworten zu Rechtsfragen künftig behandelt, und
     speichere einen Prüf-Prompt dazu in der **Prompt Gallery**.
tip: |
  Solche Fehler entstehen selten aus dem Nichts. Meist wird eine richtige Teilaussage
  übergeneralisiert oder ein Urteil ohne seinen Status wiedergegeben. Achte bei Urteilen immer auf
  Gericht, Datum und Rechtskraft. Quellenangaben machen eine Antwort überprüfbar, nicht
  automatisch richtig – öffne die Quelle und lies nach, ob sie die Aussage wirklich trägt.
solution: |
  | Nr. | Bewertung | Begründung |
  |---|---|---|
  | 1 | falsch | Art. 50 verlangt Offenlegung bei Deepfakes und Texten zu öffentlichem Interesse ohne redaktionelle Verantwortung; normale Werbetexte meist nicht (39.4) |
  | 2 | falsch | ohne menschliche schöpferische Leistung i. d. R. kein Schutz nach § 2 Abs. 2 UrhG (39.1) |
  | 3 | falsch | TDM nach § 44b UrhG mit Opt-out; GEMA ./. OpenAI betrifft Memorisierung und ist nicht rechtskräftig (39.2) |
  | 4 | teilweise richtig | Bedingungen klären die Nutzung, nicht die Rechte Dritter im Output (39.3) |
  | 5 | falsch | Art. 50 Abs. 1: Hinweis, sofern KI-Interaktion nicht offensichtlich ist (39.4) |

  Im Vergleich liefert der Modus **Web** meist aktuellere Fristen und Urteile, übernimmt aber
  manchmal Fehler aus schwachen Quellen. Im Modus **Arbeit** ohne Web stützt sich Copilot auf
  das Modellwissen und eure Dateien; Daten und der Status von Verfahren sind dann besonders oft
  veraltet.

  Beispiel-Prompt für den Researcher:

  ```text
  Prüfe zwei Aussagen zum deutschen und europäischen Recht und belege jede
  Einschätzung mit Quellen. Bevorzuge Primärquellen (EUR-Lex, Gesetzestexte,
  Pressemitteilungen der Gerichte). Nenne bei Urteilen Gericht, Datum,
  Aktenzeichen, soweit verfügbar, und ob das Urteil rechtskräftig ist.
  Aussage A: [Aussage 1]
  Aussage B: [Aussage 3]
  Kennzeichne, wo Quellen sich widersprechen oder du unsicher bist.
  ```

  Typische Befunde: Der Researcher korrigiert Aussage 1 meist zutreffend, mischt aber teils
  Sekundärquellen (Kanzlei-Blogs, News) mit Primärquellen. Bei Aussage 3 wird der Status
  „nicht rechtskräftig" nicht immer genannt – genau hier lohnt die eigene Kontrolle.

  Mögliche Teamregeln:

  1. KI-Antworten zu Rechtsfragen sind Recherche-Einstieg, keine Richtlinie.
  2. Jede genannte Norm, Frist und jedes Urteil wird an einer Primärquelle (z. B. EUR-Lex) oder
     durch die Rechtsabteilung geprüft – inklusive Rechtskraft.
  3. Interne Richtlinien zu Recht gibt nur frei, wer dafür benannt ist.

  Bewertungskriterien: alle fünf Aussagen korrekt eingeordnet, Aussage 4 als teilweise richtig
  differenziert, Vergleich Arbeit/Web konkret, mindestens zwei Researcher-Quellen selbst geprüft
  und als Primär- oder Sekundärquelle eingeordnet, die Teamregeln sind konkret anwendbar.
