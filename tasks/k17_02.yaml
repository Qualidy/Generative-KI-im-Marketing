title: Jobs, Pain Points und Gains aus Bewertungen – arbeitsteilig mit Excel und Copilot Chat
difficulty: 2
question: |
  **Gruppe:** 4 Personen (bei 3 Personen übernimmt die Prüferin zusätzlich die Gains), ca.
  30 Minuten. **Aufteilung:** Person 1 **Jobs-to-be-done**, Person 2 **Pain Points**, Person 3
  **Gains**, Person 4 **Prüferin** in Excel. **Am Ende liegt vor:** eine gemeinsame **Copilot
  Page** mit geprüften Jobs, Pain Points und Gains samt Belegnummern und zwei Newsletter-Botschaften.

  Die folgenden fiktiven Bewertungen stammen aus dem Webshop von Fjordlicht (Wanderhose „Vidde"),
  bereits ohne Namen.

  ```text
  Nr;Sterne;Text
  1;5;Endlich eine Hose, mit der ich vom Büro direkt in den Teutoburger Wald kann.
  2;3;Material top, aber die Längen sind zu kurz für große Menschen.
  3;4;Trocknet schnell. Ob das Material wirklich recycelt ist, steht nirgends genau.
  4;5;Mit zwei Kindern draußen brauche ich Taschen, die zugehen. Hat sie.
  5;2;Nach drei Wäschen ausgeblichen. Für den Preis enttäuschend.
  6;5;Sieht nicht nach Outdoor-Katalog aus. Trage ich auch in der Stadt.
  7;4;Gute Hose, aber ich musste zweimal bestellen, die Größentabelle passt nicht.
  8;5;Knie verstärkt, hält Spielplatz und Klettersteig aus.
  9;3;Nachhaltig ist schön, aber wo ist das Zertifikat?
  10;4;Für Tagestouren ideal, im Hochsommer zu warm.
  ```

  1. **Daten ablegen.** Die Prüferin legt die Bewertungen als Tabelle in
     „Bewertungen-Vidde.xlsx" im Ordner „Fjordlicht-Kurs" an und teilt die Datei mit der Gruppe.
  2. **Analyse in Arbeitsteilung.** Personen 1–3 schreiben je einen Prompt nach dem
     P.R.O.M.P.T.-Framework (Kap. 5) für **ihren** Teil und führen ihn in Copilot Chat aus – die
     Datei per `/`-Verweis oder als Upload. Pflicht: hinter jedem Punkt die Nummern der
     belegenden Bewertungen. Jobs im Format „Wenn …, will ich …, damit …".
  3. **Prüfen in Excel (parallel).** Die Prüferin lässt sich von Copilot in Excel die Zeilen
     hervorheben, die bestimmte Themen enthalten (z. B. Größe, Nachhaltigkeit, Kinder), und
     legt so eine Prüfliste an.
  4. **Zusammenführen.** Eine Person übernimmt ihre Copilot-Antwort in eine **Copilot Page** und
     teilt sie; die anderen fügen ihre Ergebnisse ein. Die Prüferin geht jede Zuordnung mit der
     Gruppe durch: Stimmen die Belegnummern? Markiert alles, was **nicht** belegt ist, und
     Doppelungen zwischen den Teilen (z. B. derselbe Punkt als Pain Point und als Gain).
  5. **Botschaften.** Einigt euch auf zwei Botschaften für den Newsletter, die direkt an einem
     Pain Point ansetzen, und prüft sie gegen `/Fjordlicht-Basisdaten`: Gibt es den nötigen
     Beleg? Stellt eine Botschaft in einer Minute im Plenum vor.
tip: |
  Der wichtigste Modifier ist die Belegpflicht mit Nummern. Achtet darauf, ob in einem der drei
  Teile typische Outdoor-Themen wie „Wetterschutz" oder „Atmungsaktivität" auftauchen, die in
  keiner Bewertung stehen. Beim Zusammenführen zeigt sich außerdem, ob die drei getrennt
  geschriebenen Prompts zu einer stimmigen Gesamtsicht führen. Echte Bewertungen müsst ihr vor
  der Analyse anonymisieren (Kap. 4).
solution: |
  Beispielprompt (Person 2, Pain Points):

  ```text
  Du bist Marktforscherin im Outdoor-Handel.
  Aufgabe: Werte die Bewertungen in /Bewertungen-Vidde aus und liste
  nur die Pain Points auf.
  Format: Liste, hinter jedem Punkt die Nummern der Bewertungen in Klammern.
  Regeln: Nur, was in den Bewertungen steht. Kein Punkt ohne Nummer.
  Zweck: Ansatzpunkte für Newsletter-Botschaften zur Wanderhose Vidde.
  ```

  Erwartbares Gesamtergebnis in der Page:

  | Typ | Punkt | Belege |
  |---|---|---|
  | Job | Wenn ich nach der Arbeit spontan raus will, will ich eine Hose für Büro und Wald, damit ich mich nicht umziehen muss. | 1, 6 |
  | Job | Wenn ich mit Kindern unterwegs bin, will ich robuste Hosen mit sicheren Taschen, damit nichts verloren geht. | 4, 8 |
  | Pain Point | Nachhaltigkeit nicht belegt | 3, 9 |
  | Pain Point | Größen und Längen passen nicht | 2, 7 |
  | Pain Point | Farbe bleicht aus, Preis-Leistung | 5 |
  | Gain | eine Hose für Stadt und Natur | 1, 6, 10 |

  Botschaften, zum Beispiel: „Woraus Vidde besteht – mit Zertifikat zum Nachlesen" (nur, wenn ein
  Beleg in den Basisdaten existiert, sonst `[BELEG FEHLT]`) und „Die richtige Länge finden: unsere
  neue Größenhilfe". Mögliche Funde bei der Prüfung: ein ergänzter Punkt wie „wasserabweisend",
  der in keiner Bewertung steht, eine falsche Belegnummer, die das Hervorheben in Excel sichtbar
  macht, oder „Büro und Wald" einmal als Job und einmal als Gain.

  Bewertungskriterien: Alle drei Teilprompts verlangen Belegnummern; die Prüferin hat jede
  Nummer gegen die hervorgehobenen Zeilen abgeglichen; unbelegte Punkte und Doppelungen
  zwischen den Teilen sind in der Page markiert und aufgelöst; beide Botschaften sind gegen die
  Basisdaten geprüft.
