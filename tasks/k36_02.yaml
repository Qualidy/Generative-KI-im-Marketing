title: Vom Produkttext zum Sprechskript – drei Fassungen, eine Ausspracheliste
difficulty: 2
question: |
  **Gruppenarbeit:** 3–4 Personen, etwa 30 Minuten, in **Copilot in Word**. Für den Hörtest in
  Schritt 4 reicht die Word-Funktion **Vorlesen**; besser ist ein TTS-Werkzeug (z. B. ElevenLabs)
  oder eine Avatar-Plattform mit Testkontingent. **Am Ende liegt vor:** ein gemeinsames
  Sprechskript mit gemessener Dauer und einer **Ausspracheliste**, die jede Person in ihrem
  eigenen Dokument „Sprechskript-Vidde" sichert – ihr braucht sie im Workshop wieder.

  Ausgangstext (fiktiv, Produktseite Wanderhose „Vidde"):

  ```text
  Die Wanderhose "Vidde" (Material: 64 % rec. Polyamid, 36 % Elasthan; Gewicht ca. 380 g)
  überzeugt durch 4-Wege-Stretch, eine PFC-freie DWR-Ausrüstung sowie 2 seitl.
  Reißverschlusstaschen u. 1 Oberschenkeltasche. Pflege: 30 Grad, nicht in den Trockner.
  ```

  1. **Gleicher Prompt, mehrere Fassungen.** Jede Person legt im eigenen Ordner „Fjordlicht-Kurs"
     ein Word-Dokument „Sprechskript-Vidde" an, fügt den Ausgangstext ein, markiert ihn und lässt
     Copilot ihn mit **demselben** Prompt (Abschnitt 36.3, Vorlage in der Lösung) in ein
     **30-Sekunden-Sprechskript** (höchstens 70 Wörter) umschreiben, mit Verweis auf
     `/Fjordlicht-Basisdaten` (aus Kap. 11).
  2. **Vergleichen und auswählen.** Legt die Fassungen nebeneinander: Wie unterscheiden sich
     Wortzahl, Satzbau und Wortwahl? Hat eine Fassung eine Aussage gesteigert (z. B. aus „PFC-frei"
     mehr gemacht)? Wählt die beste Fassung als Grundlage; ihre Autorin teilt das Dokument mit der
     Gruppe.
  3. **Rollen im geteilten Dokument.**
     - **Faktenprüferin** stellt Copilot eine Frage zum Dokument: „Vergleiche Ausgangstext und
       Sprechskript: Welche Aussage ist im Skript stärker als im Original, welche Angabe fehlt?"
       und prüft selbst gegen die Tabelle „Lesetext – Sprechtext".
     - **Sprecher** liest das Skript laut mit Stoppuhr.
     - **Ohr** hört zu und markiert jede Stelle, an der der Sprecher stolpert, mit einem Kommentar.
     - **Skript-Verantwortliche** markiert nur diese Stellen und lässt sie von Copilot kürzer oder
       sprechbarer umschreiben.

     Danach tauschen Sprecher und Ohr, und das überarbeitete Skript wird noch einmal gelesen.
  4. **Hören und Ausspracheliste.** Lasst das Skript vorlesen bzw. von einer KI-Stimme sprechen.
     Legt unter dem Skript eine **Ausspracheliste** als Tabelle an (Wort, Problem, Lösung) für alle
     Wörter, die falsch klingen. Jede Person kopiert das fertige Skript mit der Ausspracheliste in
     ihr eigenes Dokument „Sprechskript-Vidde".
tip: |
  Achtet darauf, ob Copilot aus „PFC-frei" eine stärkere Nachhaltigkeitsaussage macht, als im
  Ausgangstext steht. Umformulieren heißt nicht, Aussagen zu steigern. Der Vergleich der Fassungen
  zeigt, dass derselbe Prompt nicht dasselbe Skript liefert – umso wichtiger ist die Prüfung. Die
  Vorlesefunktion in Word ist kein Ersatz für die spätere Werbestimme, aber sie zeigt schnell, wo
  Abkürzungen und Markennamen stolpern.
solution: |
  Beispiel-Prompt für das Umschreiben der markierten Passage (alle identisch):

  ```text
  Schreibe den markierten Text in ein Sprechskript für ein Avatar-Video um.
  Dauer: 30 Sekunden, höchstens 70 Wörter. Markenstimme aus
  /Fjordlicht-Basisdaten. Kurze Sätze, eine Aussage pro Satz, Du-Ansprache.
  Zahlen und Abkürzungen so ausschreiben, wie man sie spricht, keine
  Klammern. Kernbotschaft im ersten und letzten Satz. Sprechpausen als [Pause].
  Keine Superlative, keine Eigenschaften erfinden, Aussagen nicht steigern.
  ```

  Beispiel für ein gelungenes Sprechskript (rund 65 Wörter):

  ```text
  Das ist die Vidde. Eine Wanderhose, die mitgeht. [Pause]
  Sie dehnt sich in alle Richtungen - bergauf, bergab, über Zäune.
  Regen perlt ab, und zwar ohne PFC. [Pause]
  Zwei Taschen mit Reißverschluss an der Seite, eine am Oberschenkel.
  Waschen bei dreißig Grad, nicht in den Trockner.
  Die Vidde: gemacht für lange Tage draußen.
  ```

  Prüfpunkte: Abkürzungen („rec.", „u.", „DWR") sind aufgelöst oder weggelassen,
  Materialprozente stehen nicht im Sprechtext (gehören in die Einblendung), die Kernbotschaft
  steht vorn und am Schluss, kein Superlativ. Achtet beim Fassungsvergleich auf Formulierungen
  wie „umweltfreundlich imprägniert" statt „ohne PFC" – das ist eine Steigerung und muss zurück.

  Typische Ausspracheliste:

  | Wort | Problem | Lösung |
  |---|---|---|
  | Vidde | englisch ausgesprochen | Ersatzschreibung „Widde" oder Aussprache-Wörterbuch |
  | PFC | als Wort gesprochen | „P-F-C" schreiben |
  | Fjordlicht | falsche Betonung | „Fjord-licht" mit Bindestrich testen |

  Bewertungskriterien: Die Gruppe hat benannt, wie sich die Fassungen aus demselben Prompt
  unterscheiden, und die Auswahl begründet. Steigerungen gegenüber dem Ausgangstext sind gefunden
  und zurückgenommen. Das Skript wurde von mindestens zwei Personen laut gelesen, die gemessene
  Dauer liegt bei etwa 30 Sekunden, Änderungen erfolgten gezielt an markierten Stellen. Die
  Ausspracheliste liegt in jedem persönlichen Dokument „Sprechskript-Vidde". Wer nach dem lauten
  Lesen nichts ändert, hat meist nicht laut gelesen.
