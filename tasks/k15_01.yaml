title: Was gehört ins Briefing? – Copilot fragt nach, die Gruppe vergleicht
difficulty: 1
question: |
  **Gruppe:** 3–4 Personen, ca. 20 Minuten. Jede Person arbeitet in ihrem eigenen Copilot Chat,
  gesammelt wird in einem gemeinsamen Teams-Chat der Gruppe. **Am Ende liegt vor:** eine Liste der
  drei wichtigsten Briefing-Lücken und eine Gruppenentscheidung zum Leadmagneten.

  Ein Kollege bei Fjordlicht hat folgendes „Briefing" für einen Blogartikel geschrieben:

  ```text
  Blogartikel über Wandern mit Kindern. Soll gut ranken und
  unsere Produkte zeigen. So 2.000 Wörter. Locker schreiben.
  ```

  1. **Gleicher Prompt, mehrere Ergebnisse.** Alle öffnen Copilot Chat (Modus **Arbeit**),
     fügen das Briefing ein und nutzen **wortgleich** den Rückfragen-Prompt aus Abschnitt 15.2:
     „Stelle mir bis zu fünf Rückfragen zu Lücken in diesem Briefing, bevor du schreibst."
     Copilot schreibt **noch keinen** Artikel. Kopiert eure Rückfragen in den Teams-Chat der Gruppe.
  2. **Vergleich.** Welche Rückfragen tauchen bei allen auf, welche nur bei einer Person? Achtet
     darauf, ob überhaupt jemand Rückfragen zu eigener Erfahrung, Faktenbasis oder No-Gos bekommen hat.
  3. **Zuordnung in Arbeitsteilung.** Teilt die vier Angaben des Briefings auf und ordnet jede
     einem Baustein des P.R.O.M.P.T.-Frameworks (Kap. 5) zu. Die Gruppe ergänzt gemeinsam, welche
     Bausteine ganz fehlen.
  4. **Gruppenentscheidung.** Einigt euch auf die **drei** wichtigsten fehlenden Angaben und
     haltet je Lücke einen Satz fest: Was würde ohne sie im Text passieren? Fehlt eine davon in
     **allen** Copilot-Rückfragen?
  5. **Leadmagnet.** Welcher Leadmagnet passt am besten zu diesem Artikel – und warum?
     (a) E-Book „Nachhaltigkeit bei Fjordlicht", (b) Checkliste „Packliste Tageswanderung mit
     Kindern", (c) Gewinnspiel „Gewinne eine Regenjacke". Stimmt ab und bereitet eine
     Begründung von höchstens einer Minute für das Plenum vor.
tip: |
  Frage bei jeder fehlenden Angabe: Was wird die KI an dieser Stelle selbst entscheiden – und
  wäre das in eurem Sinn? Der Vergleich zeigt zweierlei: Dieselbe Eingabe liefert nicht bei allen
  dieselben Rückfragen, und manche Lücken fragt womöglich niemandes Copilot ab. Genau diese
  Lücken muss die Gruppe selbst erkennen.
solution: |
  Beispiel-Prompt:

  ```text
  Hier ist ein Briefing für einen Blogartikel im Fjordlicht-Blog
  "Draußen-Notizen". Stelle mir bis zu fünf Rückfragen zu Lücken in
  diesem Briefing, bevor du schreibst. Schreibe noch keinen Artikel.
  Briefing: [Briefing einfügen]
  ```

  Mögliche Rückfragen: Alter der Kinder, Art der Touren, Region, gewünschte Produkte, Ziel des
  Artikels (Reichweite oder Verkauf?). Mögliche Beobachtung beim Vergleich: Kernfragen wie
  Zielgruppe oder Länge kommen bei mehreren Personen vor, Reihenfolge und Formulierung
  unterscheiden sich; Fragen nach eigener Erfahrung oder No-Gos tauchen selten oder gar nicht auf.

  | Angabe | Baustein |
  |---|---|
  | Blogartikel über Wandern mit Kindern | Request (sehr vage) |
  | gut ranken, Produkte zeigen | Purpose (unscharf, zwei Ziele) |
  | 2.000 Wörter | Output |
  | locker schreiben | Tone (unkonkret) |

  Fehlend (wichtigste drei):

  1. **Zielgruppe und Kernfrage** (Purpose/Request): Ohne sie wird der Text ein allgemeiner
     Überblick ohne klaren Nutzen – Kleinkind oder Teenager, Tagestour oder Hüttenwanderung?
  2. **Faktenbasis und No-Gos** (Modifier): Ohne sie erfindet die KI Produkteigenschaften,
     Sicherheitsangaben und vielleicht Nachhaltigkeitsaussagen. Die Antwort wäre ein Verweis
     auf `/Fjordlicht-Basisdaten`.
  3. **Erfahrung und Autor:in** (Persona/Modifier): Ohne sie entsteht austauschbarer Text,
     der E-E-A-T nicht erfüllt.

  Leadmagnet: **(b)**. Er löst das konkrete Problem der Lesenden direkt im Anschluss an den
  Artikel. (a) passt thematisch nicht, (c) sammelt Kontakte, die an einem Gewinn interessiert
  sind, nicht am Thema – und Gewinnspiele bringen zusätzliche rechtliche Anforderungen mit.

  Bewertungskriterien: Alle haben denselben Prompt genutzt und ihre Rückfragen geteilt;
  Gemeinsamkeiten und Abweichungen zwischen den Ergebnissen der Gruppenmitglieder sind benannt;
  die Gruppe hat mindestens eine Lücke erkannt, die in keiner Copilot-Antwort vorkam; die
  Leadmagnet-Entscheidung ist in einer Minute begründet.
