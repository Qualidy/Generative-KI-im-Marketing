title: Monitoring, Listening oder Eskalation?
difficulty: 1
question: |
  Ordne jede Situation bei Fjordlicht zu: Ist das **Monitoring** oder **Listening** (Abschnitt
  19.1)? Und welche **Eskalationsstufe** aus Abschnitt 19.5 – Grün, Gelb, Orange, Rot – ist
  angemessen?

  1. Eine Kundin markiert Fjordlicht auf Instagram mit einem Foto ihrer neuen Wanderhose.
  2. Über drei Monate taucht in Kommentaren immer häufiger die Frage auf, ob Fjordlicht Reparaturen
     anbietet.
  3. Eine Lokalzeitung fragt per E-Mail nach, ob an dem TikTok-Vorwurf zu recycelten Materialien
     etwas dran ist.
  4. Mehrere Eltern berichten, dass sich bei einer Kinderjacke ein Kordelstopper gelöst hat und von
     Kleinkindern verschluckt werden könnte.
  5. Das negative Sentiment liegt diese Woche deutlich über dem Schnitt; fast alle Beiträge betreffen
     Lieferverzögerungen nach einer Rabattaktion.
  6. Das Team vergleicht, worüber auf Reddit bei Fjordlicht und bei zwei Wettbewerbern gesprochen
     wird.
tip: |
  Monitoring reagiert auf den einzelnen Beitrag, Listening sucht Muster über Zeit oder Quellen.
  Bei der Eskalation entscheidet nicht die Zahl der Beiträge allein, sondern auch das **Thema**:
  Sicherheit und Medienanfragen wiegen schwerer als Ärger über Lieferzeiten.
solution: |
  | Nr. | Art | Stufe | Begründung |
  |---|---|---|---|
  | 1 | Monitoring | Grün | einzelne positive Erwähnung, Reaktion: Danke, ggf. teilen (mit Erlaubnis) |
  | 2 | Listening | Grün | Muster über Zeit: Der kostenlose Reparaturservice (erste zwei Jahre) ist offenbar zu wenig bekannt – Erkenntnis für Content |
  | 3 | Monitoring | Orange | Medienanfrage – abgestimmte Stellungnahme, keine Einzelantwort |
  | 4 | Monitoring | Rot | Produktsicherheit, Kinder betroffen – Krisenteam, Prüfung, ggf. Rückruf |
  | 5 | Listening | Gelb | deutlicher Ausschlag mit klarem Thema – Leitfaden-Antworten, Teamleitung informieren |
  | 6 | Listening | Grün | Wettbewerbsanalyse, keine akute Reaktion nötig |

  Fall 4 zeigt, warum Schwellenwerte allein nicht genügen: Schon wenige Beiträge reichen für
  Stufe Rot, wenn es um Sicherheit geht. Die Eskalationslogik braucht deshalb neben Mengen auch
  **Themen-Auslöser**.
