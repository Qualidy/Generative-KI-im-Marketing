title: Bild-KI-Werkzeugauswahl für ein Marketingteam
difficulty: 4
question: |
  **Szenario:** Im Marketingteam von Fjordlicht nutzt jede Person ein anderes Bildwerkzeug –
  teils mit privaten Konten. Die Leitung will Ordnung: eine begründete Empfehlung, welche
  Bild-KI-Werkzeuge das Team für welche Zwecke einsetzt und welche nicht. Du kannst alternativ
  **ein Unternehmen deiner Wahl** verwenden.

  ```text
  Rahmen:
  Team: 5 Personen, davon eine Grafikerin mit Adobe Creative Cloud.
  Vorhanden: ChatGPT Business-Lizenzen für alle.
  Budget für neue Bildwerkzeuge: überschaubar, monatlich kündbar bevorzugt.
  Kanäle: Webshop, Blog, Newsletter, Instagram, TikTok, LinkedIn, Pinterest.
  Grundsatz: Produkte werden echt gezeigt, keine Greenwashing-Bilder.
  ```

  ---

  **Runde 1 – Bedarf erheben.** Liste mindestens **acht** wiederkehrende Bildaufgaben des Teams
  über alle Kanäle auf (z. B. Newsletter-Header, Blog-Illustration, Pinterest-Pin, Social-Post,
  Infografik). Ordne jeder Aufgabe den Arbeitsmodus aus 29.4 zu und markiere die, bei denen
  Bild-KI **nicht** eingesetzt werden soll.

  **Runde 2 – Kriterien gewichten und testen.** Wähle **sechs** Kriterien aus 29.6, gewichte sie
  (Summe 100 Prozent) und begründe die Gewichtung. Teste mindestens **zwei** Werkzeuge mit
  demselben Prompt für zwei deiner Aufgaben und bewerte sie in einer Matrix (Punkte 1 bis 5).

  **Runde 3 – Die Komplikation.** Ein Teammitglied hat Entwürfe der noch unveröffentlichten
  Herbstkollektion in ein Bildwerkzeug mit privatem Konto hochgeladen, um „schnell Variationen zu
  testen". Kläre: Welche Risiken entstehen (Vertraulichkeit, Training auf Uploads, öffentliche
  Sichtbarkeit)? Was folgt daraus für deine Empfehlung? Formuliere **drei** verbindliche Regeln
  für den Umgang mit Uploads.

  **Runde 4 – Entscheidung unter Abwägung.** Die Leitung möchte aus Kostengründen nur **ein**
  Werkzeug. Die Grafikerin möchte drei. Entscheide, wie viele Werkzeuge ihr einsetzt, und
  begründe mit deiner Matrix. **Widersprich** dabei mindestens einer der beiden Positionen
  ausdrücklich und benenne, was im Alltag schiefgeht, wenn man ihr folgt.

  **Deliverable:**

  1. Bedarfsliste mit acht Aufgaben, Arbeitsmodus und Markierung „keine Bild-KI"
  2. gewichtete Kriterienmatrix mit Testergebnissen von mindestens zwei Werkzeugen
  3. drei Upload-Regeln aus Runde 3
  4. Empfehlung auf einer Seite: Werkzeuge, Zwecke, Ausschlüsse, Begründung

  **Fertig bist du erst, wenn** jede Bewertung in der Matrix auf einem eigenen Test beruht, die
  Upload-Regeln ohne Erklärung anwendbar sind, Produktdarstellungen ausdrücklich geregelt sind
  und deine Empfehlung die Gegenposition aus Runde 4 benennt und begründet zurückweist.
tip: |
  Der Lernkern liegt in Runde 2 und 3: Werkzeugauswahl ist keine Geschmacksfrage. Ein
  Werkzeug mit dem schönsten Look kann für ein Unternehmen ungeeignet sein, wenn Uploads zum
  Training verwendet oder Bilder öffentlich angezeigt werden. Und „ein Werkzeug für alles" ist
  nur dann falsch, wenn der Test zeigt, dass zentrale Aufgaben damit nicht gelingen.
solution: |
  Bewertungskriterien: (1) die Bedarfsliste deckt mehrere Kanäle ab und schließt
  Produktdarstellungen begründet von der reinen Generierung aus; (2) die Gewichtung ist
  nachvollziehbar begründet, und die Punkte beruhen auf echten Tests mit identischem Prompt;
  (3) die Upload-Regeln adressieren Vertraulichkeit, Kontotyp und Sichtbarkeit konkret (etwa:
  „unveröffentlichte Produkte nur in freigegebenen Business-Werkzeugen", „keine privaten
  Konten", „vor Nutzung Sichtbarkeit und Trainingseinstellungen prüfen"); (4) die Entscheidung
  in Runde 4 verbindet Kosten und Zweck und widerspricht einer Position mit einem konkreten
  Alltagsbeispiel.

  Lernziel: Bild-KI-Werkzeuge nach Zweck, Rechten, Datenschutz und Integration auswählen – und
  eine Empfehlung so begründen, dass sie im Team trägt.
