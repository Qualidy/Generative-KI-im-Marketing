title: Synthetische Interviews kritisch prüfen
difficulty: 3
question: |
  Ein Kollege präsentiert im Teammeeting: „Ich habe zehn synthetische Personas aus unserem
  Familien-Avatar erzeugt und sie zur neuen Mietoption für Kinderjacken befragt. **8 von 10 würden
  sie nutzen.** Wir können das Angebot starten."

  1. Führe selbst ein simuliertes Interview im KI-Werkzeug durch: Lass das Modell den Avatar
     „Tobias" (aus k18_01 oder selbst erstellt) spielen, mit der Rückfall-Regel aus Abschnitt 18.4,
     und stelle fünf Fragen zur Mietoption.
  2. Wiederhole dasselbe Interview in einem neuen Chat. Vergleiche: Wie stark unterscheiden sich die
     Antworten, wo antwortet das Modell über den Steckbrief hinaus?
  3. Bewerte die Aussage des Kollegen. Nenne mindestens **drei** methodische Probleme.
  4. Formuliere, wofür die Interviews trotzdem nützlich waren, und schlage einen Weg vor, die
     Nachfrage mit echten Menschen zu prüfen.
tip: |
  Achte im zweiten Durchlauf darauf, ob sich die **Haltung** ändert oder nur der Wortlaut. Und
  zähle, wie oft das Modell zustimmt, abwägt oder ablehnt. Die Neigung zur Zustimmung ist eines
  der stabilsten Muster synthetischer Befragungen.
solution: |
  Typische Beobachtungen: Beide Durchläufe ähneln sich in der Haltung (vorsichtig positiv, „klingt
  interessant, wenn der Preis stimmt"), unterscheiden sich im Wortlaut. Ohne Rückfall-Regel erfindet
  das Modell Details wie konkrete Preisgrenzen oder Erfahrungen mit anderen Mietangeboten.

  Methodische Probleme der Aussage „8 von 10":

  | Problem | Erklärung |
  |---|---|
  | keine unabhängige Stichprobe | zehn Personas aus einem Avatar sind Variationen desselben Musters |
  | Gefälligkeit | Modelle neigen zu Zustimmung, besonders bei positiv formulierten Fragen |
  | Absicht ist nicht Verhalten | selbst echte Befragte überschätzen ihre Nutzung; synthetische erst recht |
  | fehlende Datenbasis | der Avatar enthält nichts zu Mieten – die Antworten sind Erfindung |
  | Scheinpräzision | eine Prozentzahl suggeriert Messung, wo keine stattfand |

  Nützlich waren die Interviews für: Einwände (Hygiene, Schäden durch Kinder, Rückgabeaufwand),
  Fragen für echte Gespräche und Formulierungen für eine Landingpage.

  Echte Prüfung: fünf bis acht Gespräche mit Eltern aus dem Newsletter-Verteiler, eine kurze Umfrage
  mit Verhaltensfrage („Hast du schon einmal Kinderkleidung gemietet oder gebraucht gekauft?") und
  ein **Fake-Door-Test**: eine Landingpage mit Vormerk-Button, die echtes Interesse misst, bevor das
  Angebot existiert (transparent kommunizieren, dass es sich um eine Vormerkung handelt).
