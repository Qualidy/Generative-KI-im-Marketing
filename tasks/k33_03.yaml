title: Ein Motiv – vier Formate
difficulty: 3
question: |
  Diese Übung machst du in **Copilot** (Bilderzeugung) und in **PowerPoint** als
  Layout-Werkzeug. Alternativ für das Layout: Create, Canva, Adobe Express oder Figma.

  Das Schlüsselmotiv der Fjordlicht-Herbstkampagne soll in vier Formaten erscheinen:
  Instagram-Post 4:5, Story 9:16, Newsletter-Header ca. 3:1 und Webshop-Banner 16:9. Alle
  Formate tragen die Headline „Der Herbst kann kommen." und das Fjordlicht-Logo als Platzhalter.

  1. **Weg A:** Generiere das Motiv in Copilot mit demselben Prompt-Gerüst je Format neu.
  2. **Weg B:** Erzeuge einen Master mit großzügigem Rand und leite die vier Formate per
     Zuschnitt ab. Wo der Rand nicht reicht, lass das Bild erweitern – per Anweisung in
     Copilot oder mit Generativem Erweitern in Photoshop/Firefly, falls verfügbar.
  3. **Overlay.** Lege in PowerPoint je Format eine Datei mit passender benutzerdefinierter
     Foliengröße an, setze Bild, Headline (echtes Textfeld) und Logo-Platzhalter. Markiere bei
     9:16 die Bereiche oben und unten, in denen die Plattform Bedienelemente einblendet.
  4. **Vergleich.** Bewerte beide Wege nach Motivgleichheit, Komposition je Format, Aufwand
     und Fehlern in erweiterten Bereichen.
  5. **Empfehlung.** Formuliere eine Regel für das Team: Wann welcher Weg?
tip: |
  Schau dir bei Weg B die erweiterten Ränder in voller Auflösung an. Erweiterungen erzeugen dort
  gern Wiederholungen, unlogische Perspektiven oder Gegenstände, die im Original nicht
  angelegt waren. Bei Erweiterung per Chat-Anweisung prüfe zusätzlich, ob sich auch das
  Motiv in der Mitte verändert hat.
solution: |
  Beispiel für die Erweiterung per Anweisung:

  ```text
  Erweitere dieses Bild zu einem breiten Querformat 16:9. Ergänze links und
  rechts passende Landschaft im selben Licht und Stil. Person, Weg und
  Bildmitte bleiben exakt gleich. Kein Text, keine Logos.
  ```

  Typischer Vergleich:

  | Kriterium | Weg A: je Format neu | Weg B: Master erweitern |
  |---|---|---|
  | Motivgleichheit | gering – Figur, Ort, Licht weichen ab | hoch, solange die Mitte nicht neu erzeugt wird |
  | Komposition je Format | gut, jedes Format eigens angelegt | Kompromiss, vor allem 3:1 und 9:16 |
  | Aufwand | mehr Generierungen, mehr Auswahl | weniger Generierung, mehr Prüfung |
  | Fehlerquellen | Inkonsistenz zwischen Formaten | Artefakte in erweiterten Rändern; in Copilot teils veränderte Bildmitte |

  Eine begründete Teamregel könnte lauten:

  ```text
  Für Kampagnen mit wiedererkennbarem Schlüsselmotiv: Weg B. Master mit
  Motiv in der Mitte und mindestens 25 Prozent Rand anlegen, Ränder
  nach Erweiterung in voller Auflösung prüfen; wenn die Bildmitte exakt
  gleich bleiben muss, in Photoshop erweitern statt per Chat.
  Für lose Serien ohne festes Motiv (z. B. Pinterest-Inspiration): Weg A
  mit festem Prompt-Gerüst.
  Text und Logo immer im Layout (PowerPoint-Vorlage je Format), nie im Bildprompt.
  ```

  Bewertungskriterien: beide Wege tatsächlich umgesetzt, Vergleich mit mindestens vier
  Kriterien, mindestens ein konkret benannter Fehler aus Erweiterung oder Neugenerierung,
  Headline in allen Formaten lesbar und außerhalb der Story-Bedienbereiche platziert,
  Empfehlung als anwendbare Regel formuliert.
