title: Welche Kennzahl misst welchen Text? – ein Prompt-Duell
difficulty: 1
question: |
  **Gruppe:** 4 Personen in zwei Paaren (bei 3 Personen: ein Paar und eine Einzelperson) ·
  **Dauer:** etwa 20 Minuten · **Format:** Prompt-Duell · **Am Ende liegt vor:** eine
  gemeinsame Zuordnungstabelle in einer geteilten **Copilot Page**.

  Das Fjordlicht-Team möchte wissen, ob seine Texte funktionieren. Zu jeder Frage gehört eine
  **passende Hauptkennzahl** (Abschnitt 20.2):

  1. Funktionieren unsere neuen Newsletter-Betreffzeilen besser als die alten?
  2. Bringt der neue Aufbau des Newsletters (Kurzintro, drei Kacheln, ein Button) mehr Besuche
     im Shop?
  3. Werden unsere Blogartikel in den „Draußen-Notizen" tatsächlich gelesen?
  4. Überzeugt der überarbeitete Produkttext der Regenjacke „Sølv"?
  5. Sind unsere Instagram-Reels nützlich genug, dass Leute sie aufheben?

  Zur Auswahl: Öffnungsrate · Klickrate · Engagement-Zeit (GA4) · Conversion-Rate der
  Produktseite · Saves · Likes · Seitenaufrufe

  So geht ihr vor:

  1. **Allein (3 Minuten):** Jede Person ordnet für sich zu.
  2. **Duell in Copilot Chat:**
     - **Paar A** stellt die Fragen und die Auswahlliste mit dem schlichten Auftrag „Ordne jeder
       Frage die passende Kennzahl zu."
     - **Paar B** bittet um eine Tabelle „Frage | Hauptkennzahl | Begründung | Vorsicht bei der
       Deutung".
  3. **Vergleich:** Legt beide Antworten nebeneinander. Achtet darauf: Wählt eine der Antworten
     bei Frage 2 die Öffnungsrate? Nennt eine von beiden die Einschränkung der Öffnungsrate durch
     Apple Mail Privacy Protection? Fragt bei Abweichungen nach: „Welches Textelement
     beeinflusst diese Kennzahl, und was beeinflusst sie außer dem Text?"
  4. **Gemeinsame Page:** Paar B übernimmt seine Copilot-Antwort in eine **Copilot Page** und
     teilt sie mit der Gruppe. Alle bearbeiten die Page gemeinsam, bis dort eure
     Gruppenentscheidung steht – inklusive einer Zeile „Was der bessere Prompt anders gemacht
     hat".
tip: |
  Fragt euch jeweils: Welches Textelement wird verändert – und welche Kennzahl reagiert **nur**
  oder **vor allem** auf dieses Element? Zwei der Kennzahlen in der Liste sind
  Eitelkeitskennzahlen. Die Spalte „Vorsicht" im Prompt von Paar B fordert Copilot ausdrücklich
  auf, auch die Grenzen jeder Kennzahl zu nennen – ob das einen Unterschied macht, zeigt euer
  Vergleich.
solution: |
  | Nr. | Hauptkennzahl | Begründung |
  |---|---|---|
  | 1 | Öffnungsrate | misst Betreff und Preheader; als Trend nutzen, weil Apple Mail Privacy Protection Öffnungen künstlich erhöht |
  | 2 | Klickrate (bzw. Klick-zu-Öffnungsrate) | misst, ob Inhalt und Aufbau zum Klick führen; die Öffnungsrate ist vom Aufbau unabhängig |
  | 3 | Engagement-Zeit in GA4 | zeigt, ob gelesen wird; Seitenaufrufe zeigen nur, dass jemand kam |
  | 4 | Conversion-Rate der Produktseite | Ziel ist der Kauf; Vorsicht, Preis, Bilder und Lieferzeit wirken mit |
  | 5 | Saves | Speichern ist das klarste Signal für Nützlichkeit; Likes sind schneller und unverbindlicher |

  Nicht gewählt: **Likes** und **Seitenaufrufe** sind Eitelkeitskennzahlen. Sie zeigen
  Aufmerksamkeit, aber nicht, ob der Text seinen Zweck erreicht hat. Sie dürfen als
  Nebenkennzahl mitlaufen, sollten aber keine Textentscheidung allein begründen.

  Beispiel-Prompt für Paar B:

  ```text
  Ordne jeder der fünf Fragen genau eine Hauptkennzahl aus der Liste zu.
  Ausgabe als Tabelle: Frage | Hauptkennzahl | Begründung | Vorsicht bei
  der Deutung. Nenne am Ende, welche Kennzahlen aus der Liste du nicht
  verwendet hast und warum.
  Fragen: [1 bis 5] Liste: [Kennzahlen]
  ```

  Worauf es beim Vergleich ankommt: Fehlen in der Antwort von Paar A die Einschränkungen (z. B.
  Apple Mail Privacy Protection) oder wird bei Frage 2 zusätzlich die Öffnungsrate genannt,
  während die Antwort von Paar B die Grenzen benennt, ist der Lerneffekt sichtbar: Die richtige
  Frage im Prompt entscheidet, ob ihr eine brauchbare Einordnung bekommt.

  Bewertungskriterien:

  - Alle haben vor dem Duell eine eigene Zuordnung notiert.
  - Die Page enthält die Gruppenentscheidung für alle fünf Fragen, die beiden
    Eitelkeitskennzahlen und eine Zeile, was der bessere Prompt bewirkt hat.
  - Unterschiede zwischen den Antworten von Paar A und Paar B sind konkret benannt (welche
    Frage, welche Kennzahl, welcher Hinweis fehlte).
