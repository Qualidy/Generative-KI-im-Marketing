title: Claim-Check in der Gruppe durchführen
difficulty: 2
question: |
  **Gruppe:** 3–4 Personen, ca. 25 Minuten. **Rollen:** **Listen-Verantwortliche** (legt die
  Claim-Liste an), **Prüferin für Claims** (vergleicht die Copilot-Prüfungen mit der Liste),
  alle führen den Claim-Check aus; für die Umformulierung bilden sich zwei Untergruppen.
  **Am Ende liegt vor:** „Claim-Liste.docx" im eigenen Ordner jeder Person, eine gemeinsame
  Prüftabelle und eine freigabefähige Neufassung.

  Ihr simuliert den Prüfmodus des Content-Assistenten zunächst ohne eigenen Agent.

  1. **Claim-Liste anlegen (5 Minuten).** Die Listen-Verantwortliche legt in Word die Datei
     **„Claim-Liste.docx"** an und fügt diese (fiktive) Claim-Liste ein. **Copilot in Word** wandelt
     den Text in eine Tabelle um:

     ```text
     C-03 | Obermaterial zu 100 % aus recyceltem Polyamid | Sølv
     C-07 | Imprägnierung ohne PFAS | Sølv, Vidde
     C-11 | Kostenlose Reparatur in den ersten zwei Jahren | alle Produkte
     C-14 | Fleece zu 80 % aus recyceltem Polyester | Skog
     ```

     Sie teilt die Datei mit der Gruppe; alle speichern eine Kopie unter demselben Namen im
     eigenen OneDrive-Ordner „Fjordlicht-Kurs" – der Workshop dieses Kapitels baut darauf auf.
  2. **Gleicher Prompt, mehrere Ergebnisse (7 Minuten).** Alle öffnen einen neuen Chat in
     **Copilot Chat** (Umschalter auf **Arbeit**), fügen den Abschnitt `# Modi` (Modus 2,
     CLAIM-CHECK) und `# Ausgabeformat` aus Abschnitt 26.3 ein, verweisen mit `/Claim-Liste` auf
     die eigene Kopie und lassen diesen Text prüfen:

     ```text
     Die Vidde ist unsere grünste Hose: komplett PFAS-frei, aus recyceltem Material
     und mit lebenslanger Reparaturgarantie. So schonst du die Umwelt bei jedem Schritt.
     ```

  3. **Abgleich (5 Minuten).** Die Prüferin legt die Ergebnisse nebeneinander: Hat jede Prüfung
     alle Aussagen gefunden? Stimmen die Bewertungen? Werden die Claim-IDs genannt? Wo weichen die
     Prüfungen voneinander ab? Die Gruppe einigt sich auf eine gemeinsame Prüftabelle.
  4. **Umformulieren über Kreuz (8 Minuten).** Beide Untergruppen formulieren den Text
     freigabefähig um. Dann prüft jede Untergruppe die Fassung der **anderen** in einem **neuen**
     Chat mit demselben Prüfprompt. Die Gruppe wählt eine Fassung und stellt sie im Plenum vor.
tip: |
  Achtet besonders auf ausgeweitete Aussagen. „PFAS-frei" und „ohne PFAS imprägniert" sind
  nicht dasselbe: Das eine betrifft das ganze Produkt, das andere nur die Imprägnierung. Achtet
  auch darauf, ob Copilot wirklich eure Datei nutzt – im Modus **Arbeit** könnte es auch andere
  Dateien mit ähnlichen Inhalten heranziehen, etwa „Fjordlicht-Basisdaten.docx". Das kann
  Abweichungen zwischen euren Ergebnissen erklären.
solution: |
  | Nr. | Textstelle | Bewertung | Begründung |
  |---|---|---|---|
  | 1 | „unsere grünste Hose" | STREICHEN | Superlativ und allgemeine Umweltaussage |
  | 2 | „komplett PFAS-frei" | ANPASSEN | C-07 belegt nur die Imprägnierung |
  | 3 | „aus recyceltem Material" | STREICHEN | in der Claim-Liste kein Material-Claim für Vidde |
  | 4 | „lebenslange Reparaturgarantie" | ANPASSEN | C-11 nennt zwei Jahre |
  | 5 | „schonst du die Umwelt" | STREICHEN | allgemeine Umweltaussage |

  Gesamturteil: nicht freigabefähig. Mögliche Neufassung:

  ```text
  Die Vidde ist für lange Tage draußen gemacht. Ihre Imprägnierung kommt ohne PFAS aus,
  und geht doch mal etwas kaputt, reparieren wir sie in den ersten zwei Jahren kostenlos.
  ```

  Im Prüflauf über Kreuz sollten beide Aussagen als BELEGT mit C-07 und C-11 ausgewiesen werden.

  Die Stelle, an der Prüfungen am ehesten auseinanderlaufen können, ist Aussage 3: „recyceltes
  Material" ist für andere Produkte belegt. Wer das nicht bemerkt, hat den eigentlichen Lernpunkt
  verpasst: Das Modell prüft Ähnlichkeit, ihr prüft den **Geltungsbereich**. Die Datei
  „Claim-Liste.docx" verwendet ihr im Workshop als Wissen für euren Agent weiter.

  Bewertungskriterien: alle fünf Aussagen erkannt, Geltungsbereich von C-07 und das Fehlen eines
  Material-Claims für Vidde korrekt bewertet, Neufassung im zweiten Lauf bestätigt. Zur
  Zusammenarbeit: Abweichungen zwischen den Prüfungen der Gruppenmitglieder wurden benannt und
  erklärt (z. B. andere Datei herangezogen, Aussage 3 übersehen); jede Neufassung wurde von der
  anderen Untergruppe geprüft; jede Person hat „Claim-Liste.docx" im eigenen Ordner.
