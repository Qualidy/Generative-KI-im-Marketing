title: Bildauswahl mit Raster – und mit Copilot als Zweitmeinung
difficulty: 3
question: |
  Diese Übung machst du in der **Microsoft-365-Copilot-App** und in **Excel**.

  1. **Kandidaten erzeugen.** Erzeuge für eine Instagram-Anzeige (4:5) der Regenjacke „Sølv"
     mit der Aufgabe „Aufmerksamkeit im Herbstfeed" mindestens sechs Varianten in Copilot – gern
     verteilt auf Copilot Chat und Create (falls freigegeben) oder mit einem zweiten Werkzeug
     aus Kap. 31. Nutze `/Fjordlicht-Bildsprache` aus Kurzübung 2 (falls nicht vorhanden, den
     Baustein aus 32.2 einfügen).
  2. **Selbst bewerten.** Bewerte alle Varianten mit dem Raster aus Abschnitt 32.7 (0–2 Punkte
     je Kriterium) in einer Excel-Tabelle. Schau sie dir dafür auf dem Smartphone in
     Originalgröße an – etwa über die Copilot- oder OneDrive-App.
  3. **Copilot bewerten lassen.** Starte einen neuen Chat, lade die Varianten hoch, gib Raster
     und `/Fjordlicht-Bildsprache` mit und lass begründet bewerten.
  4. **Abgleich.** Trage Copilots Punkte als zweite Spalte in Excel ein und lass dir von
     Copilot in Excel die größten Abweichungen hervorheben. Welche Abweichungen sind berechtigte
     Hinweise, welche zeigen Grenzen der KI-Bewertung?
  5. **Entscheidung.** Wähle eine Variante und begründe die Wahl in drei Sätzen – so, dass sie
     eine Kollegin ohne die anderen Bilder nachvollziehen kann.
tip: |
  Achte darauf, ob Copilot technische Fehler wirklich findet. Bildmodelle beim Prüfen übersehen
  oft genau die Fehler, die Bildmodelle beim Erzeugen machen: sechs Finger, verdrehte
  Reißverschlüsse, unlesbare Etiketten. Und: Copilot bewertet hier Bilder, die es selbst erzeugt
  hat – ein Grund mehr, dein eigenes Urteil zuerst festzuhalten.
solution: |
  Ein brauchbarer Bewertungsprompt für Copilot Chat:

  ```text
  Du bist Art Director für Fjordlicht. Bewerte die sechs Bilder mit diesem Raster,
  je Kriterium 0 bis 2 Punkte, mit einem Satz Begründung:
  [Raster einfügen]
  Bildsprache-Guide: /Fjordlicht-Bildsprache
  Bildaufgabe: Aufmerksamkeit im Instagram-Herbstfeed, Format 4:5, Smartphone.
  Ein Bild mit 0 Punkten bei Ehrlichkeit oder technischer Sauberkeit scheidet aus.
  Gib das Ergebnis als Tabelle aus, am Ende eine Rangfolge, und nenne, was du
  nicht sicher beurteilen kannst.
  ```

  Prompt in Excel: „Füge eine Spalte mit der Differenz zwischen meiner Summe und der
  Copilot-Summe hinzu und hebe alle Zeilen mit einer Differenz von mindestens 2 hervor."

  Typische Ergebnisse des Abgleichs:

  - **Berechtigte Hinweise:** Copilot benennt oft präzise, warum die Blickführung nicht stimmt
    oder ein Bild vom Guide abweicht (Farbe zu gesättigt, Siegerpose).
  - **Grenzen:** Kleine technische Fehler werden übersehen; die Wirkung im schnellen Scrollen
    auf dem Smartphone kann die KI nicht simulieren; sie bewertet gern das ästhetischste Bild
    am höchsten.
  - **Ehrlichkeit:** Ob die gezeigte Jacke dem echten Produkt „Sølv" entspricht, kann nur
    jemand beurteilen, der das Produkt kennt – bei generierten Jacken ist das fast nie der Fall
    (Kap. 33).

  Bewertungskriterien: alle Varianten mit Raster in Excel bewertet, mindestens zwei begründete
  Abweichungen zwischen eigenem und Copilot-Urteil, Entscheidung in drei nachvollziehbaren
  Sätzen, ausdrücklicher Hinweis, dass erst ein Test mit Publikum (Kap. 16) über die Wirkung
  entscheidet.
