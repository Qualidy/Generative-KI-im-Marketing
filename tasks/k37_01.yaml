title: Welcher Musikweg passt?
difficulty: 1
question: |
  Fjordlicht braucht in den nächsten Wochen Musik für fünf Vorhaben. Ordne jedem den passenden
  **Bezugsweg** zu – Plattformbibliothek, Stock-Musik, Auftragskomposition oder KI-Musik – und
  begründe in einem Satz.

  1. Eine spontane Instagram-Story vom Teamausflug, nur 24 Stunden sichtbar.
  2. Ein neues **Sound-Logo**, das künftig am Ende jedes Videos und im Podcast läuft.
  3. Sechs Reels einer Serie zum Rucksack „Tind", die exakt 12 Sekunden lang sind und alle
     dasselbe musikalische Motiv in leicht anderer Stimmung brauchen.
  4. Ein Produktvideo zur Wanderhose „Vidde", das auf Instagram, im Webshop und im Newsletter
     laufen soll.
  5. Ein Kollege möchte einen aktuellen Charthit unter ein TikTok des Unternehmensaccounts legen,
     „weil der Song gerade trendet".
tip: |
  Frage bei jedem Fall zuerst: Wie lange und wo läuft die Musik? Je länger und je breiter der
  Einsatz, desto wichtiger ist eine eindeutige, dokumentierte Lizenz.
solution: |
  | Nr. | Bezugsweg | Begründung |
  |---|---|---|
  | 1 | Plattformbibliothek (Commercial Music Library) | kurzlebig, nur auf Instagram, direkt in der App |
  | 2 | Auftragskomposition (KI höchstens zur Ideensuche) | Markenzeichen braucht Schutzfähigkeit und vertraglich gesicherte Rechte |
  | 3 | KI-Musik im Bezahlplan, alternativ Stock | passgenaue Länge und Varianten sind die Stärke von KI; Tarif dokumentieren |
  | 4 | Stock-Musik mit kanalübergreifender Lizenz | Plattformsound gilt nur in der App, nicht im Webshop oder Newsletter |
  | 5 | nicht so umsetzbar | Charthits sind für Unternehmensaccounts meist nicht freigegeben; Alternative aus der Commercial Music Library wählen |

  Fall 5 ist der wichtigste: Dass die App einen Song anbietet, heißt nicht, dass eine Marke ihn
  nutzen darf.
