title: Zufall, Nachbessern und Beschreiben im Gruppenversuch
difficulty: 2
question: |
  **Gruppenarbeit, 3–4 Personen, ca. 25 Minuten.** Ihr arbeitet mit der Bilderzeugung in
  **Copilot Chat** (Microsoft-365-Copilot-App). Am Ende liegt ein geteiltes Word-Dokument
  „Bildversuch" im Ordner „Fjordlicht-Kurs" einer Person vor: mit allen Bildern, den
  Bildbeschreibungen und euren Notizen zu Nebenwirkungen.

  **Rollen:** Alle erzeugen Bilder. Zusätzlich gibt es eine **Prüferin** (lässt Bilder
  beschreiben und vergleicht) und eine **Protokollführerin** (führt das Word-Dokument).

  1. **Zufallstest – gleicher Prompt für alle.** Jede Person erzeugt in einer neuen
     Unterhaltung ein Bild mit diesem Prompt:

     ```text
     Erzeuge ein Foto im Querformat: Eine Person Mitte dreißig in einer
     dunkelgrünen Regenjacke steht an einem nebligen Herbstmorgen am Ufer
     eines Sees. Ruhige Stimmung, natürliches Licht, viel Himmel links im Bild.
     ```

     Postet die Bilder in den Teams-Chat der Gruppe. Haltet fest, was über alle Bilder gleich
     bleibt und was sich ändert (Person, Komposition, Farben, Licht).
  2. **Nachbessern in Arbeitsteilung.** Jede Person bittet Copilot in **ihrer** Unterhaltung um
     genau **eine** Änderung – verteilt sie so:
     - Person 1: „Mach den Himmel dunkler und bewölkt."
     - Person 2: „Die Person blickt auf den See statt in die Kamera."
     - Person 3: „Die Jacke soll dunkelblau sein, sonst bleibt alles gleich."
     - Person 4 (falls vorhanden): „Füge am Ufer ein kleines Ruderboot hinzu."

     Achtet darauf, ob nur das Gewünschte geändert wurde oder ob sich auch anderes verschoben
     hat (Gesicht, Jacke, Hintergrund, Bildaufteilung). Postet Vorher und Nachher.
  3. **Bild beschreiben lassen.** Die Prüferin lädt zwei Bilder (ein Ausgangsbild und das
     zugehörige geänderte Bild) in einer neuen Unterhaltung hoch und fragt: „Beschreibe für
     beide Bilder Licht, Perspektive, Bildausschnitt, Farbstimmung und die Details der Jacke in
     Stichworten. Nenne dann alle Unterschiede." Die Gruppe prüft: Stimmt die Beschreibung mit
     dem überein, was ihr seht? Was hat Copilot übersehen?
  4. **Zusammenführen.** Die Protokollführerin trägt alles ins Word-Dokument ein; die anderen
     ergänzen ihre Notizen direkt im geteilten Dokument.

  **Abschluss:** Einigt euch auf eine Regel für die Arbeit mit Bild-KI, die ihr aus dem
  Versuch ableitet, und stellt sie im Plenum vor.
tip: |
  Achtet in Schritt 2 besonders auf die Jacke. Genau dort zeigt sich, warum echte Produkte
  nicht zuverlässig über mehrere Bearbeitungsschritte stabil bleiben. Weil alle mit demselben
  Ausgangsprompt starten, seht ihr in Schritt 1 den reinen Zufall – und könnt in Schritt 2
  besser unterscheiden, was die Änderung bewirkt hat und was Zufall ist. Die Bildbeschreibung
  aus Schritt 3 hilft, Unterschiede in Worte zu fassen, die man sonst nur „irgendwie" sieht.
solution: |
  Mögliche Beobachtungen – achtet darauf, welche bei euch auftreten:

  | Schritt | Beobachtung |
  |---|---|
  | Zufallstest | Grundidee bleibt (Person, See, Nebel), aber Gesicht, Jackenschnitt, Bildaufteilung und Farbtöne variieren deutlich zwischen den Gruppenmitgliedern. |
  | Himmel dunkler | gelingt sauber, oder das ganze Bild wird dunkler und kühler. |
  | Blickrichtung | Pose ändert sich, dabei auch Gesicht oder Haltung – die Person wirkt wie eine andere. |
  | Jackenfarbe | Farbe wechselt, dabei ändern sich Kragen, Taschen oder Reißverschluss mit. |
  | Ruderboot | Boot erscheint, Komposition verschiebt sich, Himmel links wird kleiner. |
  | Bildbeschreibung | nennt z. B. „Stehkragen, zwei Brusttaschen" beim einen und „Kapuze, Seitentaschen" beim anderen Bild – oder übersieht genau diesen Unterschied. |

  Lehren daraus:

  - Jede neue Unterhaltung ist ein neuer Zufallsstart. Wer Serien braucht, muss mit Referenzen
    arbeiten (Kap. 33).
  - Nachbessern im Gespräch ist bequem, aber nicht verlustfrei: Mit jeder Runde kann sich
    Ungewolltes verschieben. Ändere deshalb **eine Sache pro Schritt** und vergleiche.
  - Kleidungsdetails (Kragen, Reißverschluss, Taschen) wandern. Für Produktdarstellungen ist das
    ein Ausschlusskriterium.
  - Die Bildbeschreibung im Chat ist ein nützliches Prüfwerkzeug – aber auch sie kann Details
    übersehen. Der letzte Blick bleibt eurer.

  Bewertungskriterien: Zufallstest mit den Bildern aller Gruppenmitglieder durchgeführt und
  Unterschiede konkret benannt; jede Änderung mit Vorher/Nachher und einer Notiz zu
  unerwünschten Nebenwirkungen dokumentiert; Zufall und gewollte Änderung auseinandergehalten;
  Copilot-Bildbeschreibung mit dem eigenen Eindruck abgeglichen; gemeinsame Regel formuliert.
