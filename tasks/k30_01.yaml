title: Bausteine eines Bildprompts erkennen – Prompt-Duell zu zweit
difficulty: 1
question: |
  **Paararbeit (oder Dreiergruppe), ca. 15 Minuten.** Untersucht gemeinsam den folgenden
  Bildprompt für einen Instagram-Post von Fjordlicht. Am Ende liegt ein gemeinsam verbesserter
  Prompt vor, den ihr im Plenum mit Vorher/Nachher-Bild zeigen könnt.

  ```text
  Foto von einer Familie mit zwei Kindern beim Picknick im Wald, Herbst,
  goldene Stunde, Gegenlicht, gedeckte warme Farben, keine Handys,
  ultra-detailed, masterpiece, 8K
  ```

  1. **Ausprobieren.** Beide erzeugen mit genau diesem Prompt ein Bild in Copilot Chat.
     Legt die Bilder nebeneinander und notiert in einem Satz, was euch an beiden auffällt
     (Format, Bildaufbau, Look).
  2. **Analysieren.** Klärt gemeinsam: Welche der acht Bausteine (Motiv, Umgebung, Stil, Licht,
     Komposition, Kamera, Farbstimmung, Format) sind enthalten, welche fehlen? Welche Angaben
     sind **Füllwörter**, die kaum etwas beitragen?
  3. **Duell.** Jede Person überarbeitet den Prompt für sich: Füllwörter streichen, „keine
     Handys" positiv umformulieren und die **zwei** fehlenden Bausteine ergänzen, die sie für
     einen Instagram-Post für am wichtigsten hält. Erzeugt beide Fassungen jeweils in einer
     **neuen** Unterhaltung.
  4. **Vergleichen und entscheiden.** Welche Fassung hat mehr verändert? Habt ihr dieselben
     Bausteine gewählt? Einigt euch auf einen gemeinsamen Prompt. Achtet darauf, ob Copilot ein
     im Prompt verlangtes Format umsetzt.
tip: |
  Überlegt bei Schritt 3, was ein Instagram-Post technisch zwingend braucht und was bei einem
  Familienbild am häufigsten „irgendwie falsch" wirkt. Ein Blick auf die beiden ersten Bilder
  aus Schritt 1 verrät es euch meist – und wenn beide Bilder denselben Fehler zeigen, liegt er
  am Prompt, nicht am Zufall.
solution: |
  Mögliche Beobachtung in Schritt 1 – achtet darauf, ob sie bei euch zutrifft: Beide Bilder
  sind nicht hochformatig, die Familie sitzt mittig und frontal, alle lächeln in die Kamera,
  der Look ist glatt und sehr gesättigt – ein Werbefamilien-Bild. Die Details unterscheiden
  sich, das Grundproblem ist auf beiden Bildern gleich.

  | Baustein | enthalten? | Fundstelle |
  |---|---|---|
  | Motiv | ja | Familie mit zwei Kindern beim Picknick |
  | Umgebung | ja | Wald, Herbst |
  | Stil | teilweise | „Foto" – ohne Anmutung (dokumentarisch? inszeniert?) |
  | Licht | ja | goldene Stunde, Gegenlicht |
  | Komposition | nein | – |
  | Kamera | nein | – |
  | Farbstimmung | ja | gedeckte warme Farben |
  | Format | nein | – |

  Füllwörter: „ultra-detailed, masterpiece, 8K" – sie bringen bei aktuellen Modellen wenig und
  schieben das Bild eher in einen überglatten Hochglanz-Look.

  Positive Umformulierung: „Die Familie ist ins Gespräch vertieft, die Hände halten Becher und
  Brot" – so ist klar, was stattdessen zu sehen ist.

  Wichtigste Ergänzungen:

  ```text
  Format: Hochformat 4:5 für Instagram.
  Komposition: Familie im unteren Bilddrittel, aus leichter Distanz,
  ungestellt, nicht in die Kamera blickend.
  ```

  Das Format ist zwingend für den Kanal, die Komposition verhindert das typische frontale
  „Werbefamilien"-Bild. Hat eine Person „Kamera" statt „Komposition" gewählt, ist das
  vertretbar – im Vergleich zeigt sich meist, dass die Komposition mehr verändert. Wird das
  Hochformat nicht exakt umgesetzt, sichert ihr das Format später beim Zuschnitt; der Prompt
  bleibt trotzdem richtig.

  Bewertungskriterien: fehlende Bausteine und Füllwörter korrekt erkannt; positive
  Umformulierung beschreibt, was zu sehen sein soll; beide Fassungen erzeugt und verglichen;
  Unterschiede zwischen den beiden überarbeiteten Prompts benannt und begründet; gemeinsamer
  Prompt enthält Format und Komposition.
