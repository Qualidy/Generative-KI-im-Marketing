title: Quartalsplanung mit Content-Pillars
difficulty: 4
question: |
  **Szenario:** Das Fjordlicht-Marketingteam plant das erste Quartal 2027. Bisher entstanden
  Inhalte spontan: viel Inspiration, wenig zu Pflege und Reparatur, kaum etwas für Fjordlicht
  Business. Die Teamleitung möchte eine Planung, die auf Content-Pillars beruht, mit realistischer
  Kapazität arbeitet und aus jedem großen Inhalt mehrere Ableitungen macht. Du kannst statt
  Fjordlicht auch **ein Unternehmen deiner Wahl** nutzen.

  ```text
  Rahmen:
  Zeitraum: Januar bis März 2027.
  Kapazität pro Monat: 2 Blogbeiträge, 2 Newsletter, 12 Instagram-Posts,
  4 TikTok-Clips, 4 LinkedIn-Posts, 6 Pinterest-Pins.
  Feste Termine: Launch Wanderhose Vidde (Frühjahrskollektion) Mitte März.
  Keine Rabattaktionen, keine unbelegten Nachhaltigkeitsaussagen.
  Werkzeug frei wählbar.
  ```

  ---

  **Runde 1 – Ideen erzeugen.** Erzeuge mit mindestens **zwei** Kreativtechniken aus Abschnitt
  12.2 insgesamt mindestens 30 Ideen. Nutze für die Prompts das P.R.O.M.P.T.-Framework (Kap. 5)
  und schließe die naheliegendsten Ideen ausdrücklich aus.

  **Runde 2 – Pillars und Auswahl.** Lege vier bis fünf Content-Pillars mit Zielanteilen fest.
  Lass die Ideen zuordnen und nach einem gewichteten Bewertungsraster vorbewerten. Wähle danach
  selbst die Ideen für das Quartal aus. Prüfe gegen diese Pflichtkriterien:

  1. Jeder Pillar ist im Quartal vertreten, die Anteile weichen höchstens um 10 Prozentpunkte vom
     Ziel ab.
  2. Mindestens drei Kerninhalte haben einen Recycling-Plan mit mindestens drei Ableitungen.
  3. Jeder saisonale Anlass ist mit einer Quelle geprüft.
  4. Die Kapazität wird in keinem Monat überschritten.

  **Runde 3 – Die Komplikation.** Mitte Februar fällt eine von fünf Personen für sechs Wochen
  aus. Gleichzeitig verschiebt sich der Launch der Vidde um zwei Wochen nach hinten. Passe den
  Kalender an. Lass dir von der KI einen Anpassungsvorschlag machen, prüfe ihn aber gegen die
  Pflichtkriterien und entscheide selbst, was entfällt.

  **Runde 4 – Entscheidung unter Abwägung.** Die KI schlägt vor, die Lücke durch mehr
  KI-generierte Kurzposts zu füllen, „damit die Frequenz gleich bleibt". **Widersprich** diesem
  Vorschlag oder stimme ihm begründet zu: Was spricht für gleichbleibende Frequenz, was für
  weniger, aber bessere Inhalte? Berücksichtige Markenstimme, Freigabeaufwand und Glaubwürdigkeit.

  **Deliverable:**

  1. Ideenliste mit Angabe der verwendeten Kreativtechniken
  2. Pillar-Übersicht mit Zielanteilen und tatsächlichen Anteilen
  3. Redaktionskalender Januar bis März (Tabelle mit Datum, Kanal, Pillar, Arbeitstitel, Anlass,
     Verantwortlich, Status)
  4. drei Recycling-Pläne
  5. angepasster Kalender nach Runde 3 mit Liste der gestrichenen Inhalte
  6. begründete Entscheidung zu Runde 4

  **Fertig bist du erst, wenn** alle vier Pflichtkriterien auch nach der Anpassung aus Runde 3
  erfüllt sind, kein ungeprüfter Anlass im Kalender steht und deine Entscheidung aus Runde 4 mindestens
  ein Argument für und eines gegen die Frequenz-Lösung abwägt.
tip: |
  Der Lernkern liegt in Runde 2 und 3. Ideen gibt es mit KI im Überfluss; die Arbeit liegt im
  Auswählen und Weglassen. Ein Kalender, der bei einem Ausfall zusammenbricht, war von Anfang an zu
  voll. Achte in Runde 4 darauf, dass „mehr Output" nicht automatisch „mehr Wirkung" bedeutet.
solution: |
  Bewertungskriterien: (1) mindestens zwei Kreativtechniken sichtbar eingesetzt, Prompts mit
  vollständigen P.R.O.M.P.T.-Bausteinen und Ausschluss naheliegender Ideen; (2) Pillars mit
  Zielanteilen, Auswahl begründet und nicht einfach die KI-Rangfolge übernommen; (3) Kalender
  vollständig, Kapazität eingehalten, alle Anlässe mit Quelle geprüft; (4) Recycling-Pläne
  übersetzen kanalgerecht statt zu kopieren; (5) Anpassung in Runde 3 streicht nachvollziehbar
  (z. B. TikTok-Clips zuerst, weil aufwendig in Produktion und Freigabe) und hält die
  Pflichtkriterien weiter ein; (6) die Abwägung in Runde 4 nennt konkrete Risiken der
  Frequenz-Lösung (generische Inhalte, Freigabeengpass, Markenstimme) und mögliche Vorteile
  (Sichtbarkeit im Algorithmus) und trifft eine klare Entscheidung.

  Lernziel: KI als Ideen- und Planungswerkzeug nutzen, die strategische Auswahl und die Anpassung
  an reale Ressourcen aber selbst verantworten.
