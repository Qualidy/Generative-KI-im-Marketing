title: Konzeption eines Marketingassistenten
difficulty: 4
question: |
  **Szenario:** Du sollst für das Fjordlicht-Marketingteam (oder ein Unternehmen deiner Wahl)
  einen KI-Assistenten konzipieren, der in Kap. 25 als Copilot Agent tatsächlich gebaut und
  getestet wird. Heute entsteht noch kein Agent – heute entstehen der **Assistenten-Steckbrief**
  als Word-Datei und die aufbereiteten Wissensdateien, nach denen später jede Person den Assistenten
  in jedem Werkzeug nachbauen könnte. Copilot hilft dir dabei in Chat, Word und Excel.

  ```text
  Rahmen:
  Use Case nach Wahl, z. B. Produkttexte Webshop, Newsletter-Intros,
  LinkedIn-Posts für Fjordlicht Business, Pinterest-Pinbeschreibungen.
  Nicht wählen: den Content-Assistenten (Kap. 26) oder den
  CRM-Chatbot (Kap. 27) - die werden gesondert behandelt.
  Ablage: OneDrive-Ordner "Fjordlicht-Kurs", Unterordner "Wissen-[Use Case]".
  Material: /Fjordlicht-Basisdaten bzw. Fjordlicht-Angaben aus dem Kurs
  oder eigene, fiktive Unterlagen.
  Keine echten Kundendaten, keine vertraulichen Firmeninformationen.
  ```

  ---

  **Runde 1 – Use Case und Grenzen.** Nutze in **Copilot Chat** den Rückfragen-Prompt aus
  Abschnitt 24.1 und beantworte die Fragen nacheinander. Übernimm den Zweck-Satz, den Copilot
  vorschlägt, nicht ungeprüft: Er muss wer, wofür, mit welcher Eingabe und welches Ergebnis
  enthalten. Lege in Word **„Assistenten-Steckbrief_[Use Case].docx"** an, mit allen Feldern aus
  Abschnitt 24.6 als Überschriften. Trag Zweck-Satz und die Tabelle „Darf / Darf nicht / Fragt nach
  bzw. markiert" (mindestens vier Zeilen) ein.

  **Runde 2 – Instruktionen und Wissen.** Schreibe die Instruktionen vollständig nach der Struktur
  aus Abschnitt 24.3 in den Steckbrief, inklusive einer ausdrücklichen Prioritätenregel. Lege im
  Unterordner mindestens **drei** Wissensdateien als Word-Dateien mit Überschriftenformaten an,
  darunter eine mit gekennzeichneten Beispielen („Gutes Beispiel" / „So nicht – Grund"). Formuliere
  drei bis vier Konversationsstarter – im Agent Builder heißen sie später Startprompts. Prüfe jede
  Wissensdatei mit einer Frage in Copilot Chat (Datei per `/` einbinden): Findet Copilot die Regel,
  die du suchst?

  **Runde 3 – Die Komplikation (Copilot in Excel).** Die Produktmanagerin schickt dir die
  Produktdaten: eine Excel-Datei mit fünf Tabellenblättern, verbundenen Zellen, Farbmarkierungen
  statt Text („grün = recyceltes Material") und zwei Artikeln, deren Gewicht in Blatt 1 und Blatt 4
  unterschiedlich angegeben ist. Bereite die Daten auf: ein Tabellenblatt, als Tabelle formatiert,
  sprechende Spaltennamen, Text statt Farben. Lass dir von **Copilot in Excel** helfen – etwa eine
  Spalte „Material recycelt (ja/nein)" vorschlagen oder abweichende Werte hervorheben. Lege fest,
  wie der Assistent mit dem Widerspruch umgehen soll, und entwirf mit **Copilot in Outlook** die
  Rückfrage an die Produktmanagerin.

  **Runde 4 – Entscheidung unter Abwägung.** Eine Kollegin schlägt vor, den Export der
  Newsletter-Abonnenten mit Vornamen und letzten Käufen in den Wissensordner zu legen – dann
  könne der Agent „persönlicher" schreiben, und Copilot achte ja ohnehin auf Berechtigungen. Lass
  dir von Copilot Argumente dafür nennen. **Widersprich** begründet: Nenne mindestens drei Gründe
  (rechtlich, technisch, fachlich) und einen alternativen Weg, Personalisierung umzusetzen (Kap. 13).

  **Deliverable:**

  1. Steckbrief in Word mit Zweck-Satz und Tabelle „Darf / Darf nicht / Fragt nach"
  2. vollständige Instruktionen mit Prioritätenregel im Steckbrief
  3. mindestens drei aufbereitete Wissensdateien im Unterordner plus Konversationsstarter
  4. aufbereitete Produktdaten (Excel, ein Blatt) mit Widerspruchsregel und Rückfrage-Mail
  5. Stellungnahme zu Runde 4
  6. vollständiger Steckbrief mit allen Feldern aus Abschnitt 24.6, inklusive zehn Testfällen in
     Stichworten

  **Fertig bist du erst, wenn** eine fremde Person allein mit deinem Steckbrief und dem
  Wissensordner den Assistenten im Agent Builder oder einem beliebigen anderen Werkzeug einrichten
  könnte, keine Wissensdatei personenbezogene oder widersprüchliche Angaben enthält und jede Regel
  in den Instruktionen eindeutig prüfbar ist.
tip: |
  Der Lernkern liegt in Runde 3: Wissen ist erst dann Wissen, wenn der Assistent es finden und
  eindeutig lesen kann. Farben, verbundene Zellen und Widersprüche sind für Menschen lesbar, für
  einen Assistenten nicht – und auch Copilot in Excel arbeitet zuverlässiger mit einer sauber
  formatierten Tabelle. Achtung: Copilot neigt dazu, den Gewichts-Widerspruch „aufzulösen", etwa
  durch einen Mittelwert. Einen Widerspruch löst nicht die KI, sondern die zuständige Person. In
  Runde 4 gilt: Personalisierung gehört in das Versandsystem mit Platzhaltern, nicht in einen
  Wissensordner, aus dem alle Nutzenden des Agents Inhalte abrufen können.
solution: |
  Bewertungskriterien: (1) Zweck in einem Satz mit allen vier Bestandteilen, Grenzen-Tabelle mit
  Rückfrage- und Markierungsregeln, Copilot-Vorschlag erkennbar geprüft; (2) Instruktionen folgen
  der Struktur, enthalten eine Prioritätenregel und kein kopiertes Faktenwissen; (3) Wissensdateien
  sind thematisch getrennt, datiert, sprechend benannt, mit Überschriftenformaten, Beispiele
  gekennzeichnet, Auffindbarkeit getestet; (4) Produktdaten als ein Tabellenblatt mit Text statt
  Farben, Widerspruch nicht stillschweigend aufgelöst, sondern als Rückfrage an die
  Produktmanagerin und als Regel „Widerspruch nennen" im Assistenten; (5) Stellungnahme nennt
  z. B. DSGVO (Zweckbindung, Datenminimierung), Abrufbarkeit von Wissensinhalten durch alle
  Nutzenden mit Zugriff, fehlenden Nutzen für einen Entwurfsassistenten, und verweist auf
  Platzhalter im Newsletter-Tool; (6) Steckbrief vollständig und werkzeugunabhängig.

  Beispiel für die Rückfrage an die Produktmanagerin:

  ```text
  Schreib eine kurze, freundliche E-Mail an unsere Produktmanagerin.
  Anliegen: In der Produktdaten-Datei stehen für zwei Artikel unterschiedliche
  Gewichte (Blatt 1 und Blatt 4): [Artikel, Werte]. Bitte um Klärung, welcher
  Wert gilt, und um künftige Pflege in einem einzigen Tabellenblatt.
  Ton: sachlich, ohne Vorwurf. Maximal 80 Wörter.
  ```

  Lernziel: Einen Assistenten so konzipieren, dass er übertragbar, prüfbar und datenschutzgerecht
  ist – und Konzeption als eigene Arbeitsphase vor der technischen Umsetzung begreifen.
