title: Die Migration bewerten
difficulty: 3
question: |
  Das Fjordlicht-Team nutzt seit einem Jahr den Custom GPT „Produkttext-Helfer". Er hat:

  ```text
  - ausführliche Instruktionen (Rolle, Ablauf, Regeln, Ausgabeformat)
  - 4 Wissensdateien: Styleguide.pdf, Produktdaten_2025.xlsx,
    Claim-Liste.docx, Beispieltexte.docx
  - eine Custom Action, die Lagerbestände aus dem Shopsystem abruft
  - Konversationsstarter
  - Freigabe: im gesamten Arbeitsbereich sichtbar
  - eingestelltes Modell: ein schnelles Standardmodell
  - viele gespeicherte Gespräche mit gelungenen Formulierungen
  ```

  Die Teamleitung fragt: „Wir klicken einfach auf ‚Migrate to plugin', dann läuft alles weiter wie
  bisher, oder?" Gleichzeitig steht die Frage im Raum, ob der Assistent nicht gleich als
  **Copilot Agent** neu entstehen soll – Microsoft 365 Copilot haben alle im Team.

  1. Lass dir in **Copilot Chat** eine erste Fassung der Tabelle erstellen: Füge die Liste oben und
     die Migrationstabelle aus Abschnitt 23.4 ein und bitte um die Spalten „Bestandteil – wird ins
     Plugin übertragen ja/nein – was ist zu tun". Prüfe jede Zeile gegen Abschnitt 23.4 und
     korrigiere, wo Copilot rät.
  2. Ergänze eine Spalte **„bei Neubau als Copilot Agent"**: Wohin wandert jeder Bestandteil im
     Agent Builder, und was fehlt dort?
  3. Nenne zwei Dinge, die bei dieser Gelegenheit **ohnehin** überarbeitet werden sollten,
     unabhängig vom Format.
  4. Entwirf die Antwort an die Teamleitung mit **Copilot in Outlook** (maximal 120 Wörter). Lass
     dir vom Coaching für Entwürfe Rückmeldung zu Ton und Klarheit geben und entscheide selbst,
     welche Hinweise du übernimmst.
tip: |
  Halte dich an die Fakten aus Abschnitt 23.4 – Copilot kennt die Plugin-Umstellung womöglich
  nicht oder nur ungenau. Schau genau auf die Dateinamen: Eine Migration ist ein guter Anlass für
  einen Frühjahrsputz. Beim Copilot Agent hilft der Gedanke aus Abschnitt 23.6: Die vier Bausteine
  sind dieselben, nur die Felder heißen anders.
solution: |
  | Bestandteil | ins Plugin? | Zu tun | bei Neubau als Copilot Agent |
  |---|---|---|---|
  | Instruktionen | ja, als Skill | gegenlesen, ob alles korrekt übernommen ist | Anweisungen, aus dem Steckbrief kopieren |
  | Wissensdateien | ja, als Referenzdateien | auf Aktualität prüfen | Dateien in OneDrive/SharePoint als Wissensquelle; Nutzende brauchen Zugriff darauf |
  | Custom Action Lagerbestand | nein | Bedarf klären, ggf. Neubau als App bzw. MCP-Server | nicht im Agent Builder; ggf. Copilot Studio mit IT |
  | Konversationsstarter | nicht sicher | im Plugin prüfen, sonst Kurzanleitung | Startprompts |
  | Freigabe Arbeitsbereich | nein, Plugin startet privat | Freigabe bewusst neu setzen | Agent gezielt teilen, falls freigegeben |
  | Modell | nein | im Plugin prüfen und testen | Modellwahl je nach Umgebung eingeschränkt; Verhalten testen |
  | Gesprächsverläufe | nein | gelungene Formulierungen vorher sichern, als Beispieltexte aufnehmen | ebenso – nichts wird übernommen |

  Typische Copilot-Fehler in Schritt 1: „Modell wird übernommen" oder „Freigabe bleibt erhalten" –
  beides falsch laut Abschnitt 23.4.

  Ohnehin überarbeiten: (1) **Produktdaten_2025.xlsx** ist veraltet – neue Kollektion fehlt.
  (2) **Styleguide.pdf** als gegliederte Word-Datei neu anlegen (Kap. 24). (3) Die Instruktionen
  werkzeugunabhängig in einem Assistenten-Steckbrief (Word, Ordner „Fjordlicht-Kurs") ablegen,
  damit die nächste Umstellung einfacher wird. Sinnvoll auch: Testfälle definieren und vor und
  nach dem Umzug laufen lassen (Kap. 25).

  Antwort an die Teamleitung:

  „Nicht ganz. Instruktionen und Wissensdateien werden übernommen, aber die Lagerbestand-Abfrage,
  das eingestellte Modell, die Freigabe und alle bisherigen Gespräche nicht. Das Plugin ist nach
  der Migration nur für die Erstellerin sichtbar. Ich schlage vor: gute Formulierungen sichern,
  Produktdaten aktualisieren, Instruktionen in einen Steckbrief übernehmen. Danach können wir
  entscheiden, ob wir als Plugin oder als Copilot Agent weitermachen – der Aufwand ist ähnlich,
  der Copilot Agent liegt bei unseren übrigen Daten. Die Lagerabfrage klären wir separat. Aufwand:
  etwa einen halben Tag."

  Bewertungskriterien: Fakten korrekt, Copilot-Fehler in der Tabelle erkannt, keine Annahme
  „läuft weiter wie bisher", Agent-Spalte benennt die Lücke bei der Custom Action und die
  Dateiberechtigungen, Migration als Anlass zur Qualitätsprüfung genutzt.
