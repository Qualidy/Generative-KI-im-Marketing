title: Was gehört wohin beim Content-Assistenten? – Vergleich in der Gruppe
difficulty: 1
question: |
  **Gruppe:** Paare oder Dreiergruppen, ca. 15 Minuten. **Rollen:** alle führen denselben Prompt
  aus; eine Person führt die gemeinsame Tabelle in einem geteilten Word-Dokument. **Am Ende liegt
  vor:** eine gemeinsame Zuordnung mit Ort im Agent Builder bzw. im Steckbrief und eine Antwort auf
  Frage 3.

  Der Content-Assistent aus Kap. 26 soll bei Fjordlicht als **Copilot Agent** nachgebaut werden.
  Folgende Inhalte liegen vor:

  1. „Die Skog besteht zu 80 % aus recyceltem Polyester (Materialzertifikat 2025)."
  2. „Wenn eine Angabe nicht in den Dateien steht, schreibe [FEHLT: was fehlt]."
  3. „Claim-Check: Prüfe diesen Text"
  4. Websuche ausgeschaltet
  5. Liste aller Produktnamen mit Materialien und Farben
  6. „Keine Superlative, keine Ausrufezeichen-Ketten."
  7. Drei freigegebene Newsletter als Stilvorbild

  1. **Gleicher Prompt, mehrere Ergebnisse (5 Minuten).** Alle lassen in **Copilot Chat** jeden
     Inhalt einem Baustein zuordnen – **Instruktionen**, **Wissensdatei**, **Fähigkeit/Werkzeug**
     oder **Konversationsstarter** – mit Begründung in einem Halbsatz.
  2. **Vergleichen und entscheiden (7 Minuten).** Legt die Ergebnisse nebeneinander: Wo weichen
     eure Copilot-Antworten voneinander ab? Einigt euch auf eine Zuordnung und ergänzt, wo jeder
     Inhalt beim Nachbau landet: Anweisungen, Wissen aus einer Datei in OneDrive/SharePoint,
     Startprompt – oder als Werkzeug-Entscheidung im Steckbrief.
  3. **Gemeinsame Antwort (3 Minuten).** Welche dieser Inhalte müsstet ihr ändern, wenn Fjordlicht
     ein neues Produkt einführt – und an welcher Stelle passiert das in Microsoft 365?
tip: |
  Faustregel: **Regeln und Verhalten** gehören in die Instruktionen, **Fakten und Beispiele**
  in Wissensdateien. Was sich häufig ändert, sollte nicht in den Instruktionen stehen. Achtet
  besonders auf Nr. 1: Landet die Zertifikatsangabe bei jemandem in den Instruktionen („wichtige
  Regel")? Bei Frage 3 hilft der Gedanke: Eine Wissensdatei in OneDrive könnt ihr bearbeiten, ohne
  die Anweisungen des Agents anzufassen.
solution: |
  | Nr. | Baustein | Begründung | beim Nachbau |
  |---|---|---|---|
  | 1 | Wissensdatei (Claim-Liste) | belegte Faktenaussage mit Quelle | Wissen: `Claim-Liste.docx` |
  | 2 | Instruktionen | Verhaltensregel für alle Modi | Anweisungen |
  | 3 | Konversationsstarter | Einstieg in einen Modus per Klick | Startprompt |
  | 4 | Fähigkeit/Werkzeug | verhindert Übernahme fremder Behauptungen | Werkzeug-Entscheidung, im Steckbrief begründet |
  | 5 | Wissensdatei (Produktdaten) | Stammdaten, ändern sich regelmäßig | Wissen: `Produktdaten.xlsx` (ein Tabellenblatt) |
  | 6 | Instruktionen | Teil der Markenstimme | Anweisungen |
  | 7 | Wissensdatei (Beispieltexte) | Stilvorbilder, Few-Shot-Material | Wissen: `Beispieltexte.docx` |

  Landet Nr. 1 in den Instruktionen, wäre jede Zertifikatsänderung eine Änderung am Agent – ein
  guter Anlass, die Abweichung in der Gruppe zu besprechen.

  Bei einem neuen Produkt ändern sich nur **Wissensdateien**: Produktdaten, eventuell die
  Claim-Liste (neue belegte Aussagen) und später die Beispieltexte. In Microsoft 365 bearbeitet ihr
  dafür die Dateien im Ordner; die Anweisungen bleiben unverändert. Prüft nach der Änderung mit
  einem Testfall, ob der Agent den neuen Stand tatsächlich nutzt. Einzige Ausnahme in den
  Instruktionen ist die Zeile mit den exakten Produktnamen – ein Hinweis, dass man sie besser
  ebenfalls in die Produktdatei verlagert. Genau das ist der Vorteil der Trennung: Das Verhalten
  bleibt stabil, die Fakten werden gepflegt. Nach jeder Änderung an einer Wissensdatei läuft
  trotzdem der Testkatalog (Kap. 25).

  Bewertungskriterien: alle sieben Inhalte begründet zugeordnet; Abweichungen zwischen den
  Copilot-Ergebnissen der Gruppenmitglieder benannt und gemeinsam entschieden; Frage 3 nennt die
  betroffenen Dateien und den Testlauf nach der Änderung.
