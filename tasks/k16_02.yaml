title: Landingpage-Test mit der Datenanalyse auswerten
difficulty: 2
question: |
  Diese Übung machst du direkt im KI-Werkzeug mit Datenanalyse-Funktion (ChatGPT, alternativ
  Claude oder Gemini). Fjordlicht hat auf der Landingpage für den Pflege-Kalender zwei
  Button-Texte getestet. Die Testdauer (14 Tage) war vorher festgelegt. Fiktive Daten:

  ```text
  Variante;Button;Besuche;Anmeldungen
  A;Jetzt anmelden;3200;224
  B;Kalender holen;3180;270
  ```

  1. Lass die KI Anmelderate je Variante, relativen Unterschied und einen Chi-Quadrat-Test
     berechnen. Fordere eine Erklärung in vier Sätzen für das Team.
  2. Rechne die Anmelderaten selbst nach und lass dir den Python-Code zeigen. Stimmen die
     Ausgangszahlen?
  3. Frage die KI, wie viele Besuche pro Variante nötig gewesen wären, um einen Unterschied von
     7,0 % zu 8,4 % sicher zu erkennen (5 % Signifikanz, 80 % Teststärke).
  4. Trage das Ergebnis in ein Testlog mit den Feldern aus Abschnitt 16.6 ein.
tip: |
  Achte darauf, ob die KI den Unterschied als „Beweis" bezeichnet oder Ursachen behauptet
  („weil Nutzer konkrete Vorteile bevorzugen"). Signifikanz sagt nur, dass der Unterschied
  wahrscheinlich nicht zufällig ist – nicht, warum er entsteht.
solution: |
  Erwartbare Werte:

  | Kennzahl | Wert |
  |---|---|
  | Anmelderate A | 7,0 % |
  | Anmelderate B | ca. 8,5 % |
  | relativer Unterschied | ca. +21 % |
  | p-Wert (Chi-Quadrat, ohne Korrektur) | ca. 0,026 |
  | Ergebnis | signifikant bei 5 % |
  | nötige Besuche für 7,0 % → 8,4 % | ca. 5.700 pro Variante |

  Je nach Einstellung (z. B. Yates-Korrektur) weicht der p-Wert leicht ab; das ist kein Fehler.
  Bemerkenswert ist Punkt 3: Der Test war für diesen Effekt eigentlich zu klein geplant. Dass er
  trotzdem signifikant wurde, liegt daran, dass der beobachtete Unterschied etwas größer war. Eine
  Wiederholung oder Weiterführung stärkt das Ergebnis.

  Testlog-Eintrag (Kurzform): Hypothese „Nutzen im Button erhöht Anmelderate"; Ergebnis A 7,0 %,
  B 8,5 %, p ≈ 0,03; Erkenntnis: Nutzenformulierung bei diesem Leadmagneten wirksam; nächster
  Schritt: Prinzip bei der nächsten Landingpage erneut testen.
