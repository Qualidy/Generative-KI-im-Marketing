title: Das Agenturangebot kritisch prüfen – Prompt-Duell und Rollen
difficulty: 3
question: |
  Eine Agentur schlägt Fjordlicht vor, die Frühjahrskampagne für die Regenjacke „Sølv"
  **vollständig mit KI-Video** umzusetzen:

  ```text
  - 45-Sekunden-Spot, komplett per Text-zu-Video, ohne Dreh
  - wiederkehrende Hauptfigur in sechs Einstellungen
  - Jacke im Detail: Reißverschluss, Kapuzenverstellung, Logo auf der Brust
  - Schluss: drei "Kundinnen" sagen in die Kamera, wie dicht die Jacke ist
  - Claim im Bild: "Die nachhaltigste Regenjacke Deutschlands"
  - Kosten: 40 Prozent unter einem klassischen Dreh
  ```

  **Gruppenarbeit:** 4 Personen (bei 3 entfällt der Advocatus Diaboli), etwa 30 Minuten.
  **Am Ende liegt vor:** eine gemeinsame Bewertungstabelle, ein Gegenvorschlag und ein
  Antwortentwurf an die Agentur in Outlook; im Plenum stellt ihr eure Entscheidung in zwei
  Minuten vor.

  1. **Prompt-Duell.** Teilt euch in zwei Paare. **Paar A** gibt das Angebot in Copilot Chat
     (Modus **Arbeit**) mit einer kurzen, offenen Bitte ein: „Bewerte dieses Angebot." **Paar B**
     schreibt einen strukturierten Prompt: Verweis auf `/Fjordlicht-Basisdaten` (aus Kap. 11),
     Bewertung je Punkt als realistisch, nur mit Einschränkungen oder nicht vertretbar, getrennt
     nach Technik (Abschnitt 35.6), Marke und Recht. Vergleicht beide Antworten: Welche ist zu
     wohlwollend, wo fehlt eine Begründung?
  2. **Rollen für die Gegenprüfung.** Verteilt nun die Rollen:
     - **Technik** prüft die Bewertung gegen Abschnitt 35.6 (Länge, Konsistenz, Produkttreue).
     - **Marke und Claims** prüft gegen Markenstimme und Claim-Liste aus den Basisdaten.
     - **Plattformen** lässt sich in Copilot Chat im Modus **Web** die aktuellen Regeln von Meta,
       TikTok und YouTube für realistische KI-Inhalte mit Quellen nennen und prüft Datum und
       Herkunft der Quellen.
     - **Advocatus Diaboli** verteidigt das Angebot, vor allem den Kostenpunkt, und zwingt die
       Gruppe, jede Ablehnung zu begründen.

     Führt die Ergebnisse in einer gemeinsamen Tabelle zusammen (rechtlich genügen Verweise auf
     Kap. 34 und 39).
  3. **Gegenvorschlag und Antwort.** Formuliert gemeinsam einen **Gegenvorschlag**, der KI-Video
     sinnvoll einsetzt. Eine Person lässt in Outlook von Copilot einen Antwortentwurf an die
     Agentur erstellen und nutzt das **Coaching durch Copilot**. Die anderen lesen mit und prüfen:
     Ist die Antwort klar, aber nicht abweisend? Steht die Ablehnung der KI-„Kundinnen" noch
     unmissverständlich drin?
tip: |
  Trennt zwei Fragen: „Geht das technisch?" und „Dürfen und wollen wir das?". Manche Punkte
  scheitern an der Technik, andere an Täuschung oder an der Markenstimme – und einer an beidem.
  Achtet im Prompt-Duell darauf, ob die offene Anfrage den Kostenpunkt ungeprüft übernimmt und
  ob der strukturierte Prompt das ändert. Der Advocatus Diaboli macht seinen Job gut, wenn die
  Gruppe danach bessere Begründungen hat, nicht wenn sie nachgibt.
solution: |
  Beispiel-Prompt für Paar B:

  ```text
  Prüfe das folgende Agenturangebot für Fjordlicht kritisch.
  Nutze Markenstimme und belegte Claims aus /Fjordlicht-Basisdaten.
  Bewerte jeden Punkt als "realistisch", "nur mit Einschränkungen" oder
  "nicht vertretbar" und begründe getrennt nach Technik (kurze Clips,
  Konsistenz, Produkttreue), Marke und Recht (Täuschung, Testimonials,
  Superlative, Kennzeichnung). Nenne beim Kostenpunkt ausdrücklich, welche
  Kosten in der Rechnung fehlen könnten.
  Ausgabe: Tabelle mit Punkt, Bewertung, Begründung.
  [Angebot einfügen]
  ```

  | Punkt | Bewertung | Begründung |
  |---|---|---|
  | 45 s ohne Dreh | nur mit Einschränkungen | Clips sind kurz, 45 s heißt viele Einzelclips und viel Schnitt |
  | wiederkehrende Hauptfigur | nur mit Einschränkungen | Gesicht und Kleidung driften zwischen Einstellungen; Referenzbilder helfen nur teilweise |
  | Jacke im Detail per Text-zu-Video | nicht vertretbar | Modell kennt die Jacke nicht; Details und Logo werden erfunden – irreführende Produktdarstellung (Kap. 34) |
  | KI-„Kundinnen" mit Aussagen | nicht vertretbar | erfundene Testimonials täuschen, realistisch wirkende Personen erfordern Plattformlabels; Vertrauensschaden |
  | Superlativ-Claim | nicht vertretbar | widerspricht Markenstimme (keine Superlative, kein Greenwashing), nicht belegbar, UWG-Risiko |
  | 40 % günstiger | offen | Iterationen, Credits, Prüfaufwand und Nachbearbeitung fehlen in der Rechnung |

  Worauf ihr beim Vergleich der beiden Paare achten solltet: ob eine Antwort die Hauptfigur als
  „realistisch" einstuft, den Kostenpunkt ungeprüft übernimmt oder die KI-Kundinnen nur als
  „kennzeichnungspflichtig" statt als Täuschung bewertet. Wer das in der Gruppentabelle
  korrigiert, hat die Übung verstanden. Typische Einwände des Advocatus Diaboli („Die Kundinnen
  sind doch gekennzeichnet", „40 Prozent sind 40 Prozent") lassen sich mit Täuschung und
  versteckten Kosten (Iterationen, Prüfaufwand) beantworten.

  Gegenvorschlag:

  - echter, kurzer Produktdreh (Details, Handgriffe, echte Menschen)
  - KI-Video für Stimmung: Nordsee-Wetter, Regen, Landschaft als Intros und Übergänge
  - Bild-zu-Video aus freigegebenen Produktfotos für Social-Varianten (9:16, 4:5)
  - Kundenstimmen nur echt und mit Einwilligung, Claim aus der Claim-Liste
  - Plattformlabels, wo realistische KI-Szenen enthalten sind; Einzelbildprüfung vor Freigabe

  Beispiel-Prompt für den Outlook-Entwurf:

  ```text
  Antworte der Agentur freundlich und klar: Wir möchten KI-Video einsetzen,
  aber nicht für Produktdetails, Kundenstimmen und den Superlativ-Claim.
  Schlage den Gegenvorschlag (Stichpunkte unten) vor und bitte um ein
  überarbeitetes Angebot mit realistischer Kostenaufstellung inklusive
  Iterationen und Prüfaufwand. Ton: ruhig, ehrlich, Du/Sie wie bisher im Thread.
  [Gegenvorschlag einfügen]
  ```

  Bewertungskriterien: Jeder Punkt wird bewertet, technische und rechtliche Gründe werden
  getrennt. Die Gruppe hat die Unterschiede zwischen offener und strukturierter Anfrage benannt
  und erklärt, woran sie liegen. Copilots Erstbewertung wird nachweisbar korrigiert, die
  Labelregeln sind mit Quelle und Datum belegt, jeder Einwand des Advocatus Diaboli ist
  beantwortet. Der Gegenvorschlag nutzt KI dort, wo Konsistenz und Produkttreue unkritisch sind,
  und der Outlook-Entwurf bleibt nach dem Coaching in der Sache klar.
