title: Hypothese, Variable, Zielmetrik – vier Ideen, vier Prüfende
difficulty: 1
question: |
  **Gruppe:** 4 Personen (bei 3 Personen übernimmt eine Person zwei Ideen), ca. 20 Minuten.
  **Am Ende liegt vor:** eine gemeinsame Bewertungstabelle der vier Ideen und eine umformulierte
  Testidee mit geprüften Varianten A und B.

  Das Fjordlicht-Team hat vier Testideen gesammelt:

  1. Betreff A: `Neu: Fleece Skog` – Betreff B: `Endlich da: Unser neues Fleece Skog für
     kalte Tage` – Ziel: Öffnungsrate.
  2. Button A: `Jetzt anmelden` – Button B: `Kalender holen` – Ziel: Anmelderate auf der
     Landingpage. Hypothese: Nutzen im Button erhöht die Anmelderate.
  3. Instagram-Caption A mit 1 Emoji, B mit 5 Emojis und anderem Hook – Ziel: Likes.
  4. Produkttext Wanderhose „Vidde": A beginnt mit Material, B mit Anwendungsfall, sonst
     identisch – Ziel: Warenkorbrate. Keine Hypothese notiert.

  1. **Arbeitsteilung: erst urteilen.** Jede Person übernimmt eine Idee und beurteilt sie in
     Stichworten: Ist eine Hypothese erkennbar? Unterscheiden sich die Varianten in **genau
     einer** Variable (zählt die Unterschiede einzeln auf)? Ist die Zielmetrik sinnvoll? Stellt
     eure Urteile reihum in zwei Minuten vor.
  2. **Gleicher Prompt, mehrere Ergebnisse.** Alle geben Copilot Chat denselben Prompt mit allen
     vier Ideen und den drei Prüffragen und lassen das Ergebnis als Tabelle ausgeben. Legt die
     Tabellen nebeneinander (Teams-Chat der Gruppe): Wo sind sich die Copilot-Antworten
     untereinander einig, wo nicht? Wo weichen sie von eurem eigenen Urteil ab – und wer hat recht?
  3. **Gruppenentscheidung.** Einigt euch auf die schwächste Idee und formuliert sie gemeinsam
     als Hypothese im Format „Wenn …, dann …, weil …".
  4. **Gegenprobe.** Eine Person lässt Copilot dazu Variante B erzeugen, die sich nur in
     **einem** Punkt von A unterscheidet. Eine andere Person, die den Prompt nicht geschrieben
     hat, prüft Wort für Wort, ob das stimmt. Stellt Hypothese und Varianten in einer Minute im
     Plenum vor.
tip: |
  Prüft zuerst die Variablen: Zählt, wie viele Dinge sich zwischen A und B unterscheiden. Dann
  die Metrik: Misst sie wirklich das, was das Marketing erreichen will? Achtet beim Vergleich der
  Copilot-Tabellen besonders auf Idee 1: Wird die Öffnungsrate in allen Antworten kritisch
  eingeordnet – und zählen alle Antworten gleich viele Unterschiede?
solution: |
  Beispiel-Prompt:

  ```text
  Prüfe die vier A/B-Testideen unten. Beantworte je Idee in einer Tabelle:
  Hypothese erkennbar (ja/nein)? Wie viele Variablen unterscheiden A und B
  (zähle sie einzeln auf)? Ist die Zielmetrik sinnvoll - und warum?
  Ideen: [Ideen einfügen]
  ```

  | Nr. | Hypothese | Eine Variable? | Zielmetrik | Urteil |
  |---|---|---|---|---|
  | 1 | fehlt | nein (Länge, „Endlich", Nutzenhinweis, Ansprache) | Öffnungsrate nur eingeschränkt verlässlich | schwach |
  | 2 | ja, Begründung knapp | ja | passend | gut |
  | 3 | fehlt | nein (Emojis und Hook) | Likes sind ein schwaches Ziel | schwach |
  | 4 | fehlt | ja | passend | Setup gut, Hypothese ergänzen |

  Mögliche Abweichungen beim Vergleich: Eine Copilot-Antwort zählt bei Idee 1 nur zwei
  Unterschiede, eine andere vier; eine hält die Öffnungsrate für unproblematisch, eine andere
  nicht. Maßstab ist die Prüfung aus Abschnitt 16.1, nicht die Mehrheit der Antworten.

  Umformulierung von Idee 1 (Beispiel): „Wenn der Betreff einen konkreten Einsatzzweck nennt
  (‚für kalte Tage') statt nur die Neuheit, steigt die **Klickrate**, weil unsere Leser:innen
  Produkte nach Situation auswählen." Dazu Variante A: `Neu: Fleece Skog`, Variante B:
  `Neu: Fleece Skog für kalte Tage` – nur der Zusatz unterscheidet sich. Lautet der Vorschlag
  etwa `Neu: Fleece Skog – endlich warm durch kalte Tage`, testet er wieder zwei Dinge.

  Idee 3 lässt sich retten, indem nur die Emoji-Anzahl variiert wird. Likes als Ziel bleiben
  aber fragwürdig; besser sind Speicherungen oder Profilklicks, wenn es um Interesse geht.

  Bewertungskriterien: Jede Idee wurde zuerst ohne Copilot beurteilt; Abweichungen zwischen den
  Copilot-Tabellen der Gruppenmitglieder wurden benannt und gegen Abschnitt 16.1 entschieden;
  die Hypothese folgt dem Format; Variante B wurde von einer zweiten Person nachweislich auf
  genau eine Variable geprüft.
