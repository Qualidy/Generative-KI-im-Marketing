title: Konsistenzproblem erkennen und gezielt bearbeiten
difficulty: 1
question: |
  Das Fjordlicht-Team hat für die Herbstkampagne fünf Bilder erzeugt und meldet diese Probleme:

  1. Die Wanderin hat auf Bild 3 plötzlich blonde statt dunkle Haare.
  2. Der Rucksack „Tind" hat auf zwei Bildern unterschiedlich viele Seitentaschen.
  3. Bild 4 ist sonnig und farbsatt, alle anderen sind neblig und gedämpft.
  4. Auf dem Story-Bild steht die Headline „Herbst draussen" mit „ss" statt „ß" und
     in einer Schrift, die nicht zur Marke gehört.
  5. Auf Bild 2 ist alles gut, nur ein Ast ragt der Person vor das Gesicht.

  **Schritt 1 – zuordnen.** Ordne jedem Problem die **Konsistenzebene** aus Abschnitt 33.1 zu
  und nenne das passende **Mittel** – generieren, bearbeiten, Referenz, Layout oder echtes Foto.

  **Schritt 2 – ausprobieren.** Stelle Problem 5 in Copilot nach: Erzeuge ein Bild einer
  Wanderin im Wald, bei der ein Ast vor dem Gesicht hängt. Bitte Copilot dann im selben Chat,
  **nur** den Ast zu entfernen, und sag ausdrücklich, was gleich bleiben soll. Vergleiche
  Vorher und Nachher: Hat Copilot nur den Ast geändert – oder das Bild teilweise neu erzeugt?
tip: |
  Frage dich bei jedem Problem: Lässt es sich durch eine bessere Generierung überhaupt lösen –
  oder gehört es in einen anderen Arbeitsschritt? Lege die beiden Bilder aus Schritt 2 zum
  Vergleich nebeneinander und schau auf Gesicht, Jacke und Hintergrund.
solution: |
  | Nr. | Ebene | Mittel |
  |---|---|---|
  | 1 | Figur | Steckbrief wortgleich im Prompt, Referenzbild aus dem ersten gelungenen Bild, ggf. Haare per Bearbeitung angleichen |
  | 2 | Produkt | echtes Produktfoto verwenden; generierte Produkte sind nie zuverlässig |
  | 3 | Stil | Bildsprache-Baustein wortgleich verwenden, Stilreferenz, ggf. Himmel und Farbe per Bearbeitung anpassen |
  | 4 | Layout | Text aus dem Bild entfernen, Headline im Layout-Werkzeug in Hausschrift setzen |
  | 5 | Szene (lokaler Fehler) | Bearbeitung bzw. Inpainting: nur den Ast entfernen, Rest bleibt gleich |

  Bearbeitungsprompt für Schritt 2:

  ```text
  Entferne nur den Ast vor dem Gesicht der Person. Person, Gesicht, Jacke,
  Haltung, Hintergrund, Bildausschnitt und Farbwelt bleiben exakt gleich.
  ```

  Typische Beobachtung: Der Ast verschwindet, aber Gesicht, Jackendetails oder Bäume im
  Hintergrund verändern sich leicht mit – Chat-Werkzeuge erzeugen das Bild je nach Funktion
  teilweise neu (33.3). Für pixelgenaue Korrekturen ist ein Werkzeug mit markiertem Bereich
  (z. B. Generatives Füllen in Photoshop) verlässlicher.

  Kern der Übung: Nur Nr. 1 und 3 sind echte Generierungsprobleme. Nr. 2 und 4 lassen sich mit
  Bild-KI grundsätzlich nicht verlässlich lösen, Nr. 5 wäre durch Neugenerierung sogar
  verschlimmert worden, weil das gute Bild verloren ginge.
