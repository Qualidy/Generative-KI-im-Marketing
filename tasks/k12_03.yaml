title: Copilot-Bewertung gegen Team-Bewertung in Excel
difficulty: 3
question: |
  Diese Übung macht ihr in **Copilot Chat** und **Copilot in Excel**.

  **Gruppe:** 3–4 Personen · **Dauer:** ca. 30 Minuten · **Aufteilung:** alle führen denselben
  Bewertungsprompt aus; eine Person ist Excel-Verantwortliche, eine Advocatus Diaboli · **Am Ende
  liegt vor:** eine geteilte Excel-Tabelle mit Copilot- und Team-Bewertung und ein verbesserter
  Bewertungsprompt, den jede Person in ihrer Prompt Gallery gespeichert hat.

  1. Eine Person lässt in Copilot Chat mit einem Ideen-Fächer (Zielgruppe × Format × Anlass)
     **15 Content-Ideen** für Fjordlicht im Januar erzeugen (Verweis auf
     `/Fjordlicht-Basisdaten`) und schickt die nummerierte Liste in den Teams-Chat der Gruppe.
  2. **Gleicher Prompt, mehrere Ergebnisse:** Jede Person lässt **dieselben** 15 Ideen in ihrem
     eigenen Copilot mit **demselben** Prompt nach dem gewichteten Bewertungsraster aus Abschnitt
     12.6 bewerten (Zielgruppenrelevanz 3, Markenpassung 3, Aufwand 2, Wiederverwertbarkeit 1,
     Ziel-Beitrag 2; Skala 1–5).
  3. **Team-Bewertung:** Bevor ihr die Copilot-Ergebnisse anseht, bewertet ihr die 15 Ideen
     gemeinsam nach demselben Raster. Der Advocatus Diaboli widerspricht bei jeder Idee mit
     hoher Punktzahl mindestens einmal.
  4. **Excel:** Die Excel-Verantwortliche legt im Ordner „Fjordlicht-Kurs" eine Tabelle an
     (Ideen, Kriterienpunkte aus Copilot-Lauf 1, Team-Punkte) und teilt sie. Die anderen tragen die
     Gesamtpunktzahlen ihrer Copilot-Läufe in eigene Spalten ein. Lasst **Copilot in Excel**
     Formelspalten für die gewichtete Gesamtpunktzahl (Copilot-Lauf 1 und Team) und für die
     Differenz vorschlagen, die Ideen mit der größten Abweichung hervorheben und die Ideen nach
     Team-Punkten sortieren.
  5. **Auswertung:** Wie stark unterscheiden sich eure Copilot-Läufe untereinander? Wo weicht
     Copilot am stärksten vom Team ab? Erklärt die drei größten Abweichungen.
  6. **Verbesserter Prompt:** Formuliert gemeinsam einen besseren Bewertungsprompt und testet ihn
     in zwei neuen Chats (zwei verschiedene Personen). Jede Person speichert den Prompt danach in
     ihrer **Prompt Gallery**.
tip: |
  Prüft die Formeln, die Copilot in Excel vorschlägt, bevor ihr sie einfügt: Stimmen die Gewichte,
  stimmen die Spaltenbezüge? Achtet beim Vergleich darauf, ob die Copilot-Punktzahlen auffällig
  eng beieinanderliegen – ein Blick auf Minimum und Maximum genügt – und bei welchen Kriterien
  Copilot und Team am weitesten auseinanderliegen. Wenn sich eure Copilot-Läufe deutlich
  unterscheiden, ist das selbst ein Befund: Dieselbe Bewertung fällt bei jedem Lauf etwas anders
  aus.
solution: |
  Beispielprompt für Copilot in Excel:

  ```text
  Füge eine Spalte "Gesamt Copilot" hinzu: Relevanz*3 + Marke*3 + Aufwand*2
  + Wiederverwertbarkeit*1 + Ziel*2 aus den Copilot-Spalten. Dasselbe als
  "Gesamt Team" aus den Team-Spalten. Füge eine Spalte "Differenz" hinzu und
  hebe die drei Zeilen mit der größten absoluten Differenz hervor.
  ```

  Mögliche Befunde (prüft, welche bei euch auftreten):

  - **Wenig Spreizung:** viele Ideen zwischen 3,5 und 4,2.
  - **Unterschiede zwischen den Läufen:** Dieselbe Idee landet in einem Lauf auf Platz 2, im
    anderen auf Platz 7 – ein Hinweis, dass die Bewertung keine feste Messung ist.
  - **Aufwand** wird niedriger eingeschätzt als vom Team, etwa bei Videoformaten, weil Drehaufwand
    und Freigaben nicht im Prompt stehen.
  - **Markenpassung** wird höher eingeschätzt, wenn eine Idee formal zu „nachhaltig" passt, aber
    Greenwashing-Risiko hat (z. B. „Wie Fjordlicht das Klima schützt").
  - Bei **Zielgruppenrelevanz** liegen Copilot und Team oft nah beieinander.

  Verbesserter Bewertungsprompt (Auszug):

  ```text
  Bewerte die Ideen nach dem Raster unten. Regeln:
  - Erzwinge eine Rangfolge: keine zwei Ideen mit gleicher Gesamtpunktzahl.
  - Nutze die volle Skala von 1 bis 5.
  - Aufwand: Unser Team hat 5 Personen, keine eigene Videoproduktion,
    Freigaben dauern 3 Tage.
  - Markenpassung: Vergib höchstens 2 Punkte, wenn die Idee eine
    Nachhaltigkeitsaussage braucht, die nicht unter "Belegte Claims" in
    /Fjordlicht-Basisdaten steht.
  - Nenne für die Top 3 jeweils das stärkste Gegenargument.
  ```

  Bewertungskriterien: Team-Bewertung vor dem Blick auf die Copilot-Punkte erstellt, Formeln von
  Copilot in Excel geprüft, mindestens drei konkrete Abweichungen mit Ursache benannt, verbesserter
  Prompt enthält Kontext zu Ressourcen und Claims sowie eine Regel gegen eng beieinanderliegende
  Punktzahlen und ist gespeichert; zur Zusammenarbeit: alle haben denselben Prompt ausgeführt, die
  Abweichungen zwischen den Copilot-Läufen der Gruppenmitglieder wurden benannt und erklärt, und
  der Advocatus Diaboli hat die Team-Bewertung sichtbar verändert. Lernziel: KI-Bewertungen sind
  Vorsortierung, keine Entscheidung.
