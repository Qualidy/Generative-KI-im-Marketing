title: Suchintention erkennen – drei Quellen, eine Entscheidung
difficulty: 1
question: |
  **Gruppe:** 3–4 Personen · **Dauer:** etwa 20 Minuten · **Format:** Arbeitsteilung nach Quelle
  · **Am Ende liegt vor:** eine gemeinsame Zuordnungstabelle und eine Gruppenentscheidung zur
  uneindeutigen Anfrage.

  Ordnet jeder Suchanfrage die **Suchintention** zu (informational, navigational, kommerziell,
  transaktional) und nennt den **Seitentyp**, mit dem Fjordlicht sie am besten bedient
  (Abschnitt 21.2).

  1. `fleece pilling entfernen`
  2. `fjordlicht gutschein einlösen`
  3. `wanderhose damen kaufen`
  4. `softshell oder hardshell unterschied`
  5. `beste nachhaltige outdoormarken`
  6. `rucksack 30 liter tagestour`

  So geht ihr vor:

  1. **Allein (3 Minuten):** Jede Person ordnet zuerst selbst zu.
  2. **Aufteilung nach Quelle:**
     - **Person 1** lässt **Copilot Chat** mit dem Umschalter auf **Arbeit** zuordnen.
     - **Person 2** lässt **Copilot Chat** mit dem Umschalter auf **Web** zuordnen und bittet
       darum, für Nr. 5 und Nr. 6 zu beschreiben, welche Art von Ergebnissen aktuell erscheint –
       mit Quellen.
     - **Person 3** gibt Nr. 5 und Nr. 6 selbst in die Google-Suche ein und notiert, welche
       Seitentypen oben stehen (Shops, Ratgeber, Testberichte, Listen).
     - **Person 4** (falls vorhanden) öffnet zwei der Quellen, die Copilot im Web-Modus nennt, und
       prüft, ob sie das Behauptete tatsächlich zeigen.
  3. **Zusammenführen:** Vergleicht die Ergebnisse. Wo unterscheiden sich Arbeit- und Web-Modus?
     Wo widerspricht die eigene Google-Suche der Copilot-Beschreibung?
  4. **Gruppenentscheidung:** Bei einer der Anfragen ist die Intention nicht eindeutig. Welche
     ist es, und welchen Seitentyp würdet ihr dafür bauen? Eine Person begründet die
     Entscheidung in einer Minute im Plenum.
tip: |
  Achtet auf Signalwörter: „kaufen" und „bestellen" deuten auf Transaktion, „beste", „Test"
  oder „Vergleich" auf kommerzielle Recherche, Markennamen auf Navigation, „wie" oder
  „Unterschied" auf Information. Beachtet beim Vergleich: Die Websuche von Copilot nutzt Bing,
  nicht Google – die Ergebnisseite eurer Kundinnen kann anders aussehen. Achtet beim Vergleich
  darauf, ob die Antwort im Arbeitsmodus Quellen nennt oder die Intention nur aus dem Wortlaut
  ableitet – und ob sie trotzdem so klingt, als hätte Copilot nachgesehen.
solution: |
  | Nr. | Intention | Seitentyp |
  |---|---|---|
  | 1 | informational | Pflegeratgeber im Blog „Draußen-Notizen" |
  | 2 | navigational | Hilfeseite/FAQ zum Gutschein |
  | 3 | transaktional | Kategorieseite „Wanderhosen Damen" |
  | 4 | informational (mit kommerziellem Anteil) | Ratgeber mit Verlinkung auf passende Jacken |
  | 5 | kommerziell | Haltungs- oder Über-uns-Seite, eher schwer zu gewinnen, weil die Ergebnisse meist unabhängige Listen sind |
  | 6 | uneindeutig: kommerziell oder transaktional | Kaufberatung oder Kategorieseite mit Filter |

  Nr. 6 ist uneindeutig: Die Person kann schon kaufen wollen oder erst Orientierung suchen.
  Klären lässt es sich nur an der aktuellen **Suchergebnisseite**: Erscheinen dort vor allem
  Shops, ist die Intention transaktional; erscheinen Ratgeber und Tests, kommerziell.

  Beispiel-Prompt für Person 2 (Web):

  ```text
  Ordne die sechs Suchanfragen einer Suchintention zu (informational,
  navigational, kommerziell, transaktional) und nenne einen passenden
  Seitentyp für einen Outdoor-Onlineshop. Beschreibe für Nr. 5 und Nr. 6,
  welche Arten von Seiten aktuell in den Suchergebnissen erscheinen, und
  nenne die Quellen.
  ```

  Worauf es beim Zusammenführen ankommt: Nennt die Antwort im Arbeitsmodus keine Quellen, ist
  die Zuordnung aus dem Wortlaut geschätzt – meist plausibel, aber ohne Beleg. Die Antwort im
  Web-Modus stützt sich auf Bing-Ergebnisse mit Quellen, die eigene Suche auf Google. Für die
  Entscheidung über den Seitentyp zählt der eigene Blick auf die Google-Ergebnisseite.

  Bewertungskriterien:

  - Alle haben vor der Aufteilung selbst zugeordnet.
  - Die Unterschiede zwischen Arbeitsmodus, Web-Modus und Google-Suche sind benannt und
    erklärt (mit oder ohne Quellen, Bing, Google).
  - Mindestens eine Copilot-Quelle wurde geöffnet und geprüft.
  - Die Gruppenentscheidung zu Nr. 6 stützt sich auf die beobachtete Ergebnisseite, nicht auf
    eine Vermutung.
