title: Monitoring, Listening oder Eskalation? – vier Copilots, eine Entscheidung
difficulty: 1
question: |
  **Gruppe:** 3–4 Personen · **Dauer:** etwa 20 Minuten · **Format:** gleicher Prompt, mehrere
  Ergebnisse · **Am Ende liegt vor:** eine gemeinsame Zuordnungstabelle und ein strittiger Fall
  für das Plenum.

  Ihr arbeitet in **Copilot Chat** (Microsoft-365-Copilot-App, Teams oder Browser, Umschalter auf
  **Arbeit**). Die Fälle sind fiktiv.

  1. **Allein (3 Minuten):** Jede Person ordnet jede Situation still für sich zu: Ist das
     **Monitoring** oder **Listening** (Abschnitt 19.1)? Welche **Eskalationsstufe** aus
     Abschnitt 19.5 – Grün, Gelb, Orange, Rot – ist angemessen? Notiert eure Einstufung, bevor
     ihr Copilot fragt.
  2. **Ein Prompt für alle:** Einigt euch auf **einen** Prompt mit den sechs Fällen, der Tabelle
     der Eskalationsstufen aus Abschnitt 19.5 und dem Auftrag, beides in einer Tabelle mit
     Begründung zuzuordnen. Jede Person führt genau diesen Prompt in einem **neuen Chat** in
     ihrem eigenen Copilot aus.
  3. **Vergleichen:** Legt die Ergebnisse nebeneinander, z. B. als Screenshots oder kopierte
     Tabellen in eurem Teams-Gruppenchat. Wo weichen die Copilot-Antworten **untereinander** ab,
     wo weichen sie von **euren** Einstufungen ab? Achtet besonders darauf, ob Fall 3 und Fall 4
     in allen Antworten gleich eingestuft werden.
  4. **Gruppenentscheidung:** Legt pro Fall eine Stufe mit einem Satz Begründung fest. Die
     strittigste Zuordnung stellt eine Person in einer Minute im Plenum vor: Was hat Copilot
     gesagt, was habt ihr entschieden, und warum?

  Die Fälle:

  1. Eine Kundin markiert Fjordlicht auf Instagram mit einem Foto ihrer neuen Wanderhose.
  2. Über drei Monate taucht in Kommentaren immer häufiger die Frage auf, ob Fjordlicht Reparaturen
     anbietet.
  3. Eine Lokalzeitung fragt per E-Mail nach, ob an dem TikTok-Vorwurf zu recycelten Materialien
     etwas dran ist.
  4. Mehrere Eltern berichten, dass sich bei einer Kinderjacke ein Kordelstopper gelöst hat und von
     Kleinkindern verschluckt werden könnte.
  5. Das negative Sentiment liegt diese Woche deutlich über dem Schnitt; fast alle Beiträge betreffen
     Lieferverzögerungen nach einer Rabattaktion.
  6. Das Team vergleicht, worüber auf Reddit bei Fjordlicht und bei zwei Wettbewerbern gesprochen
     wird.
tip: |
  Monitoring reagiert auf den einzelnen Beitrag, Listening sucht Muster über Zeit oder Quellen.
  Bei der Eskalation entscheidet nicht die Zahl der Beiträge allein, sondern auch das **Thema**:
  Sicherheit und Medienanfragen wiegen schwerer als Ärger über Lieferzeiten. Achtet beim Vergleich
  darauf, ob Copilot Fall 4 nach der **Menge** („mehrere Eltern") oder nach dem **Thema**
  (Kindersicherheit) einstuft. Dass vier Personen mit demselben Prompt unterschiedliche Antworten
  bekommen können, ist kein Fehler, sondern zeigt, dass Sprachmodelle mit Wahrscheinlichkeiten
  arbeiten (Kap. 1 und Abschnitt 2.5).
solution: |
  Beispiel-Prompt für Copilot Chat:

  ```text
  Ordne die sechs Fälle unten zu. Spalten: Nr. | Monitoring oder Listening |
  Eskalationsstufe (Grün, Gelb, Orange, Rot) | Begründung in einem Satz.
  Nutze ausschließlich diese Stufen-Definitionen: [Tabelle aus Abschnitt 19.5]
  Wenn ein Fall zwischen zwei Stufen liegt, nenne beide und begründe.
  Fälle: [1 bis 6 einfügen]
  ```

  Erwartete Zuordnung:

  | Nr. | Art | Stufe | Begründung |
  |---|---|---|---|
  | 1 | Monitoring | Grün | einzelne positive Erwähnung, Reaktion: Danke, ggf. teilen (mit Erlaubnis) |
  | 2 | Listening | Grün | Muster über Zeit: Der kostenlose Reparaturservice (erste zwei Jahre) ist offenbar zu wenig bekannt – Erkenntnis für Content |
  | 3 | Monitoring | Orange | Medienanfrage – abgestimmte Stellungnahme, keine Einzelantwort |
  | 4 | Monitoring | Rot | Produktsicherheit, Kinder betroffen – Krisenteam, Prüfung, ggf. Rückruf |
  | 5 | Listening | Gelb | deutlicher Ausschlag mit klarem Thema – Leitfaden-Antworten, Teamleitung informieren |
  | 6 | Listening | Grün | Wettbewerbsanalyse, keine akute Reaktion nötig |

  Worauf es beim Vergleich ankommt: Landet Fall 4 in einer der Antworten auf Gelb oder Orange,
  weil nur „mehrere" Beiträge genannt sind, oder Fall 3 auf Gelb, weil die Stimmung nicht
  beziffert ist, zeigt das, warum Schwellenwerte allein nicht genügen: Schon wenige Beiträge
  reichen für Stufe Rot, wenn es um Sicherheit geht. Die Eskalationslogik braucht deshalb neben
  Mengen auch **Themen-Auslöser** – und die Einstufung bleibt eine menschliche Entscheidung.
  Copilot ist hier ein guter Sparringspartner, kein Schiedsrichter. Wenn die vier Copilot-Antworten
  bei einem Fall auseinandergehen, ist das ein deutliches Signal, dass dieser Fall eine klare
  menschliche Regel braucht.

  Bewertungskriterien:

  - Jede Person hat vor dem Copilot-Lauf eine eigene Einstufung notiert.
  - Alle haben denselben Prompt in einem neuen Chat ausgeführt; Abweichungen zwischen den
    Copilot-Antworten sind benannt (welcher Fall, welche Stufen).
  - Die Gruppenentscheidung stuft Fall 4 auf Rot und Fall 3 mindestens auf Orange ein und
    begründet das mit dem Thema, nicht mit der Menge.
  - Die Plenumsvorstellung trennt klar zwischen Copilot-Vorschlag und Gruppenentscheidung.
