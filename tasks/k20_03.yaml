title: Scheinbefunde entlarven – mit Advocatus Diaboli
difficulty: 3
question: |
  **Gruppe:** 3–4 Personen · **Dauer:** etwa 30 Minuten · **Format:** Rollen mit Wechsel pro
  Regel, danach Gegenprobe in Copilot · **Am Ende liegen vor:** eine Bewertung aller vier Regeln,
  ein getesteter Prompt-Baustein und ein Vergleich zweier Copilot-Antworten.

  Eine Kollegin hat die Blog- und Social-Daten von Fjordlicht mit Copilot ausgewertet und schlägt
  auf Basis der Ergebnisse vier neue Regeln für alle Texte vor:

  1. „Blogartikel über 2.000 Wörter haben 60 Prozent mehr Engagement-Zeit. Ab sofort schreiben
     wir nur noch lange Artikel."
  2. „Instagram-Posts mit drei oder mehr Emojis bekommen doppelt so viele Likes. Jeder Post
     bekommt künftig mindestens drei Emojis."
  3. „LinkedIn-Beiträge, die die Geschäftsführerin postet, bekommen viermal so viele Kommentare
     wie Beiträge auf der Unternehmensseite. Der Text ist also besser."
  4. „Seit wir die Produkttexte mit KI überarbeitet haben, ist die Conversion-Rate im Oktober um
     18 Prozent gestiegen. Die KI-Texte wirken."

  **Teil 1 – Streitgespräch ohne KI (15 Minuten).** Ihr arbeitet die Regeln nacheinander ab,
  jeweils etwa drei Minuten. Pro Regel gibt es drei Rollen, die nach jeder Regel reihum wechseln:

  - **Kollegin:** verteidigt die Regel so überzeugend wie möglich.
  - **Advocatus Diaboli:** sucht die **alternative Erklärung** (Störfaktor) und fragt nach den
    **Zusatzdaten**, die die Regel prüfen würden.
  - **Testplanerin:** skizziert einen **Test**, der die Frage klärt (Kap. 16).
  - Bei vier Personen: **Protokoll** – hält Ergebnisse im Teams-Gruppenchat fest.

  Führt die Diskussion schriftlich in eurem **Teams-Gruppenchat** oder haltet die Kernpunkte dort
  fest. Lasst am Ende **Copilot in Teams** den Chat zusammenfassen und prüft, ob die Zusammenfassung
  alle vier Regeln korrekt wiedergibt.

  **Teil 2 – Gegenprobe in Copilot Chat (15 Minuten).**

  1. Die Hälfte der Gruppe gibt Copilot die vier Regeln mit der naiven Frage „Sollen wir diese
     Regeln einführen?".
  2. Die andere Hälfte formuliert einen **Prompt-Baustein**, mit dem Copilot solche
     Scheinbefunde selbst kennzeichnet, bevor es Empfehlungen ausspricht, und stellt damit
     dieselbe Frage in einem neuen Chat.
  3. Vergleicht beide Antworten mit eurem Ergebnis aus Teil 1: Wie kritisch fällt die naive
     Antwort aus? Findet Copilot mit dem Baustein Störfaktoren, die ihr übersehen habt – oder
     umgekehrt?
  4. Jede Person speichert den Baustein in ihrer **Prompt Gallery**, damit sie ihn an künftige
     Analysen anhängen kann (Kap. 10).
tip: |
  Sucht bei jeder Regel nach dem, was **gleichzeitig** mit dem Merkmal auftritt: Thema,
  Zeitraum, Absender, Saison, Zielgruppe. Und prüft die Formulierung: Wo steckt ein „also"
  oder „wirken", das die Daten nicht hergeben? Die Rolle der Kollegin ist wichtig: Wer eine Regel
  ernsthaft verteidigt, merkt, wie überzeugend Scheinbefunde klingen. Achtet in Teil 2 darauf, ob
  die naive Antwort eher zustimmt oder widerspricht.
solution: |
  | Nr. | Alternative Erklärung | Zusatzdaten | Test |
  |---|---|---|---|
  | 1 | Lange Artikel behandeln Kernthemen (Pflege, Kaufberatung) mit mehr Suchnachfrage und Links; Engagement-Zeit steigt mit Länge fast automatisch | Thema, Traffic-Quelle, Scrolltiefe, Conversions je Artikel | dasselbe Thema in kurzer und langer Fassung, Ziel: Newsletter-Anmeldungen statt Zeit |
  | 2 | Emoji-Posts waren Gewinnspiele oder Teaser für Rabatte | Post-Typ, Anlass, Saves und Shares statt Likes | identischer Post mit und ohne Emojis an vergleichbaren Tagen |
  | 3 | Persönliche Profile haben andere Netzwerke und Algorithmusvorteile; Texte waren gar nicht gleich | Reichweite, Follower-Struktur, Textvergleich | derselbe Text auf beiden Profilen, Interaktionsrate pro Impression |
  | 4 | Oktober ist Saisonstart für Regenjacken; parallel lief eventuell eine Kampagne | Vorjahresvergleich, Kampagnenkalender, Traffic-Mix | A/B-Test alter gegen neuer Produkttext im selben Zeitraum |

  Gemeinsames Muster: Alle vier Regeln schließen von Korrelation auf Ursache. Regel 1 und 2
  optimieren zudem auf Eitelkeits- bzw. Nebenkennzahlen.

  Prompt-Baustein für künftige Analysen (in der Prompt Gallery gespeichert):

  ```text
  Bevor du Empfehlungen aussprichst: Prüfe jeden Befund auf mögliche
  Störfaktoren (Thema, Zeitraum, Saison, Absender, Zielgruppe, Kampagnen).
  Nenne für jeden Befund mindestens eine alternative Erklärung und die
  Fallzahl. Formuliere Befunde als Hypothesen ("könnte zusammenhängen") und
  schlage für jede Hypothese einen A/B-Test mit genau einer veränderten
  Variable vor. Gib keine allgemeinen Regeln aus.
  ```

  Worauf es beim Vergleich ankommt: Empfiehlt die naive Antwort die Regeln „mit Anpassungen" oder
  nennt sie nur einzelne Vorbehalte, während die Antwort mit Baustein pro Regel eine
  Gegenerklärung und einen Testvorschlag liefert, ist der Unterschied sichtbar, um den es geht.

  Bewertungskriterien:

  - Plausible, konkrete Störfaktoren statt allgemeiner Skepsis; Zusatzdaten, die die Frage
    tatsächlich entscheiden; Tests mit genau einer Variable.
  - Jede Person hatte mindestens einmal die Rolle Advocatus Diaboli; die Chat-Zusammenfassung
    von Copilot wurde gegen die eigene Diskussion geprüft und, wo nötig, korrigiert.
  - Der Vergleich der beiden Copilot-Antworten ist dokumentiert, inklusive mindestens eines
    Punktes, an dem Gruppe und Copilot unterschiedlich lagen.
