title: Kamerabewegung und Arbeitsweise zuordnen
difficulty: 1
question: |
  Ordne jeder Anforderung aus dem Fjordlicht-Marketing **eine Kamerabewegung** aus Abschnitt
  35.3 und **eine Arbeitsweise** zu (Text-zu-Video, Bild-zu-Video oder Video-zu-Video/Bearbeitung).
  Begründe jede Zuordnung in einem Satz.

  1. Der Rucksack „Tind" soll von allen Seiten gezeigt werden – auf Basis eines vorhandenen
     Produktfotos.
  2. Ein Reel soll mit einer weiten Fjordlandschaft beginnen, die Ruhe und Weite vermittelt.
  3. Eine Wanderin in der Hose „Vidde" soll beim Aufstieg begleitet werden, dynamisch, aber
     nicht hektisch.
  4. In einem selbst gedrehten Clip aus dem Fotoshooting stört ein Mülleimer im Hintergrund.
  5. Ein Detail der Regenjacke „Sølv" (abperlende Tropfen) soll langsam näher rücken.
tip: |
  Frage bei der Arbeitsweise zuerst: Gibt es schon echtes Material, das ich kontrollieren will?
  Wenn ja, ist reines Text-zu-Video fast nie die erste Wahl.
solution: |
  | Nr. | Kamerabewegung | Arbeitsweise | Begründung |
  |---|---|---|---|
  | 1 | Orbit | Bild-zu-Video | Das echte Produktfoto sichert die Details, der Orbit zeigt das Produkt rundum. |
  | 2 | Drone/aerial shot, ggf. langsamer Pan | Text-zu-Video | Landschaft ohne Produkt – hier spielt Text-zu-Video seine Stärke aus. |
  | 3 | Tracking shot | Bild-zu-Video (Startbild aus Shooting) oder echter Dreh | Die Kamera geht mit; das Startbild hält Hose und Person konsistent. |
  | 4 | – (bleibt wie gedreht) | Video-zu-Video/Bearbeitung | Vorhandenes Material wird nur retuschiert, nicht neu erzeugt. |
  | 5 | Dolly in | Bild-zu-Video | Langsames Heranfahren an ein geprüftes Detailfoto ist kontrollierbar. |

  Achte bei Nr. 1 und 5 darauf, dass das Produkt im Ergebnis Bild für Bild geprüft wird:
  Auch beim Animieren können Nähte, Riemen oder Farben verändert werden. Bei Nr. 3 ist ein
  echter Dreh oft die bessere Wahl, wenn die Person in mehreren Einstellungen vorkommen soll.
