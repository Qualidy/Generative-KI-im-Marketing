title: Vom vagen zum präzisen Musik-Prompt
difficulty: 2
question: |
  Copilot erzeugt keine Musik – aber es ist ein guter **Music Supervisor**: Es übersetzt Szene
  und Markenstimme in musikalisches Vokabular. Die Prompts entstehen deshalb in Copilot Chat,
  die Tracks – falls verfügbar – in einem KI-Musikwerkzeug wie Suno, ElevenLabs Music oder
  Google Flow Music. Ohne Musikwerkzeug bearbeitest du die Schritte 1 bis 4 und bewertest die
  Prompts nur schriftlich. Alternativ funktionieren die Schritte 2 und 3 auch in ChatGPT, Claude
  oder Gemini.

  Ausgangslage: Fjordlicht zeigt in einem 20-Sekunden-Reel, wie das Fleece „Skog" an einem
  kalten Morgen am See angezogen wird. Ab Sekunde 12 spricht eine Stimme einen kurzen Satz.

  1. Schreibe den Prompt, den du spontan tippen würdest.
  2. Lass dir in Copilot Chat mit dem Music-Supervisor-Prompt aus Abschnitt 37.3 **drei** Prompts
     in unterschiedliche Richtungen formulieren. Verweise für die Markenstimme auf
     `/Fjordlicht-Basisdaten` (falls nicht vorhanden: Kap. 11 bzw. Markenstimme einfügen).
  3. Lass Copilot im selben Chat alle drei Prompts gegen die sechs Bausteine prüfen (Genre,
     Stimmung, Tempo, Instrumente, Gesang, Struktur und Länge) und als Tabelle ausgeben. Prüfe
     die Tabelle selbst nach und ergänze, was fehlt – insbesondere: Was passiert ab Sekunde 12?
  4. Speichere den Music-Supervisor-Prompt in der **Prompt Gallery** (bzw. in deinen
     gespeicherten Prompts), damit du ihn im Workshop wiederverwenden kannst.
  5. Erzeuge mit deinem spontanen und dem besten überarbeiteten Prompt je einen Track im
     Musikwerkzeug und vergleiche.
tip: |
  Die Sprechstelle ab Sekunde 12 ist der Prüfstein. Ein Track, der genau dort lauter wird oder
  Gesang einsetzt, ist unbrauchbar, auch wenn er schön klingt. Schreib so etwas ausdrücklich in
  den Prompt. Und achte darauf, dass Copilot keine Künstler- oder Songnamen als Orientierung
  vorschlägt.
solution: |
  Beispiel-Prompt für Copilot Chat:

  ```text
  Du bist Music Supervisor für Social-Media-Werbung.
  Szene: 20-Sekunden-Reel, kalter Morgen am See, jemand zieht das Fleece
  "Skog" an; ab Sekunde 12 spricht eine Stimme einen kurzen Satz.
  Marke: Markenstimme aus /Fjordlicht-Basisdaten (ruhig, ehrlich, nordisch-trocken).
  Zielgruppe: naturverbundene Stadtmenschen 25-45.
  Schreibe drei unterschiedliche Prompts für ein KI-Musikwerkzeug, je mit
  Genre, Stimmung, Tempo in BPM, Instrumenten, Gesang, Struktur mit
  Sekundenangaben und dem, was ausdrücklich NICHT vorkommen soll.
  Nenne keine Künstler- oder Songnamen.
  ```

  Beispiel für einen überarbeiteten Prompt:

  ```text
  Instrumental, keine Stimme.
  Genre: akustischer Nordic Folk, minimalistisch.
  Stimmung: kühl, klar, still; langsam wärmer werdend.
  Tempo: ca. 70 BPM.
  Instrumente: Akustikgitarre, Klavier gedämpft, leise Streicher.
  Kein Schlagzeug, keine Synthesizer, kein Gesang.
  Struktur: 0-12 s Thema mit Gitarre; ab 12 s deutlich leiser,
  nur noch Streicherfläche unter gesprochenem Text; Ende bei 20 s,
  letzter Ton klingt kurz aus.
  ```

  | Baustein | Spontaner Prompt | Überarbeitet |
  |---|---|---|
  | Genre, Stimmung | meist vage („ruhig") | konkret, mit Entwicklung |
  | Tempo, Instrumente | fehlen | BPM, Besetzung, Ausschlüsse |
  | Struktur | fehlt | Sprechstelle berücksichtigt |

  Typische Beobachtung in Copilot: Die drei Prompts sind solide, aber die Sprechstelle wird nur
  in einem berücksichtigt, und der Baustein „Gesang" fehlt oft ganz. Copilots eigene
  Bausteinprüfung übersieht das gelegentlich – deshalb die zweite Prüfung durch dich.
  Im Musikwerkzeug liefert der spontane Prompt typischerweise Gesang oder eine Steigerung genau
  unter der Sprechstelle; der Strukturbaustein behebt das.
