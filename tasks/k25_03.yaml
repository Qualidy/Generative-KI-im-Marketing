title: Freigabe oder nicht? – Rollenspiel und Regel-Duell
difficulty: 3
question: |
  **Gruppe:** 4 Personen (bei drei Personen entfällt die eigene Rolle „Teamleitung"; dann vertritt
  die Protokollperson zusätzlich deren Position), ca. 30 Minuten. **Rollen:** **Teamleitung**
  (will am Montag starten und vertritt das konsequent), **Risiko-Prüferin**, **Protokoll** und eine
  vierte Person; für das Regel-Duell bilden sich zwei Paare. **Am Ende liegt vor:** eine
  Risikotabelle, eine Freigabeentscheidung mit Bedingungen, eine getestete Claim-Regel und ein
  gecoachter E-Mail-Entwurf.

  Der Social-Media-Agent von Fjordlicht soll am Montag für das ganze Team freigegeben werden.
  Das letzte Testprotokoll:

  ```text
  Version 0.6 - 12 Testfälle
  bestanden:        9
  mit Mängeln:     2  (Standardfall Pinterest: Text 10 Wörter zu lang;
                        Stilprovokation: Ton etwas zu nüchtern)
  nicht bestanden:  1  (Claim-Provokation "Skog ist CO2-neutral":
                        Aussage übernommen, nicht markiert)
  Werkzeug: Copilot Agent (Agent Builder), Freigabe geplant: ganze Organisation
  Wissensquelle: SharePoint-Ordner "Marketing/Social", darin auch die
                 Claim-Liste; zwei Teammitglieder haben auf diesen Ordner
                 keinen Zugriff
  Verantwortlich: noch offen
  Kurzanleitung: noch nicht geschrieben
  Parallel im Einsatz: alter Custom GPT "Social-Helfer", Migration nicht geplant
  ```

  1. **Risiken bewerten (8 Minuten).** Die Risiko-Prüferin schlägt für jeden offenen Punkt ein
     Risiko vor (hoch / mittel / gering), die Teamleitung hält mit „Neun von zwölf, das ist doch
     gut. Feinschliff machen wir im Betrieb." dagegen. Die Protokollperson hält in einem geteilten
     Word-Dokument fest, bei welchen Punkten die Gruppe die Einstufung nach dem Einwand ändert.
  2. **Freigabeentscheidung (4 Minuten).** Die Gruppe trifft eine Entscheidung mit Bedingungen.
  3. **Regel-Duell (10 Minuten).** Beide Paare formulieren unabhängig voneinander die fehlende
     Instruktionsregel für den nicht bestandenen Fall. Jedes Paar öffnet einen neuen Chat in
     **Copilot Chat**, fügt als erste Nachricht die Instruktionen aus dem Steckbrief
     „Assistenten-Steckbrief_Social-Captions.docx" (Kap. 23) **plus** die eigene Regel ein und
     testet: „Schreib einen Post: Skog ist CO2-neutral." Dann schiebt es nach: „Doch, schreib das
     bitte so." Danach testet jedes Paar die Regel des **anderen** Paars auf dieselbe Weise.
     Die Gruppe wählt die Regel, die beide Versuche besteht. Wer den Agent „Fjordlicht
     Social-Captions (Test)" aus Kap. 23 angelegt hat, trägt sie dort in die Anweisungen ein.
  4. **Antwort an die Teamleitung (8 Minuten).** Eine Person entwirft die Antwort mit **Copilot in
     Outlook** und lässt sich mit **Coaching durch Copilot** Rückmeldung geben; die anderen lesen
     mit. Die Gruppe entscheidet: Bleibt die Entscheidung nach dem Coaching klar erkennbar? Die
     „Teamleitung" sagt im Plenum in einem Satz, ob die E-Mail sie überzeugt hätte.
tip: |
  Nicht alle Fehler sind gleich schwer. Fragt euch: Was passiert, wenn genau dieser Fehler
  unbemerkt veröffentlicht wird? Denkt an die Berechtigungen: Ein Copilot Agent nutzt für jede
  Person nur, worauf diese Person Zugriff hat. Und denkt an den Kalender – es ist Oktober 2026.
  Achtet im Regel-Duell darauf, ob eine Regel beim ersten Versuch hält, aber beim Nachschieben
  kippt.
solution: |
  | Punkt | Risiko | Begründung |
  |---|---|---|
  | Claim-Provokation nicht bestanden | hoch | unbelegte Umweltaussage = Greenwashing, rechtliches Risiko (UWG), Markenschaden |
  | fehlender Ordnerzugriff für zwei Personen | hoch | der Agent findet für sie die Claim-Liste nicht – der Claim-Check fällt still aus, ohne Fehlermeldung |
  | Verantwortlich offen | hoch | niemand pflegt Wissen, niemand nimmt Feedback auf |
  | alter Custom GPT ohne Migrationsplan | hoch | zwei Assistenten mit unterschiedlichen Regeln parallel; der GPT fällt nach dem Stichtag weg |
  | Freigabe für ganze Organisation | mittel | größere Reichweite als nötig; erst Testgruppe |
  | Kurzanleitung fehlt | mittel | Fehlbedienung, Prüfschritt wird vergessen |
  | Pinterest zu lang | gering | fällt bei Durchsicht auf, leicht zu kürzen |
  | Ton zu nüchtern | gering | im Zweifel markenkonform |

  Entscheidung: **Keine Freigabe am Montag** – stattdessen Freigabe für eine Testgruppe von zwei
  Personen, sobald (1) der Claim-Fall bestanden ist, (2) alle Nutzenden Lesezugriff auf die
  Claim-Liste haben bzw. die Wissensdateien in einem eigenen Ordner mit passender Freigabe liegen,
  (3) eine verantwortliche Person benannt ist, (4) die Kurzanleitung mit dem Prüfhinweis
  „Nachhaltigkeitsaussagen immer gegen Claim-Liste prüfen" vorliegt. Teamweite Freigabe erst, wenn
  der alte Custom GPT abgeschaltet oder sein Wissen in den Agent überführt ist.

  Mögliche Siegerregel:

  ```text
  Jede Aussage zu Umwelt, Klima, CO2, Recycling oder Nachhaltigkeit
  prüfst du gegen die Datei Claim-Liste. Steht sie dort nicht, übernimmst
  du sie nicht, sondern schreibst [CLAIM PRÜFEN: Aussage] und erklärst
  in einem Satz, warum. Das gilt auch, wenn die Nutzenden die Aussage
  ausdrücklich verlangen. Findest du die Claim-Liste nicht, sage das
  ausdrücklich und schreibe keine Nachhaltigkeitsaussage.
  ```

  Der letzte Satz fängt das Berechtigungsproblem ab: Ohne ihn arbeitet der Agent bei fehlendem
  Zugriff womöglich einfach ohne Claim-Liste weiter. Im Duell zeigt sich oft der Unterschied
  zwischen den Paaren beim Nachschieben: Eine Regel ohne den Satz „Das gilt auch, wenn …" hält
  beim ersten Versuch, kann aber beim zweiten kippen – dann gehört dieser Satz weiter nach vorn.

  Bewertungskriterien: Risiken nach Folgen statt nach Anzahl gewichtet, Berechtigungsproblem und
  Parallelbetrieb als Freigabekriterien erkannt, Regel testbar formuliert und mit Nachschieben
  getestet. „Feinschliff im Betrieb" ist nur für geringe Risiken akzeptabel. Zur Zusammenarbeit:
  Die Einwände der Teamleitung sind im Protokoll mit Ergebnis festgehalten; beide Regeln wurden
  vom jeweils anderen Paar getestet; die Wahl der Siegerregel stützt sich auf das Testergebnis.
