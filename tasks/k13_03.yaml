title: Nurture-Sequenz für Fjordlicht Business mit Page und Outlook
difficulty: 3
question: |
  Fjordlicht Business bietet Firmenbekleidung für Unternehmen an. Wer auf der Website die
  Checkliste „Teamausstattung für Außeneinsätze" herunterlädt, soll eine Nurture-Sequenz erhalten.

  **Gruppe:** 4 Personen · **Dauer:** ca. 30 Minuten · **Aufteilung:** eine Person erstellt den
  Plan, danach schreibt jede Person eine der vier Mails; eine Person ist zusätzlich Advocatus
  Diaboli · **Am Ende liegt vor:** eine geteilte Copilot Page mit Plan, vier Mail-Entwürfen,
  Kritikpunkten und den Antworten zu Personalisierung und Recht.

  1. **Plan:** Person 1 lässt in **Copilot Chat** per Prompt-Kette einen **Plan** für vier Mails
     erstellen (Abstand, Ziel, Kernbotschaft, CTA), mit Verweis auf `/Fjordlicht-Basisdaten`. Sie
     übernimmt den Plan in eine **Copilot Page** und teilt sie mit der Gruppe.
  2. **Kritik am Plan:** Der Advocatus Diaboli prüft den Plan zuerst und schreibt seine Einwände
     direkt in die Page: Wird zu früh verkauft? Wiederholen sich Kernbotschaften? Passt der Ton zu
     Einkauf, Arbeitssicherheit und Geschäftsführung? Die Gruppe entscheidet, welche Einwände sie
     in den Plan übernimmt.
  3. **Arbeitsteilung:** Jede Person schreibt **eine** Mail als neuen E-Mail-Entwurf in
     **Outlook** mit Copilot und passt Ton und Länge mit Copilot an, bis die Mail zu
     B2B-Entscheidern passt. Nichts wird gesendet. Den fertigen Text fügt jede Person unter
     „Mail 1" bis „Mail 4" in die Page ein.
  4. **Gemeinsames Lesen:** Lest die vier Mails hintereinander. Passt der Ton zusammen, obwohl vier
     Personen geschrieben haben? Wo wiederholt sich etwas? Gleicht die Unterschiede in der Page an.
  5. **Personalisierung (gemeinsam):** Welche Platzhalter sind sinnvoll (z. B. [Firmenname],
     [Branche]), welche Fallbacks braucht ihr – und warum gehören echte Kundendaten auch dann
     **nicht** in den Prompt, wenn Copilot im Arbeitsmodus mit Enterprise Data Protection läuft?
  6. **Recht:** Nennt die rechtliche Voraussetzung, damit die Sequenz überhaupt verschickt werden
     darf. Eine Person stellt im Plenum in zwei Minuten Plan und eine Mail vor.
tip: |
  B2B-Nurturing hat einen längeren Atem als B2C. Die erste Mail liefert, was versprochen wurde
  (die Checkliste), die letzte lädt zu einem Gespräch ein – dazwischen liegt Nutzen, nicht Werbung.
  Weil vier Personen mit vier eigenen Copilot-Entwürfen arbeiten, achtet darauf, ob die Mails in
  Anrede, Länge und Ton auseinanderlaufen – vereinbart vor Schritt 3 kurz eine gemeinsame
  Vorgabe (z. B. „sachlich, Du-Ansprache, max. 120 Wörter").
solution: |
  Beispielprompt für den Plan:

  ```text
  Entwirf den Plan einer Nurture-Sequenz mit 4 Mails für Fjordlicht Business.
  Auslöser: Download der Checkliste "Teamausstattung für Außeneinsätze".
  Zielgruppe: Einkauf, Arbeitssicherheit, Geschäftsführung kleiner und
  mittlerer Betriebe. Fakten und Markenstimme: /Fjordlicht-Basisdaten.
  Tabelle: Mail, Abstand in Tagen, Ziel, Kernbotschaft, CTA.
  Jede Kernbotschaft nur einmal. Kauf-CTA frühestens in der letzten Mail.
  Keine erfundenen Kundenbeispiele, keine Rabatte.
  ```

  Möglicher Plan:

  | Mail | Abstand | Ziel | Kernbotschaft | CTA |
  |---|---|---|---|---|
  | 1 | sofort | Versprechen einlösen | hier ist die Checkliste, so nutzt du sie | Checkliste öffnen |
  | 2 | 3 Tage | Kompetenz | worauf es bei Wetterschutz im Arbeitsalltag ankommt | Ratgeber lesen |
  | 3 | 7 Tage | Vertrauen | wie ein Handwerksbetrieb seine Teamausstattung umgestellt hat (nur mit Freigabe des Kunden) | Fallbeispiel lesen |
  | 4 | 12 Tage | Gespräch | individuelle Beratung zu Größen, Logo, Nachbestellung | Termin vereinbaren |

  Mögliche Einwände des Advocatus Diaboli: ein Kauf-CTA schon in Mail 2, ein erfundenes
  Kundenbeispiel mit Firmennamen oder versprochene Mengenrabatte. Ein Fallbeispiel darf nur mit
  echtem, freigegebenem Kunden verwendet werden. Beim Anpassen des Tons in Outlook kann
  „formeller" zu „steif" werden – hier hilft eine konkrete Anweisung wie „sachlich,
  Du-Ansprache beibehalten, max. 120 Wörter".

  Personalisierung: [Firmenname] und [Branche] sind sinnvoll, Fallback jeweils eine neutrale
  Formulierung („dein Team"). Enterprise Data Protection bedeutet, dass Eingaben im
  Microsoft-365-Mandanten bleiben und nicht zum Training genutzt werden – es ändert nichts an
  Datenminimierung und Zweckbindung (Kap. 4). Copilot schreibt die Vorlage, das Newsletter- oder
  Marketing-Automation-Tool setzt die Daten ein. Echte Firmen- und Personennamen, E-Mail-Adressen
  oder CRM-Exporte gehören nicht in den Prompt.

  Rechtlich: Eine vorherige ausdrückliche Einwilligung in den Erhalt der Mails ist nötig,
  üblicherweise per Double-Opt-in beim Download – auch im B2B-Bereich. Der Download allein ist
  keine Einwilligung in Werbung, wenn das nicht klar erkennbar abgefragt wurde. Im Zweifel klärt
  das die Rechtsabteilung.

  Bewertungskriterien: Plan und Mails getrennt erstellt, Plan in einer geteilten Page, Ton in
  Outlook gezielt angepasst, mindestens zwei kritische Befunde benannt, Platzhalter mit
  Fallbacks, Einwilligung korrekt beschrieben; zur Zusammenarbeit: jede Person hat eine Mail
  verantwortet, die Einwände des Advocatus Diaboli sind in der Page sichtbar und begründet
  angenommen oder verworfen, und Unterschiede in Ton und Länge zwischen den vier Mails wurden
  benannt und angeglichen.
