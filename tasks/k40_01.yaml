title: Mensch, KI oder beides?
difficulty: 1
question: |
  Im Marketingteam von Fjordlicht fallen die folgenden Aufgaben an. Ordne jede zu:
  **KI übernimmt den Entwurf, Mensch prüft**, **Mensch und KI im Wechsel** oder **bleibt beim
  Menschen**. Begründe jeweils in einem Satz.

  1. 20 Betreffzeilen-Varianten für den Newsletter
  2. Entscheidung, ob die Winterkampagne verschoben wird
  3. Antwort auf einen öffentlichen Shitstorm-Kommentar auf Instagram
  4. Anpassung eines Blogartikels in Captions für LinkedIn, Instagram und Pinterest
  5. Freigabe eines KI-Bildes für die Startseite
  6. Auswertung von 600 Kundenbewertungen nach Themen
  7. Festlegen der Markenstimme für die neue B2B-Linie
tip: |
  Frage dich bei jeder Aufgabe: Wie teuer ist ein Fehler, und wer muss ihn verantworten? Je höher
  das Risiko und je stärker es um Urteil statt um Varianten geht, desto mehr bleibt beim Menschen.
solution: |
  | Nr. | Zuordnung | Begründung |
  |---|---|---|
  | 1 | KI-Entwurf, Mensch prüft | Varianten sind die Stärke der KI, Auswahl und Test bleiben menschlich |
  | 2 | bleibt beim Menschen | strategische Entscheidung mit Verantwortung; KI kann Argumente sammeln |
  | 3 | Mensch und KI im Wechsel | KI kann Entwürfe liefern, Ton und Freigabe in der Krise entscheidet ein Mensch |
  | 4 | KI-Entwurf, Mensch prüft | klassische Content-Adaption (Kap. 14) |
  | 5 | bleibt beim Menschen | Rechte, Kennzeichnung, Markenwirkung (Kap. 34, 39) |
  | 6 | KI-Entwurf, Mensch prüft | Themenanalyse geht schnell, Stichproben gegenlesen (Kap. 19) |
  | 7 | Mensch und KI im Wechsel | KI hilft beim Extrahieren und Variieren, die Festlegung ist Markenarbeit |

  Das Muster: KI übernimmt Masse und Varianten, Menschen übernehmen Urteil, Freigabe und alles,
  wofür jemand geradestehen muss. Ganz ohne KI-Unterstützung bleibt fast nichts – ganz ohne Menschen
  aber auch nicht.
