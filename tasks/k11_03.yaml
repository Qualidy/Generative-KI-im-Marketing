title: Page oder Word? Ein Werkzeugvergleich in zwei Teams
difficulty: 3
question: |
  Das Fjordlicht-Marketingteam (fünf Personen) schreibt längere Texte bisher in Copilot Chat und
  kopiert die Antworten dann irgendwohin. Die Teamleitung fragt, wo längere Texte künftig
  entstehen sollen: in **Copilot Pages** oder in **Word mit Copilot**. Ihr testet das als
  Gruppen-Duell.

  **Gruppe:** 4 Personen in zwei Paaren (Team Page, Team Word) · **Dauer:** ca. 30 Minuten ·
  **Am Ende liegt vor:** eine gemeinsame Bewertungstabelle in einem geteilten Word-Dokument und
  eine Empfehlung in höchstens fünf Sätzen.

  1. **Gleiche Aufgabe, zwei Werkzeuge:** Beide Paare erstellen die Rohfassung eines
     Blog-Absatzes zur Wanderhose „Vidde" (ca. 200 Wörter) auf Basis von `/Fjordlicht-Basisdaten`,
     überarbeiten danach gezielt den Einstieg und kürzen den Text um ein Drittel.
     - **Team Page:** Entwurf, Überarbeitung des Einstiegs und Kürzung entstehen per Prompt in
       Copilot Chat; die Ergebnisse übernehmt ihr in eine Copilot Page und bearbeitet sie dort zu
       zweit weiter.
     - **Team Word:** Entwurf mit Copilot in einem neuen Dokument im Ordner „Fjordlicht-Kurs",
       „Änderungen nachverfolgen" einschalten, den Einstieg markieren und mit Copilot umschreiben
       lassen. Für die Kürzung lasst ihr euch in Copilot Chat mit `/`-Verweis auf das Dokument
       eine gekürzte Fassung erstellen und setzt sie mit eingeschalteter Änderungsverfolgung ein.
  2. **Austausch:** Jedes Paar teilt sein Ergebnis mit dem anderen Paar. Das andere Paar
     bearbeitet zwei Stellen im fremden Ergebnis und prüft, wie gut sich nachvollziehen lässt,
     **wer** **was** geändert hat.
  3. **Bewertung:** Legt ein geteiltes Word-Dokument an und bewertet beide Werkzeuge in einer
     Tabelle nach mindestens fünf Kriterien, darunter **Kontrolle über Änderungen**,
     **Nachvollziehbarkeit**, **Zusammenarbeit** und **Freigabe/Datenschutz im Team**. Jedes Paar
     füllt zuerst die Spalte des eigenen Werkzeugs, dann ergänzt das andere Paar Widerspruch per
     Kommentar.
  4. **Gruppenentscheidung:** Formuliert eine Empfehlung in höchstens fünf Sätzen – und begründet,
     warum die Empfehlung **nicht** an einer einzelnen Funktion hängen sollte. Ein Paar stellt sie
     im Plenum in zwei Minuten vor.
tip: |
  Komfort ist schnell beurteilt, Kontrolle nicht. Achtet bei der Kürzung darauf, ob Inhalte
  wegfallen, die ihr behalten wolltet – in Word zeigt die Änderungsverfolgung das, in der Page
  müsst ihr selbst vergleichen. Beim Datenschutz unterscheiden sich Page und Word kaum: Beide
  liegen im Microsoft-365-Mandanten, Copilot arbeitet mit Enterprise Data Protection und sieht nur,
  worauf die jeweilige Person Zugriff hat (Kap. 4). Der Unterschied liegt eher darin, **wo** die
  Datei liegt und **wer** sie sieht, wenn ihr sie teilt.
solution: |
  Beispielhafte Bewertung (Ergebnisse variieren je nach Test):

  | Kriterium | Copilot Page | Word mit Copilot |
  |---|---|---|
  | Gezielte Überarbeitung | über Folgeprompts im Chat, Ergebnis wird übernommen | markierte Stelle direkt mit Copilot umschreiben |
  | Nachvollziehbarkeit von Änderungen | Unterschiede muss man selbst vergleichen | „Änderungen nachverfolgen" zeigt jede Ersetzung mit Person |
  | Kürzung ohne Inhaltsverlust | Pflegehinweis unbemerkt gestrichen | Streichung als Änderung sichtbar, zurückgenommen |
  | Zusammenarbeit | schnell geteilt, gemeinsames Bearbeiten | gemeinsames Bearbeiten, Kommentare, vertrauter Freigabeweg |
  | Weiterverwendung | Inhalt bleibt neben dem Chat, lässt sich teilen | Datei per `/` in späteren Prompts referenzierbar, Grundlage für PowerPoint |
  | Freigabe und Datenschutz | im Mandanten, Teilen bewusst steuern | im Mandanten, Ordnerberechtigungen gelten |

  Mögliche Empfehlung: „Ideen, Gliederungen und frühe Entwürfe sammeln wir in Copilot Pages, weil
  das Team dort schnell gemeinsam weiterarbeitet. Texte, die in die Freigabe gehen, landen in Word
  mit eingeschalteter Änderungsverfolgung. Verbindlich für alle werden der Dreischritt Rohfassung,
  Struktur, Feinschliff und die Regel, jede Überarbeitung auf markierte Stellen zu begrenzen und
  eine Änderungsliste zu verlangen. Funktionen ändern sich – Canvas wurde nach weniger als zwei
  Jahren entfernt. Deshalb verankern wir das Vorgehen in unserer Prompt-Bibliothek (Kap. 10), nicht
  in einer Bedienanleitung."

  Bewertungskriterien: beide Paare haben dieselbe Aufgabe tatsächlich getestet, mindestens fünf
  Kriterien inklusive Datenschutz und Zusammenarbeit, eine Empfehlung, die den Einsatzzweck
  unterscheidet und das Arbeitsprinzip statt einer Funktion festschreibt; zur Zusammenarbeit:
  jedes Paar hat im Ergebnis des anderen gearbeitet, Widersprüche zur Bewertung sind als
  Kommentare sichtbar und in der Empfehlung aufgelöst, und Unterschiede zwischen den beiden
  Rohfassungen wurden benannt.
