title: Betreff und Preheader im Paar beurteilen und verbessern
difficulty: 1
question: |
  **Gruppe:** Paare oder 3 Personen · **Dauer:** ca. 15 Minuten · **Aufteilung:** erst allein
  urteilen, dann vergleichen; alle führen denselben Prompt aus · **Am Ende liegt vor:** eine
  gemeinsame Bewertung der fünf Paare und ein ausgewähltes Ersatzpaar für Paar 4.

  Beurteilt die folgenden Paare aus Betreffzeile und Preheader für den Fjordlicht-Newsletter.

  1. Betreff: `MEGA-DEAL!!! Nur heute!` – Preheader: `Nur heute!`
  2. Betreff: `Re: Deine Bestellung` – Preheader: `Neue Herbstkollektion entdecken`
  3. Betreff: `Perlt der Regen noch ab?` – Preheader: `Wenn nicht, liegt es selten an der Jacke.`
  4. Betreff: `Die nachhaltigste Jacke der Welt` – Preheader: `Mail im Browser ansehen`
  5. Betreff: `Hallo [Vorname], dein Pflegeplan` – Preheader: (leer)

  1. **Allein:** Jede Person nennt für jedes Paar das Hauptproblem (oder „passt") und ob ein
     Spam-Signal oder ein Verstoß gegen die Markenstimme (ruhig, ehrlich, keine Superlative)
     vorliegt. Danach vergleicht ihr und einigt euch auf eine gemeinsame Bewertung.
  2. **Gleicher Prompt, mehrere Ergebnisse:** Jede Person gibt die Paare in ihren eigenen
     **Copilot Chat** ein und lässt sie nach denselben Kriterien beurteilen, mit Verweis auf
     `/Fjordlicht-Basisdaten`. Vergleicht: Kommen eure Copilot-Antworten zum selben Urteil? Was
     hat Copilot übersehen, was habt ihr übersehen?
  3. **Ersatz für Paar 4:** Jede Person lässt Copilot drei bessere Fassungen mit unterschiedlichen
     Ansätzen (Nutzen, Frage, Konkretheit) vorschlagen. Die jeweils andere Person prüft die
     Vorschläge gegen die belegten Claims. Aus allen geprüften Fassungen wählt ihr gemeinsam
     **eine** aus und begründet die Wahl in einem Satz.
tip: |
  Prüft drei Dinge: Ergänzt der Preheader den Betreff? Ist der Betreff ehrlich zum Inhalt? Gibt
  es Platzhalter, die ohne Fallback zu einem Fehler führen können? Achtet darauf, ob Copilot das
  Fallback-Problem in Paar 5 von sich aus erwähnt – und ob das in allen eurer Antworten gleich ist.
  Wenn nicht, fragt ausdrücklich nach.
solution: |
  | Nr. | Hauptproblem | Spam-Signal / Markenstimme |
  |---|---|---|
  | 1 | Großbuchstaben, Ausrufezeichen, Preheader wiederholt Betreff | beides: Spam-Signal und gegen die Markenstimme |
  | 2 | irreführender Betreff, es gibt keine Bestellung | Spam-Signal und rechtlich riskant (Irreführung) |
  | 3 | passt | keins; Preheader ergänzt den Betreff |
  | 4 | Superlativ und unbelegte Nachhaltigkeitsaussage; Preheader nicht gesetzt | gegen Markenstimme, Greenwashing-Risiko |
  | 5 | Platzhalter ohne Fallback, leerer Preheader zeigt beliebigen Text | Datenrisiko („Hallo ,") |

  Beispielprompt für Schritt 3:

  ```text
  Formuliere 3 Paare aus Betreff (max. 45 Zeichen) und Preheader
  (max. 90 Zeichen) für einen Newsletter zur Regenjacke Sølv.
  Ansätze: Nutzen, Frage, Konkretheit. Nutze nur die belegten Claims aus
  /Fjordlicht-Basisdaten. Keine Superlative, keine Ausrufezeichen.
  Der Preheader wiederholt den Betreff nicht.
  ```

  Mögliche Auswahl:

  ```text
  Betreff: Die Sølv: Regenjacke aus recyceltem Polyamid
  Preheader: Was das Material kann und wie du es lange nutzt.
  ```

  Achtet darauf, ob in einer der Fassungen „Obermaterial zu 100 % aus recyceltem Polyamid" zu
  „komplett recycelt" oder „nachhaltig" verkürzt wurde – solche Vorschläge fallen bei der
  gegenseitigen Prüfung heraus. Merke: Der Preheader ist ein eigener Baustein. Bleibt er leer,
  entscheidet das Postfach, was angezeigt wird.

  Bewertungskriterien: alle fünf Paare mit Hauptproblem bewertet, Fallback-Problem erkannt,
  ausgewähltes Ersatzpaar ohne Superlativ und ohne verkürzten Claim; zur Zusammenarbeit:
  Einzelurteile entstanden vor dem Vergleich, Unterschiede zwischen den Copilot-Antworten der
  Gruppenmitglieder wurden benannt, die Vorschläge wurden gegenseitig geprüft, und die Auswahl ist
  eine begründete Gruppenentscheidung.
