title: Kamerabewegung und Arbeitsweise zuordnen – gleicher Prompt, mehrere Antworten
difficulty: 1
question: |
  **Gruppenarbeit:** 3–4 Personen, etwa 20 Minuten. Eine Person führt das **Protokoll** in einer
  geteilten Copilot Page. **Am Ende liegt vor:** eine gemeinsame Zuordnungstabelle und ein
  strittiger Fall, den ihr im Plenum in einer Minute vorstellt.

  Ordnet jeder Anforderung aus dem Fjordlicht-Marketing **eine Kamerabewegung** aus Abschnitt
  35.3 und **eine Arbeitsweise** zu (Text-zu-Video, Bild-zu-Video oder Video-zu-Video/Bearbeitung).

  1. Der Rucksack „Tind" soll von allen Seiten gezeigt werden – auf Basis eines vorhandenen
     Produktfotos.
  2. Ein Reel soll mit einer weiten Fjordlandschaft beginnen, die Ruhe und Weite vermittelt.
  3. Eine Wanderin in der Hose „Vidde" soll beim Aufstieg begleitet werden, dynamisch, aber
     nicht hektisch.
  4. In einem selbst gedrehten Clip aus dem Fotoshooting stört ein Mülleimer im Hintergrund.
  5. Ein Detail der Regenjacke „Sølv" (abperlende Tropfen) soll langsam näher rücken.

  So geht ihr vor:

  1. **Erst jede Person allein.** Notiert eure Zuordnung in Stichworten, ohne KI (drei Minuten).
  2. **Gleicher Prompt, mehrere Ergebnisse.** Einigt euch auf **einen** Prompt (Vorlage in der
     Lösung) mit den fünf Anforderungen und den beiden Tabellen aus Abschnitt 35.1 und 35.3. Jede
     Person führt diesen Prompt in ihrem eigenen Copilot Chat (Modus **Arbeit**) aus.
  3. **Vergleichen.** Legt die Antworten nebeneinander: Bei welchen Nummern sind sich alle
     Copilot-Antworten einig, wo weichen sie voneinander ab? Wo weichen sie von euren eigenen
     Notizen ab? Achtet besonders darauf, ob eine der Antworten bei vorhandenem Material trotzdem
     Text-zu-Video vorschlägt.
  4. **Gemeinsam entscheiden.** Die Protokollperson übernimmt eine der Copilot-Antworten in eine
     Copilot Page und teilt sie mit der Gruppe. Korrigiert die Tabelle dort gemeinsam, bis ihr
     euch je Nummer einig seid, und ergänzt bei jeder Korrektur einen Satz Begründung.
tip: |
  Fragt bei der Arbeitsweise zuerst: Gibt es schon echtes Material, das wir kontrollieren wollen?
  Wenn ja, ist reines Text-zu-Video fast nie die erste Wahl. Dass dieselbe Anfrage bei euch
  unterschiedlich beantwortet wird, ist kein Fehler, sondern genau der Punkt: Copilot wählt nach
  Wahrscheinlichkeit. Wo die Antworten auseinandergehen, liegt meist die Stelle, an der ihr selbst
  entscheiden müsst.
solution: |
  Beispiel-Prompt für Copilot Chat (alle Gruppenmitglieder identisch):

  ```text
  Du bist Videoproducer für kurze Social-Clips.
  Ordne jeder der fünf Anforderungen unten genau eine Kamerabewegung und
  genau eine Arbeitsweise zu. Nutze nur diese Begriffe:
  Kamerabewegungen: Static shot, Pan, Tilt, Dolly in/out, Tracking shot,
  Orbit, Drone/aerial shot, Handheld.
  Arbeitsweisen: Text-zu-Video, Bild-zu-Video, Video-zu-Video/Bearbeitung.
  Regel: Wenn echtes Material vorhanden ist, begründe ausdrücklich, warum
  du es nutzt oder nicht nutzt.
  Ausgabe: Tabelle mit Nr., Kamerabewegung, Arbeitsweise, Begründung (1 Satz).
  [Anforderungen 1 bis 5 einfügen]
  ```

  Beispiel für die gemeinsame Tabelle in der Copilot Page:

  | Nr. | Kamerabewegung | Arbeitsweise | Begründung |
  |---|---|---|---|
  | 1 | Orbit | Bild-zu-Video | Das echte Produktfoto sichert die Details, der Orbit zeigt das Produkt rundum. |
  | 2 | Drone/aerial shot, ggf. langsamer Pan | Text-zu-Video | Landschaft ohne Produkt – hier spielt Text-zu-Video seine Stärke aus. |
  | 3 | Tracking shot | Bild-zu-Video (Startbild aus Shooting) oder echter Dreh | Die Kamera geht mit; das Startbild hält Hose und Person konsistent. |
  | 4 | – (bleibt wie gedreht) | Video-zu-Video/Bearbeitung | Vorhandenes Material wird nur retuschiert, nicht neu erzeugt. |
  | 5 | Dolly in | Bild-zu-Video | Langsames Heranfahren an ein geprüftes Detailfoto ist kontrollierbar. |

  Abweichungen, auf die ihr beim Vergleich achten solltet: Schlägt eine Antwort bei Nr. 3
  Text-zu-Video vor („eine Wanderin in einer Wanderhose"), würde die Hose erfunden. Nennt eine
  Antwort bei Nr. 4 eine Kamerabewegung, obwohl nichts neu gefilmt wird, passt das nicht zur
  Aufgabe. Bei Nr. 2 und 5 gehen die Kamerabewegungen zwischen den Antworten oft auseinander
  (Pan oder Drone, Dolly in oder Static shot mit Zoom) – das sind Geschmacksfragen, keine Fehler.
  Ein guter strittiger Fall fürs Plenum ist Nr. 3: Bild-zu-Video oder doch ein echter Dreh, wenn
  die Person in mehreren Einstellungen vorkommen soll?

  Achtet bei Nr. 1 und 5 darauf, dass das Produkt im Ergebnis Bild für Bild geprüft wird:
  Auch beim Animieren können Nähte, Riemen oder Farben verändert werden.

  Bewertungskriterien: Alle fünf Nummern sind eindeutig zugeordnet und begründet; die
  Arbeitsweise folgt aus dem vorhandenen Material. Die Gruppe hat benannt, bei welchen Nummern
  die Copilot-Antworten der Mitglieder voneinander abwichen, und erklärt, ob es sich um
  Geschmack oder um einen sachlichen Fehler handelt. Die Copilot Page enthält die korrigierte
  Tabelle mit Begründung je Korrektur.
