title: Ein Zielgruppenprofil auf dem Prüfstand
difficulty: 3
question: |
  Eine Kollegin hat für „Fjordlicht Business" (Firmenbekleidung) in fünf Minuten folgendes Profil
  mit ChatGPT erstellt – ohne Daten, nur mit dem Prompt „Beschreibe die Zielgruppe für nachhaltige
  Firmenbekleidung":

  ```text
  Zielgruppe: Entscheiderinnen und Entscheider in modernen, nachhaltigkeits-
  orientierten Unternehmen (50-500 MA), meist HR- oder Marketingleitung,
  35-55 Jahre. 78 % der deutschen Unternehmen planen, ihre Arbeitskleidung
  bis 2027 auf nachhaltige Materialien umzustellen. Wichtigste Kriterien:
  Nachhaltigkeit, Corporate Design, Preis. Sie informieren sich vor allem
  auf LinkedIn und erwarten innovative Lösungen.
  ```

  1. Bewerte das Profil Satz für Satz: Was ist Vermutung, was eine ungeprüfte Zahl, was ist zu
     allgemein, um nutzbar zu sein?
  2. Erkläre, welche Bausteine des P.R.O.M.P.T.-Frameworks im Ausgangsprompt fehlten und warum das
     zu genau diesem Ergebnis führt.
  3. Entwirf einen **Analyseplan**: Welche drei Quellen nutzt Fjordlicht, welche KI-Schritte setzt
     ihr ein, und wie validiert ihr die Ergebnisse?
  4. Schreibe den Prompt für den ersten KI-Schritt deines Plans.
tip: |
  Achte besonders auf die Zahl. Sie ist präzise, hat keine Quelle und passt verdächtig gut zur
  Botschaft, die man gern hören möchte. Genau so sehen Halluzinationen in Zielgruppenprofilen aus.
solution: |
  1. Bewertung:

  | Aussage | Problem |
  |---|---|
  | Entscheider in „modernen, nachhaltigkeitsorientierten" Firmen | Zirkelschluss: beschreibt die gewünschte, nicht die tatsächliche Kundschaft |
  | HR- oder Marketingleitung, 35–55 | Vermutung; im Handwerk entscheidet oft Inhaber oder Einkauf |
  | „78 % … bis 2027" | ungeprüfte, vermutlich erfundene Zahl – nicht verwenden |
  | Kriterien Nachhaltigkeit, Design, Preis | plausibel, aber zu allgemein; Haltbarkeit, Nachbestellbarkeit, Größenspektrum fehlen |
  | LinkedIn, „innovative Lösungen" | Floskel ohne Handlungswert |

  2. Es fehlten **Persona** (Analyst statt Werbetexter), **Modifier** (keine Zahl ohne Quelle,
  Hypothesen markieren, Daten nutzen) und vor allem Material: Ohne Daten bleibt dem Modell nur der
  Durchschnitt. **Purpose** war nur angedeutet – wofür wird das Profil gebraucht?

  3. Analyseplan, zum Beispiel: (a) Anfragen und Angebote der letzten zwölf Monate aus dem CRM,
  pseudonymisiert, mit Branche, Größe, Anfrageanlass; (b) Gesprächsnotizen des Vertriebs;
  (c) Desk Research zu Firmenbekleidung mit Websuche, jede Zahl an der Quelle geprüft. KI-Schritte:
  Clustern der Anfragen, JTBD aus Gesprächsnotizen, Rechercheauftrag. Validierung: fünf Gespräche
  mit Bestandskunden, Abgleich mit dem Vertrieb.

  4. Erster Prompt:

  ```text
  Du bist B2B-Marktanalyst. Gruppiere die folgenden 40 pseudonymisierten
  Anfragen nach Branche, Unternehmensgröße und Anlass der Anfrage.
  Format: Tabelle Cluster | Anzahl | typischer Anlass | wörtliches Zitat.
  Regeln: Nur Daten unten, keine externen Annahmen; unklare Fälle als
  [UNKLAR]. Zweck: Grundlage für ein Zielgruppenbriefing Fjordlicht Business.
  Anfragen: """ [Daten] """
  ```
