title: Kommentare im Team klassifizieren, zählen und Stichprobe prüfen
difficulty: 2
question: |
  **Gruppe:** 3–4 Personen · **Dauer:** etwa 30 Minuten · **Format:** Rollen mit Wechsel ·
  **Am Ende liegt vor:** eine gemeinsame Excel-Datei „Listening-Test.xlsx" mit Klassifizierung,
  Auszählung und Übereinstimmungsquote sowie ein verbesserter Prompt.

  Die folgenden fiktiven Kommentare stammen aus Fjordlichts Instagram und TikTok, Nutzernamen sind
  bereits durch IDs ersetzt.

  ```text
  ID;Kanal;Text
  01;IG;Seit zwei Wintern im Einsatz, die Sølv hält wie am ersten Tag.
  02;TT;Recycelt, ja klar. Und ich bin der Weihnachtsmann.
  03;IG;Wann kommt die Vidde wieder in 34 kurz?
  04;IG;Bestellt am Montag, immer noch nicht da. Toll.
  05;TT;Endlich mal eine Marke, die nicht rumschreit.
  06;IG;Farbe ist im echten Leben viel blasser als auf dem Foto.
  07;TT;Gibt es die Skog auch für Kinder?
  08;IG;Super Service, Umtausch lief problemlos!
  09;TT;Ist das Futter auch recycelt oder nur außen?
  10;IG;Die Jacke von [Wettbewerber] war billiger, aber nach einem Jahr hin.
  11;TT;Schon wieder Werbung für Funktionsjacken, toll, genau was ich brauche.
  12;IG;Passt perfekt über den Fleece, danke für die Größenhilfe.
  ```

  **Rollen in Runde 1:** **Prompt-Verantwortliche** (Copilot Chat), **Tabellen-Verantwortliche**
  (Excel), **Prüferinnen** (eine oder zwei Personen, Einstufungen von Hand prüfen).

  1. **Klassifizieren in Copilot Chat:** Die Prompt-Verantwortliche fügt die Kommentare ein und
     nutzt den Prompt aus Abschnitt 19.3 mit dem Fjordlicht-Schema (Sentiment, Thema, Bezug,
     Handlungsbedarf). Das Ergebnis kommt als Tabelle. Den Teil des Prompts, der das Zählen mit
     Python verlangt, lasst ihr weg – gezählt wird in Excel.
  2. **Gemeinsame Datei:** Die Tabellen-Verantwortliche legt im eigenen OneDrive-Ordner
     „Fjordlicht-Kurs" die Datei „Listening-Test.xlsx" an, übernimmt die Tabelle, formatiert sie
     als Tabelle und teilt die Datei mit der Gruppe.
  3. **Stichprobe aufteilen:** Die Prüferinnen teilen die zwölf Kommentare unter sich auf und
     tragen in der geteilten Datei in einer Spalte „geprüft" ein: „ok" oder die korrekte
     Einstufung. Jede Abweichung bekommt einen Excel-Kommentar mit kurzer Begründung.
  4. **Zählen in Excel:** Die Tabellen-Verantwortliche lässt **Copilot in Excel** die Beiträge
     nach Sentiment und nach Thema auszählen und eine Formelspalte für die Übereinstimmung
     vorschlagen. Prüft die vorgeschlagene Formel, bevor ihr sie einfügt, und berechnet die
     Übereinstimmungsquote.

  **Rollentausch für Runde 2:** Eine Prüferin wird Prompt-Verantwortliche.

  5. Benennt gemeinsam die Fehlertypen. Die neue Prompt-Verantwortliche ergänzt den Prompt um
     zwei Few-Shot-Beispiele (Kap. 6), die genau diese Fehler verhindern, und testet ihn in einem
     **neuen Chat**. Die übrigen prüfen nur noch die Kommentare, die in Runde 1 falsch waren.
  6. **Abschluss:** Ihr entscheidet gemeinsam, ob der verbesserte Prompt gut genug für den
     Monatsbericht ist. Die Prompt-Verantwortliche speichert ihn in ihrer **Prompt Gallery**.
tip: |
  Das ist die Arbeitsteilung aus Abschnitt 19.3: Das Sprachmodell klassifiziert, gezählt wird in
  der Tabelle – nicht „im Kopf" des Chats. Kommentar 02, 04 und 11 sind die Prüfsteine: Ironie und
  Sarkasmus. Achtet außerdem auf 10 – der Kommentar handelt vom Wettbewerber, ist für Fjordlicht
  aber eher positiv. Copilot in Excel braucht Daten, die als Tabelle formatiert sind, in einer
  Datei in OneDrive oder SharePoint. Wenn die Prüferinnen bei einem Kommentar selbst uneins
  sind, ist das ein Hinweis, dass das Schema an dieser Stelle unscharf ist.
solution: |
  Erwartete Einstufung (Auszug der schwierigen Fälle):

  | ID | Sentiment | Thema | Bezug | Handlungsbedarf |
  |---|---|---|---|---|
  | 02 | negativ | Nachhaltigkeit | Fjordlicht | Antwort mit Beleg, Teamleitung informieren |
  | 04 | negativ | Lieferung | Fjordlicht | Weiterleitung Kundenservice |
  | 09 | neutral | Nachhaltigkeit | Fjordlicht | Antwort mit Fakten |
  | 10 | gemischt | Qualität | Wettbewerber | keiner (nicht öffentlich kommentieren) |
  | 11 | negativ oder unklar | Sonstiges | Kategorie allgemein | keiner |

  Beispiel-Prompt für Copilot in Excel:

  ```text
  Zähle die Beiträge in dieser Tabelle nach Sentiment und nach Thema und
  zeige das Ergebnis als zwei kleine Übersichtstabellen. Schlage außerdem
  eine Formelspalte vor, die 1 ausgibt, wenn die Spalte "geprüft" den Wert
  "ok" hat, sonst 0.
  ```

  Die Quote ergibt sich dann als Mittelwert dieser Spalte, z. B. 10 von 12 = 83 %.

  Mögliche Fehler im ersten Durchlauf, auf die die Prüferinnen achten: 04 und 11 als positiv
  eingestuft wegen „Toll"/„toll", 10 dem Bezug Fjordlicht zugeordnet. Eine Übereinstimmung von 9
  oder 10 von 12 klingt gut – bei 3.000 Beiträgen wären das aber Hunderte Fehleinstufungen.

  Ergänzung im Prompt:

  ```text
  Beispiele:
  "Bestellt am Montag, immer noch nicht da. Super." -> negativ, Lieferung
  (Ironie: positives Wort, negativer Inhalt)
  "Die Jacke von X ist nach einem Jahr hin." -> Bezug: Wettbewerber
  ```

  Wichtig sind außerdem die Kommentare 02 und 09: Beide betreffen die Recycling-Frage. Zwei Treffer in
  zwölf Kommentaren sind noch kein Trend, aber ein Thema, das das Team im Blick behält (Abschnitt
  19.5).

  Bewertungskriterien:

  - Die Zählung stammt aus Excel, nicht aus dem Chat; die Formel wurde vor dem Einfügen geprüft.
  - Alle zwölf Einstufungen sind von Hand geprüft, Abweichungen mit Kommentar begründet.
  - Die Fehlertypen sind benannt, die Few-Shot-Beispiele zielen genau darauf, und der zweite
    Durchlauf ist mit dem ersten verglichen.
  - Zusammenarbeit: Rollen wurden getauscht; Meinungsverschiedenheiten zwischen den Prüferinnen
    sind festgehalten und führten zu einer Schärfung von Schema oder Prompt.
