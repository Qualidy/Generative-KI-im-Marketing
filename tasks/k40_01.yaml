title: Mensch, Copilot oder beides? – Aufgaben gemeinsam sortieren
difficulty: 1
question: |
  **Gruppenarbeit:** 3–4 Personen, ca. 20 Minuten, in **Copilot Chat**. Am Ende liegt eine
  gemeinsame Zuordnung aller sieben Aufgaben vor, die ihr im Plenum in einer Minute erklären
  könnt.

  Im Marketingteam von Fjordlicht fallen die folgenden Aufgaben an:

  ```text
  1. 20 Betreffzeilen-Varianten für den Newsletter
  2. Entscheidung, ob die Winterkampagne verschoben wird
  3. Antwort auf einen öffentlichen Shitstorm-Kommentar auf Instagram
  4. Anpassung eines Blogartikels in Captions für LinkedIn, Instagram und Pinterest
  5. Freigabe eines KI-Bildes für die Startseite
  6. Auswertung von 600 Kundenbewertungen nach Themen
  7. Festlegen der Markenstimme für die neue B2B-Linie
  ```

  1. **Ausprobieren mit Arbeitsteilung:** Zwei Personen führen **denselben** Prompt für
     Aufgabe 1 (20 Betreffzeilen für einen Newsletter zur Regenjacke „Sølv") in ihrem eigenen
     Copilot Chat aus und vergleichen: Wie viele Vorschläge überschneiden sich, wie viele passen
     zur Markenstimme? Die anderen lassen Copilot Chat einen kurzen Blogabschnitt in drei
     Captions umwandeln (Aufgabe 4). Alle schätzen: Wie viel muss noch nachgearbeitet werden?
  2. **Erst allein, dann gemeinsam:** Jede Person ordnet alle sieben Aufgaben still für sich zu:
     **KI übernimmt den Entwurf, Mensch prüft**, **Mensch und KI im Wechsel** oder **bleibt beim
     Menschen**. Vergleicht danach und diskutiert nur die Aufgaben, bei denen ihr unterschiedlich
     entschieden habt.
  3. **Funktion zuordnen:** Nennt für jede Aufgabe, bei der KI beteiligt ist, die passende
     Copilot-Funktion – etwa Copilot Chat, Copilot in Outlook, Word oder Excel oder die
     Besprechungszusammenfassung von Copilot in Teams.
  4. **Abschluss:** Einigt euch auf die Aufgabe, bei der eure Meinungen am weitesten
     auseinanderlagen, und stellt im Plenum kurz vor, wie ihr entschieden habt.
tip: |
  Fragt euch bei jeder Aufgabe: Wie teuer ist ein Fehler, und wer muss ihn verantworten? Je höher
  das Risiko und je stärker es um Urteil statt um Varianten geht, desto mehr bleibt beim Menschen.
  Euer Eindruck aus Schritt 1 ist ein guter Prüfstein: Wo ihr viel nacharbeiten musstet, gehört
  mehr Urteil dazu. Achtet beim Vergleich der Betreffzeilen darauf, ob Superlative oder
  Ausrufezeichen auftauchen, die nicht zur Markenstimme passen.
solution: |
  Beispiel-Prompt für Aufgabe 1 (für beide Personen identisch):

  ```text
  Schlage 20 Betreffzeilen für einen Newsletter zur Regenjacke „Sølv" vor
  (100 % recyceltes Polyamid, 20.000 mm Wassersäule, 249 €). Halte dich an die
  Markenstimme aus /Fjordlicht-Basisdaten: ruhig, ehrlich, Du-Ansprache,
  keine Superlative. Höchstens 50 Zeichen pro Zeile.
  ```

  Beispiel-Prompt für Aufgabe 4:

  ```text
  Mache aus diesem Blogabschnitt drei Captions: LinkedIn (sachlich, 3 Sätze),
  Instagram (ruhig, mit Frage an die Community, 2–3 Hashtags), Pinterest
  (beschreibend, suchfreundlich). Halte dich an die Markenstimme aus
  /Fjordlicht-Basisdaten. Keine Superlative.
  [Abschnitt einfügen]
  ```

  | Nr. | Zuordnung | Begründung | Passende Copilot-Funktion |
  |---|---|---|---|
  | 1 | KI-Entwurf, Mensch prüft | Varianten sind die Stärke der KI, Auswahl und Test bleiben menschlich | Copilot Chat oder Copilot in Outlook |
  | 2 | bleibt beim Menschen | strategische Entscheidung mit Verantwortung; KI kann Argumente sammeln | Copilot in Teams (Zusammenfassung der transkribierten Abstimmung), Copilot Chat für Pro und Contra |
  | 3 | Mensch und KI im Wechsel | KI kann Entwürfe liefern, Ton und Freigabe in der Krise entscheidet ein Mensch | Copilot Chat |
  | 4 | KI-Entwurf, Mensch prüft | klassische Content-Adaption (Kap. 14) | Copilot Chat oder Word |
  | 5 | bleibt beim Menschen | Rechte, Kennzeichnung, Markenwirkung (Kap. 34, 39) | – (Copilot Chat höchstens für die Bildbeschreibung als zweite Meinung) |
  | 6 | KI-Entwurf, Mensch prüft | Themenanalyse geht schnell, Stichproben gegenlesen (Kap. 19) | Copilot in Excel |
  | 7 | Mensch und KI im Wechsel | KI hilft beim Extrahieren und Variieren, die Festlegung ist Markenarbeit | Copilot in Word |

  Mögliche Beobachtungen aus Schritt 1: Die beiden Betreffzeilen-Listen überschneiden sich nur
  teilweise – derselbe Prompt liefert unterschiedliche Varianten. Prüft, ob einzelne Zeilen
  Superlative oder Ausrufezeichen enthalten. Bei den Captions müssen Fakten in jedem Fall
  gegengelesen werden.

  Das Muster: KI übernimmt Masse und Varianten, Menschen übernehmen Urteil, Freigabe und alles,
  wofür jemand geradestehen muss. Ganz ohne KI-Unterstützung bleibt fast nichts – ganz ohne
  Menschen aber auch nicht.

  Bewertungskriterien:

  - Beide Mini-Tests wurden durchgeführt; Unterschiede zwischen den Betreffzeilen-Listen der
    zwei Personen sind benannt.
  - Alle sieben Aufgaben sind begründet zugeordnet; abweichende Einzelzuordnungen wurden
    diskutiert und aufgelöst.
  - Die genannten Copilot-Funktionen passen zur Aufgabe.
