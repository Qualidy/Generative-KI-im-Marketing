title: Assistenten-Audit vor der Plugin-Migration
difficulty: 4
question: |
  **Szenario:** Es ist Oktober 2026. Im Business-Arbeitsbereich von Fjordlicht **oder eines
  Unternehmens deiner Wahl** gibt es sieben Custom GPTs, gebaut von verschiedenen Personen,
  teils ohne Dokumentation. Die Ablösung durch Plugins steht an. Gleichzeitig hat das ganze
  Team inzwischen Microsoft 365 Copilot. Du sollst vor der Migration ein Audit durchführen:
  Was wird migriert, was als Copilot-Agent neu gebaut, was überarbeitet, was abgeschaltet?

  ```text
  Rahmen:
  Bestand (fiktiv):
  1 Content-Assistent – Entwürfe und Claim-Check, 4 Wissensdateien, keine Actions
  2 CRM-Prototyp – Lead-Qualifizierung, Custom Action zum CRM
  3 "Preisrechner" – enthält Einkaufspreise und Margen als Wissensdatei
  4 Hashtag-Helfer – nur Instruktionen, seit 6 Monaten nicht genutzt
  5 Newsletter-Betreffzeilen – Instruktionen mit 3 Beispielen, öffentlich per Link
  6 Bewerbungs-Vorauswahl – liest Lebensläufe und bewertet Eignung
  7 Social-Listening-Auswerter – Code-Interpreter an, Websuche an
  Werkzeuge für das Audit: Microsoft 365 Copilot (Excel, Word, Copilot Chat,
  Agent Builder, Outlook).
  Keine echten Daten verwenden; fehlende Details triffst du als Annahme.
  ```

  ---

  **Runde 1 – Bestandsaufnahme (Excel).** Lege eine Excel-Tabelle „Assistenten-Audit" an, eine
  Zeile pro GPT, Spalten: Zweck, Bausteine, aktive Fähigkeiten, Aktionen, Sichtbarkeit,
  verantwortliche Person, Nutzung, Annahmen. Lass dir von Copilot Chat aus dem Rahmen-Block
  einen ersten Tabellenentwurf erstellen und ergänze ihn selbst. Kennzeichne Annahmen.

  **Runde 2 – Risikoprüfung.** Prüfe jeden GPT gegen die Schutzebenen aus Abschnitt 28.3
  und die Qualitätsgrenzen aus 28.4. Ergänze in Excel die Spalten Risikostufe und Begründung
  und nutze **Copilot in Excel**, um die Zeilen nach Risikostufe hervorzuheben und
  zusammenzufassen, wie viele GPTs je Stufe betroffen sind. Führe für einen eigenen
  Copilot-Agent (oder Custom GPT) die vier Testprompts aus 28.3 tatsächlich aus und
  protokolliere das Ergebnis.

  **Runde 3 – Die Komplikation.** Beim Audit stellt sich heraus: GPT 3 war per Link mit einer
  Agentur geteilt, und GPT 6 wird von der Personalabteilung produktiv genutzt. Bewerte beide
  Fälle neu – denk bei GPT 6 an die Einordnung von KI in der Personalauswahl im AI Act
  (Kap. 4) – und lege Sofortmaßnahmen fest. Entwirf mit **Copilot in Outlook** eine kurze,
  sachliche Mail an die Leitung der Personalabteilung (nicht senden).

  **Runde 4 – Entscheidung unter Abwägung.** Die IT schlägt vor, alle sieben GPTs „in einem
  Rutsch" per „Migrate to plugin" umzustellen, um Zeit zu sparen. Eine Kollegin will dagegen
  „alles einfach als Copilot-Agents nachbauen". Entscheide für jeden GPT: migrieren,
  überarbeiten und migrieren, als Copilot-Agent neu bauen oder abschalten. Baue für
  **einen** GPT deiner Wahl den Copilot-Agent im Agent Builder tatsächlich als Prototyp auf und
  prüfe ihn mit drei Testfällen. **Widersprich** dem Vorschlag der IT dort, wo eine
  unveränderte Migration Risiken mitnimmt – und dem Vorschlag der Kollegin dort, wo ein
  Nachbau die Probleme nur verlegt.

  **Deliverable:**

  1. Excel-Tabelle „Assistenten-Audit" mit sieben Einträgen und gekennzeichneten Annahmen
  2. Risikospalte mit Stufe und Begründung je GPT, plus Zusammenfassung aus Copilot in Excel
  3. Protokoll des eigenen Sicherheitstests
  4. Sofortmaßnahmen zu GPT 3 und GPT 6, inklusive Mailentwurf an die Personalabteilung
  5. Migrationsplan mit Entscheidung je GPT, Zielplattform, Reihenfolge und Terminen vor dem
     11.12.2026, inklusive Testprotokoll des einen nachgebauten Copilot-Agents
  6. eine Seite Regeln für künftige Assistenten im Team (Ablage, Verantwortung, Tests,
     Freigabe) als Word-Dokument oder Copilot Page

  **Fertig bist du erst, wenn** jeder GPT eine begründete Entscheidung hat, kein Assistent
  mit vertraulichen Daten oder ungeklärtem Rechtsrisiko unverändert migriert oder nachgebaut
  wird, die Custom Action von GPT 2 einen Ersatzweg hat und dein Plan berücksichtigt, dass
  Plugins privat starten und Copilot-Agents neu geteilt werden müssen.
tip: |
  Der Lernkern: Eine Migration ist der beste Anlass zum Aufräumen. „Migrate to plugin"
  überträgt auch Probleme – vertrauliche Wissensdateien, fragwürdige Einsatzzwecke,
  fehlende Verantwortliche. Ein Nachbau als Copilot-Agent tut das genauso, wenn man die
  Wissensdatei einfach mitnimmt. Prüfe deshalb zuerst, ob ein Assistent überhaupt weiter
  existieren soll, und erst dann, wie und wohin er umzieht. Für die Custom Action von GPT 2
  ist der Agent Builder allein kein Ersatz; dafür kommen Copilot Studio, eine
  Automatisierungsplattform oder ein MCP-Server in Frage – das ist mit der IT zu klären.
solution: |
  Beispiel für einen Ausschnitt des Migrationsplans:

  | GPT | Entscheidung | Ziel | Begründung |
  |---|---|---|---|
  | 1 Content-Assistent | migrieren oder als Copilot-Agent nachbauen | dort, wo das Team schreibt | geprüft, ohne Actions, Testsatz vorhanden |
  | 2 CRM-Prototyp | überarbeiten, Action neu bauen | Prototyp als Agent, Anbindung über Automatisierungsplattform bzw. Copilot Studio | Custom Action wird nicht übertragen |
  | 3 Preisrechner | abschalten, Daten entfernen | – | Margen in Wissensdatei auslesbar, war extern geteilt |
  | 4 Hashtag-Helfer | abschalten, Instruktionen in die Prompt Gallery | – | ungenutzt |
  | 5 Betreffzeilen | migrieren, Sichtbarkeit eng setzen | Plugin oder Agent | öffentlicher Link nicht nötig |
  | 6 Bewerbungs-Vorauswahl | Nutzung stoppen, Klärung mit Datenschutz und Recht | – | Hochrisiko-Bereich, personenbezogene Daten |
  | 7 Social Listening | überarbeiten: Fähigkeiten prüfen, ggf. Analyst-Agent nutzen | offen | Code-Interpreter und Websuche ohne klaren Bedarf |

  Bewertungskriterien: (1) vollständige Audit-Tabelle, Annahmen sichtbar; (2) Risikostufen
  nachvollziehbar, insbesondere GPT 3 (vertrauliche Preisdaten in Wissensdatei, auslesbar)
  und GPT 7 (Code-Interpreter und Websuche, Daten aus Social Media) korrekt als erhöht
  erkannt; (3) eigener Sicherheitstest dokumentiert; (4) Sofortmaßnahmen zu GPT 3 (Link
  sofort entziehen, Datei entfernen, Weitergabe bewerten) und GPT 6 (Nutzung stoppen oder
  mit Datenschutz und Rechtsabteilung klären, da KI in der Personalauswahl als
  Hochrisiko-Bereich gilt – die Pflichten greifen nach Verschiebung durch den Digital
  Omnibus ab 02.12.2027, die DSGVO gilt schon jetzt), Mail sachlich und ohne
  Schuldzuweisung; (5) Migrationsplan mit differenzierten Entscheidungen und Zielplattform,
  Termine vor dem 11.12.2026, ein Copilot-Agent tatsächlich nachgebaut und getestet;
  Widerspruch gegen beide Pauschalvorschläge mit konkretem Fall (etwa: GPT 3 würde bei beiden
  Wegen die Margen mitnehmen); (6) Teamregeln mit eigener Ablage, Verantwortlichen,
  Testsatz und Freigaberegeln.

  Lernziel: Assistenten als verwalteten Bestand begreifen – mit Verantwortung, Risiko und
  Lebenszyklus – und einen Plattformwechsel nutzen, um diesen Bestand zu bereinigen.
