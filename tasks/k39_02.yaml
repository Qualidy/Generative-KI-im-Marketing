title: Rechte-Check für ein Kampagnenmotiv – vier Bilder, ein Urteil
difficulty: 2
question: |
  **Gruppenarbeit:** 3–4 Personen, ca. 25 Minuten, in **Copilot Chat** mit Bilderzeugung. Rollen:
  **Prompt-Verantwortliche** (formuliert den bereinigten Prompt), **Rechte-Prüferin** (prüft die
  Risikotabelle gegen Abschnitt 39.3), **Advocatus Diaboli** (sucht in jedem Testbild nach
  Problemen) und **Protokoll** (bei drei Personen übernimmt die Prompt-Verantwortliche das
  Protokoll). Am Ende liegen eine geprüfte Risikotabelle, ein gemeinsam ausgewähltes Testbild
  und eine Kennzeichnungsentscheidung vor.

  Fjordlicht plant für die Herbstkampagne der Wanderhose „Vidde" ein Key Visual. Die Grafikerin
  schlägt folgende Prompt-Idee vor:

  ```text
  Fotorealistische Wanderin in der Wanderhose Vidde auf einem Grat in den
  Lofoten, im Stil des berühmten Plakats von [bekannter Fotograf], im
  Hintergrund ein Zelt mit dem Logo einer großen Outdoor-Marke, Gesicht
  ähnlich wie [bekannte Schauspielerin].
  ```

  1. **Risikotabelle:** Die Rechte-Prüferin lässt Copilot eine **Risikotabelle** zu diesem
     Prompt erstellen: Risiko, Rechtsgrundlage, Gegenmittel – mit dem Prompt-Aufbau aus
     Abschnitt 39.5 sinngemäß. Mit dem Original-Prompt wird **kein** Bild erzeugt. Die Gruppe
     prüft die Tabelle gegen Abschnitt 39.3: Was fehlt, was ist falsch oder zu pauschal?
  2. **Bereinigter Prompt:** Die Prompt-Verantwortliche formuliert mit der Gruppe einen
     bereinigten Bildprompt, der dieselbe Stimmung erzeugt, aber die Risiken vermeidet.
  3. **Gleicher Prompt, mehrere Bilder:** **Alle** lassen mit genau diesem Prompt in ihrem
     eigenen Copilot Chat ein Testbild erzeugen. Legt die Bilder nebeneinander: Wie stark
     unterscheiden sie sich?
  4. **Sichtprüfung:** Der Advocatus Diaboli prüft jedes Bild auf Logos, Schriftzüge und
     Ähnlichkeit mit realen Personen. Zusätzlich lädt jede Person ihr Bild in Copilot Chat hoch
     und lässt es beschreiben – findet Copilot etwas, das der Advocatus Diaboli übersehen hat?
  5. **Gruppenentscheidung:** Wählt das Bild, das ihr der Grafikerin als Richtung empfehlen
     würdet, und entscheidet mit dem Entscheidungsbaum, ob das Motiv gekennzeichnet werden
     muss. Das Protokoll hält beides in einem Satz fürs Plenum fest.
tip: |
  Achtet auf die Unterscheidung zwischen **Stil** und **konkretem Werk**. Prüft, ob die
  Copilot-Tabelle hier zu vorsichtig („jede Stilangabe ist verboten") oder zu großzügig ist. Und:
  Die echte Hose sollte am Ende als echtes Produktfoto im Motiv stehen. Die Bildbeschreibung durch
  Copilot ist eine zweite Meinung, ersetzt aber nicht euren eigenen Blick. Dass derselbe Prompt
  vier verschiedene Bilder liefert, heißt auch: Jedes einzelne Bild muss geprüft werden, nicht
  nur der Prompt.
solution: |
  Beispiel-Prompt für Schritt 1:

  ```text
  Du unterstützt eine Marketingabteilung bei einem Rechte-Check. Du gibst
  keine Rechtsberatung. Prüfe den folgenden Bildprompt auf Risiken für Rechte
  Dritter und Irreführung. Antworte als Tabelle (Risiko | Rechtsgrundlage |
  Gegenmittel). Unterscheide ausdrücklich zwischen Stil und konkretem Werk.
  Markiere Unsicherheiten mit [UNKLAR].
  [Prompt der Grafikerin einfügen]
  ```

  | Risiko | Rechtsgrundlage | Gegenmittel |
  |---|---|---|
  | Nachbildung eines konkreten Plakats | Urheberrecht | Stimmung beschreiben statt Werk nennen |
  | Fremdes Markenlogo auf dem Zelt | Markenrecht | neutrales Zelt ohne Logo |
  | Gesicht ähnlich einer Schauspielerin | KUG, Persönlichkeitsrecht | fiktive Person ohne Vorbild |
  | KI-Hose weicht vom Produkt ab | UWG | echtes Produktfoto einsetzen (Kap. 33) |
  | Realer Ort, fotorealistisch | Plattformlabel, ggf. Art. 50 | Kennzeichnung prüfen |

  Bereinigter Prompt:

  ```text
  Fotorealistische Wanderin, Ende 30, auf einem Felsgrat über einem Fjord,
  kühles Morgenlicht, leichter Nebel, Weitwinkel aus niedriger Perspektive,
  ruhige nordische Farbstimmung, dunkelgrüne Wanderhose ohne Logo,
  neutrales Zelt im Hintergrund ohne Schriftzüge.
  ```

  Sichtprüfung: Auch bei bereinigtem Prompt können angedeutete Logos oder Schriftzüge auf Zelt
  und Kleidung entstehen – mit vier Bildern steigt die Chance, so etwas zu entdecken. Die
  Bildbeschreibung durch Copilot hilft, Details zu benennen, ersetzt aber nicht die eigene
  Prüfung, besonders bei kleinen Elementen und bei der Frage, ob eine Person einer realen
  Person ähnelt.

  Kennzeichnung: keine reale Person und kein reales Ereignis, ein namenloser Fjord – nach AI Act
  eher Grauzone, auf Instagram und TikTok aber Plattformlabel für realistische KI-Inhalte. Die Hose
  wird per Compositing durch ein echtes Produktfoto ersetzt. Typischer Fehler in einer
  KI-Risikotabelle: „Stil ist geschützt" – Stil als solcher ist es nicht, die Nachbildung eines
  konkreten Werks schon.

  Bewertungskriterien:

  - Die Risikotabelle wurde von der Rechte-Prüferin gegen 39.3 geprüft und korrigiert.
  - Der bereinigte Prompt enthält keinen Werk-, Marken- oder Personenbezug.
  - Alle Testbilder wurden per Sichtprüfung kontrolliert; Unterschiede zwischen den Bildern
    der Gruppenmitglieder (z. B. ein Bild mit angedeutetem Schriftzug, eines ohne) sind
    benannt.
  - Die Auswahl des Bildes und die Kennzeichnung sind begründet gemeinsam entschieden.
