title: Der Anruf um 16:40 Uhr – Fallanalyse mit verteilten Rollen
difficulty: 3
question: |
  **Gruppenarbeit:** 4 Personen, ca. 30 Minuten, in **Copilot Chat** und **Copilot in Outlook**.
  Verteilt für die erste Runde die Rollen **Assistenz** (liest den Anruf laut vor und schildert,
  was sie spontan tun würde), **Prüferin** (achtet auf Warnsignale und Prozesse),
  **Advocatus Diaboli** (verteidigt die Anruferin: „Vielleicht ist sie es wirklich?") und
  **Protokoll**. Nach Schritt 2 tauscht ihr die Rollen. Am Ende liegen drei gemeinsam
  beschlossene Regeln und ein Mail-Entwurf vor.

  Freitag, 16:40 Uhr. Die Marketing-Assistenz bei Fjordlicht erhält diesen Anruf, die Stimme
  klingt eindeutig nach der Geschäftsführerin, die gerade auf einer Messe ist:

  ```text
  "Hallo, ich bin's. Hier ist es laut, ich mach's kurz. Die Agentur
  für die Herbstkampagne braucht heute noch die Anzahlung, sonst
  verlieren wir den Slot. 18.500 Euro, die neue Kontonummer schicke
  ich dir per WhatsApp. Bitte nicht über die Buchhaltung, die sind
  schon im Wochenende. Ich verlass mich auf dich."
  ```

  Die Geschäftsführerin spricht regelmäßig in einem Branchenpodcast und veröffentlicht
  LinkedIn-Videos.

  1. **Warnsignale sammeln:** Jede Person notiert **zuerst allein** alle Warnsignale, die sie
     findet. Das Protokoll führt sie zu einer Liste zusammen. Danach geben **alle** das
     Transkript mit demselben Prompt in ihren eigenen Copilot Chat ein. Vergleicht: Was haben
     die Copilot-Antworten gefunden, was ihr übersehen habt – und umgekehrt? Unterscheiden sich
     die Antworten untereinander?
  2. **Die nächsten zehn Minuten:** Die Assistenz beschreibt, wie sie reagieren würde. Der
     Advocatus Diaboli hält mit Einwänden dagegen („Und wenn es wirklich dringend ist?"). Die
     Gruppe einigt sich auf die richtige Reaktion. Bewertet gemeinsam: Welche Rolle spielen die
     öffentlichen Auftritte der Geschäftsführerin? Sollte sie deshalb auf Podcasts und Videos
     verzichten? **Rollen tauschen.**
  3. **Gegenprobe in zwei Paaren:** Jedes Paar entwirft unabhängig drei verbindliche Regeln, die
     diesen Fall künftig verhindern. Vergleicht beide Vorschläge und wählt die drei stärksten
     Regeln aus. Begründet, warum eine reine Schulung nicht reicht.
  4. **Info-Mail:** Eine Person lässt **Copilot in Outlook** aus den drei Regeln eine kurze
     Info-Mail an das Marketingteam entwerfen und nutzt das **Coaching durch Copilot**, um Ton
     und Klarheit zu prüfen: ruhig, ohne Alarmismus, mit klarer Handlungsanweisung. Die anderen
     lesen mit und entscheiden, welche Coaching-Hinweise übernommen werden. Nicht absenden –
     Entwurf speichern.
  5. **Abschluss:** Stellt eure drei Regeln in höchstens zwei Minuten im Plenum vor.
tip: |
  Gute Betrugsanrufe arbeiten mit **Zeitdruck, Autorität und Umgehung des normalen Wegs**. Die
  Stimme selbst ist kein Beweis mehr. Schutz entsteht nicht durch besseres Hinhören, sondern
  durch Prozesse, die unabhängig von der Stimme greifen. Achtet beim Vergleich in Schritt 1
  darauf, ob die Copilot-Antworten auch die leisen Signale nennen, etwa die Begründung für
  schlechte Erreichbarkeit oder den Appell an Loyalität. Der Advocatus Diaboli macht den
  Druck spürbar, unter dem die echte Assistenz stünde – genau deshalb braucht es Regeln.
solution: |
  Beispiel-Prompt für Schritt 1 (für alle identisch):

  ```text
  Eine Marketing-Assistenz hat diesen Anruf erhalten, scheinbar von der
  Geschäftsführerin. Liste alle Warnsignale für einen Betrugsversuch mit
  geklonter Stimme auf, jeweils mit einer kurzen Begründung. Achte auch auf
  unauffällige Signale in Formulierung und Situation.
  [Transkript einfügen]
  ```

  Warnsignale: Zeitdruck („heute noch"), neue Kontonummer, Wechsel auf einen anderen Kanal
  (WhatsApp), ausdrückliche Umgehung der Buchhaltung, Appell an Loyalität, Erklärung für
  schlechte Erreichbarkeit („hier ist es laut"), Uhrzeit kurz vor Wochenende. Beim Vergleich
  lohnt der Blick darauf, welche dieser Signale in einzelnen Copilot-Antworten fehlen – das
  unterscheidet sich oft zwischen den Gruppenmitgliedern.

  Richtige Reaktion: nichts zusagen, auflegen, Rückruf über die im System hinterlegte Nummer
  der Geschäftsführerin, parallel Buchhaltung oder Stellvertretung informieren, keine
  Überweisung ohne Vier-Augen-Prinzip, Vorfall an IT-Sicherheit melden und Rufnummer sowie
  Uhrzeit notieren.

  Zu den öffentlichen Auftritten: Sie liefern das Trainingsmaterial, sind aber für Marke und
  Vertrieb wertvoll. Verzicht ist unverhältnismäßig und schützt wenig, weil oft schon genug
  Material im Netz ist. Wirksamer ist, Prozesse so zu gestalten, dass eine Stimme allein nichts
  auslösen kann.

  | Regel | Begründung |
  |---|---|
  | Keine Zahlung und keine Kontoänderung auf telefonische oder Sprachnachricht-Anweisung | entzieht dem Klon die Wirkung |
  | Neue Bankverbindungen nur nach Rückruf über hinterlegte Nummer und Freigabe durch Buchhaltung | zweiter, unabhängiger Kanal |
  | Ausdrückliche Rückendeckung: Wer nachprüft, handelt richtig – auch gegenüber der Geschäftsführung | nimmt den Autoritätsdruck |

  Schulung allein reicht nicht, weil Menschen unter Zeitdruck und bei vertrauter Stimme
  zuverlässig Fehler machen. Regeln, die unabhängig vom Gefühl gelten, wirken auch dann.

  Beispiel-Prompt für Copilot in Outlook (Schritt 4):

  ```text
  Entwirf eine kurze interne Mail an das Marketingteam (5 Personen) mit
  diesen drei Regeln: [Regeln einfügen]. Anlass: Betrugsversuche mit
  geklonten Stimmen. Ton: ruhig, sachlich, Du-Ansprache, keine Panik.
  Schließe mit einem Satz, dass Nachprüfen immer richtig ist – auch
  gegenüber der Geschäftsführung. Höchstens 120 Wörter.
  ```

  Bewertungskriterien:

  - Die gemeinsame Liste enthält mindestens sechs Warnsignale; der Vergleich mit den
    Copilot-Antworten ist konkret, und Unterschiede zwischen den Antworten der
    Gruppenmitglieder wurden benannt.
  - Die Einwände des Advocatus Diaboli wurden aufgegriffen und mit Prozessargumenten
    beantwortet.
  - Beide Paare haben Regeln entworfen; die Auswahl der drei prozessbasierten Regeln ist
    begründet.
  - Der Mail-Entwurf enthält eine klare Handlungsanweisung, ist ohne Alarmton formuliert, und
    die Gruppe kann sagen, welche Coaching-Hinweise sie übernommen hat und warum.
