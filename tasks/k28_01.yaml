title: Was geht bei der Migration mit – und wohin?
difficulty: 1
question: |
  Fjordlicht migriert drei Custom GPTs zu Plugins. Parallel fragt die Geschäftsführung, ob man
  sie nicht gleich als Copilot-Agents nachbauen könnte, weil alle Microsoft 365 Copilot haben.

  1. **Stand prüfen in Copilot Chat.** Schalte auf **Web** und frage:

  ```text
  Was ist der aktuelle Stand der Ablösung von Custom GPTs durch Plugins bei
  ChatGPT? Nenne die angekündigten Termine und was bei der Migration übertragen
  wird. Gib zu jeder Aussage die Quelle mit Datum an.
  ```

     Vergleiche die Antwort mit der Tabelle in Abschnitt 28.6: Stimmen Termine und Inhalte
     überein? Welche Quelle ist eine Herstellerangabe, welche eine Fachmeldung?
  2. **Einordnen.** Gib für jedes Element an, ob es bei „Migrate to plugin" **übertragen** wird
     (und als was) oder **nicht übertragen** wird – und was das Team dann tun muss.

     1. die Instruktionen des Content-Assistenten
     2. die Datei `claim-liste.md` des Content-Assistenten
     3. die Custom Action des CRM-Chatbot-Prototyps, die Leads an das CRM sendet
     4. die Einstellung „im Arbeitsbereich für das Marketingteam freigegeben"
     5. die Gesprächsverläufe der letzten drei Monate mit dem Content-Assistenten
     6. das als Standard gewählte Modell
     7. eine verbundene App

  3. **Gegenprobe Copilot-Agent.** Öffne den Agent Builder und sieh dir an, welche Felder ein
     Agent hat. Ergänze in deiner Tabelle eine Spalte: Wohin käme jedes Element bei einem
     Nachbau als Copilot-Agent – oder geht es auch dort nicht mit?

  Bis wann sollte Fjordlicht spätestens migriert haben, wenn das Unternehmen kein
  Enterprise-Kunde ist, und warum sind die Termine nur unter Vorbehalt zu verstehen?
tip: |
  Merke dir die Grundregel: Was den Assistenten **ausmacht** (Instruktionen, Wissen), geht
  mit – zum Plugin genauso wie per Copy-and-paste zu einem Copilot-Agent. Was an
  **Einstellungen und Verbindungen** hängt, muss geprüft oder neu gesetzt werden. Prüfe bei
  der Websuche, ob Copilot ein Datum wirklich aus einer Quelle hat oder es nur glatt
  formuliert.
solution: |
  | Nr. | Plugin-Migration | To-do | bei Nachbau als Copilot-Agent |
  |---|---|---|---|
  | 1 | übertragen, wird zum **Skill** | Testfälle erneut laufen lassen | in die Anweisungen kopieren, ggf. kürzen |
  | 2 | übertragen, wird zur **Referenzdatei** | prüfen, ob Fundstellen weiter zitiert werden | als Wissen hinzufügen (Datei aus OneDrive/SharePoint oder Upload) |
  | 3 | **nicht** übertragen | mit IT neu bauen, etwa als App oder MCP-Server | nicht im Agent Builder; Aktion/Konnektor in Copilot Studio oder Automatisierung über Power Automate bzw. eine andere Plattform |
  | 4 | **nicht** übertragen; Plugins starten privat | Freigabe fürs Team neu einrichten | Teilen neu festlegen |
  | 5 | **nicht** übertragen | bei Bedarf vorher wichtige Ergebnisse sichern | geht nicht mit |
  | 6 | **nicht** übertragen | Ergebnisse mit aktuellen Modellen prüfen | Modell legt Microsoft fest; mit Testsatz prüfen |
  | 7 | kann übernommen werden | Verbindung und Berechtigungen kontrollieren | nur, wenn es einen passenden Konnektor gibt – mit IT klären |

  Das geplante Ende für Custom GPTs ist der **11.12.2026**; nicht migrierte GPTs sind
  spätestens ab **11.02.2027** nicht mehr nutzbar. Sinnvoll ist eine Migration deutlich vor
  dem 11.12.2026. Die Termine stammen aus der Ankündigung vom 11.09.2026 und Fachmeldungen,
  können je Konto variieren und sich ändern – deshalb im eigenen Konto prüfen.

  Typische Beobachtung beim Websuche-Schritt: Copilot findet die Ankündigung und einige
  Fachmeldungen; einzelne Termine (etwa die Übergangsphase) tauchen nur in Sekundärquellen
  auf oder fehlen. Genau dafür ist der Abgleich mit Quelle und Datum da.

  Die Gegenprobe zeigt die Lehre aus Abschnitt 28.6: Die Bausteine Instruktionen und Wissen
  ziehen überall hin um, Verbindungen und Freigaben müssen überall neu gebaut werden.
