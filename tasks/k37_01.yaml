title: Welcher Musikweg passt? – Gegenprobe mit und ohne Rahmen
difficulty: 1
question: |
  Fjordlicht braucht in den nächsten Wochen Musik für fünf Vorhaben. Ordnet jedem den passenden
  **Bezugsweg** zu – Plattformbibliothek, Stock-Musik, Auftragskomposition oder KI-Musik – und
  begründet in einem Satz.

  1. Eine spontane Instagram-Story vom Teamausflug, nur 24 Stunden sichtbar.
  2. Ein neues **Sound-Logo**, das künftig am Ende jedes Videos und im Podcast läuft.
  3. Sechs Reels einer Serie zum Rucksack „Tind", die exakt 12 Sekunden lang sind und alle
     dasselbe musikalische Motiv in leicht anderer Stimmung brauchen.
  4. Ein Produktvideo zur Wanderhose „Vidde", das auf Instagram, im Webshop und im Newsletter
     laufen soll.
  5. Ein Kollege möchte einen aktuellen Charthit unter ein TikTok des Unternehmensaccounts legen,
     „weil der Song gerade trendet".

  **Gruppenarbeit:** 3–4 Personen in zwei Untergruppen (bei drei Personen: ein Paar und eine
  Einzelperson), etwa 20 Minuten. **Am Ende liegt vor:** eine
  gemeinsame Zuordnungstabelle im Teams-Chat der Gruppe und eine Aussage dazu, was der Rahmen im
  Prompt verändert hat.

  1. **Erst selbst.** Jede Untergruppe ordnet zuerst ohne KI zu, in Stichworten.
  2. **Gegenprobe.** **Untergruppe A** lässt Copilot Chat (Modus **Arbeit**) die fünf Fälle **ohne**
     weiteren Rahmen zuordnen. **Untergruppe B** gibt die Tabelle der Bezugswege aus Abschnitt 37.1 und
     den Hinweis auf Unternehmensaccounts als Rahmen mit. Vergleicht beide Antworten: Wo
     unterscheiden sie sich? Achtet darauf, ob eine Antwort KI-Musik pauschal als „lizenzfrei"
     bezeichnet.
  3. **Fall 5 mit Websuche.** Eine Person aus Untergruppe A wechselt in den Modus **Web** und fragt nach
     den aktuellen Regeln von TikTok und Instagram für Musik auf Unternehmensaccounts – mit
     Quellen. Eine Person aus Untergruppe B prüft als **Quellenprüferin**, ob die genannten Quellen die
     Aussage wirklich tragen, und notiert Datum und Herkunft.
  4. **Einigen.** Führt eure Zuordnung in einer Tabelle im Teams-Chat der Gruppe zusammen und
     haltet in einem Satz fest, welchen Unterschied der Rahmen im Prompt gemacht hat.
tip: |
  Fragt bei jedem Fall zuerst: Wie lange und wo läuft die Musik? Je länger und je breiter der
  Einsatz, desto wichtiger ist eine eindeutige, dokumentierte Lizenz. Die Gegenprobe zeigt, wie
  viel ein Rahmen im Prompt ausmacht – achtet besonders auf Fall 2 und 4.
solution: |
  Beispiel-Prompt für Untergruppe B (mit Rahmen):

  ```text
  Ordne jedem der fünf Vorhaben einen Bezugsweg für Musik zu:
  Plattformbibliothek, Stock-Musik, Auftragskomposition oder KI-Musik.
  Fjordlicht postet über Unternehmensaccounts. Berücksichtige Laufzeit,
  Kanäle (nur App oder auch Webshop/Newsletter) und ob das Ergebnis der
  Marke dauerhaft gehören muss.
  Rahmen: [Tabelle der Bezugswege aus Abschnitt 37.1 einfügen]
  Ausgabe: Tabelle mit Nr., Bezugsweg, Begründung (1 Satz).
  [Vorhaben 1 bis 5 einfügen]
  ```

  Untergruppe A gibt nur die fünf Vorhaben mit der Bitte um Zuordnung ein.

  | Nr. | Bezugsweg | Begründung |
  |---|---|---|
  | 1 | Plattformbibliothek (Commercial Music Library) | kurzlebig, nur auf Instagram, direkt in der App |
  | 2 | Auftragskomposition (KI höchstens zur Ideensuche) | Markenzeichen braucht Schutzfähigkeit und vertraglich gesicherte Rechte |
  | 3 | KI-Musik im Bezahlplan, alternativ Stock | passgenaue Länge und Varianten sind die Stärke von KI; Tarif dokumentieren |
  | 4 | Stock-Musik mit kanalübergreifender Lizenz | Plattformsound gilt nur in der App, nicht im Webshop oder Newsletter |
  | 5 | nicht so umsetzbar | Charthits sind für Unternehmensaccounts meist nicht freigegeben; Alternative aus der Commercial Music Library wählen |

  Worauf ihr beim Vergleich achten solltet: ob eine Antwort Fall 2 als KI-Musik vorschlägt
  („schnell und günstig"), ohne die fehlende Schutzfähigkeit zu nennen, und ob Fall 4 bei der
  Plattformbibliothek bleibt, obwohl das Video den Kanal verlässt. Prüft, ob diese Punkte in der
  Antwort ohne Rahmen häufiger auftreten als in der mit Rahmen. Bei der Websuche zu Fall 5 gilt:
  Datum und Herkunft der Quellen prüfen, die Regeln ändern sich.

  Fall 5 ist der wichtigste: Dass die App einen Song anbietet, heißt nicht, dass eine Marke ihn
  nutzen darf.

  Bewertungskriterien: Alle fünf Fälle sind zugeordnet und begründet, Laufzeit und Kanäle sind
  berücksichtigt. Die Gruppe hat die Unterschiede zwischen den Antworten mit und ohne Rahmen
  benannt und erklärt. Die Aussage zu Fall 5 ist mit mindestens einer geprüften Quelle samt Datum
  belegt.
