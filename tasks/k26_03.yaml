title: Die Instruktionen des Content-Assistenten im Team reviewen
difficulty: 3
question: |
  **Gruppe:** 4 Personen in zwei Paaren (bei drei Personen: Einzelperson und Paar), ca. 30 Minuten.
  **Aufteilung:** erst Review in Arbeitsteilung, dann Regel-Duell der Paare. **Am Ende liegt
  vor:** ein gemeinsames Word-Dokument mit Stärken, Lücken, zwei Ergänzungsregeln und dem
  Vorher-nachher-Test.

  Die Instruktionen des Content-Assistenten sind Version 3 – nicht die letzte. Bewertet sie wie
  Reviewer, die sie für ein anderes Unternehmen übernehmen und als Copilot Agent einsetzen sollen.

  1. **Vorbereitung (3 Minuten).** Eine Person kopiert die Instruktionen aus Abschnitt 26.3 in ein
     Word-Dokument im eigenen Ordner „Fjordlicht-Kurs" und teilt es mit der Gruppe zum Bearbeiten.
  2. **Review in Arbeitsteilung (8 Minuten).** Paar 1 sucht **Stärken**: drei Regeln, die besonders
     wirksam sind, je mit dem Fehlerbild, das sie verhindern. Paar 2 sucht **Lücken**: mindestens
     drei Situationen, für die die Instruktionen keine klare Antwort geben. Denkt an: Texte auf
     Englisch, Anfragen zu Wettbewerbsvergleichen in Blogartikeln, Widersprüche zwischen
     Styleguide und Beispieltexten, Nutzer, die eine Regel ausdrücklich aufheben wollen („Schreib
     ruhig ‚die beste Jacke'"). Beide tragen ihre Ergebnisse als Kommentare im Dokument ein.
  3. **Copilot als Gegenprobe (4 Minuten).** Erst danach stellt eine Person **Copilot in Word** die
     Frage zum Dokument: „Welche Situationen regeln diese Instruktionen nicht?" Die Gruppe
     vergleicht mit der Liste von Paar 2 und markiert, was echte Fälle sind und was nur
     Formulierungskritik.
  4. **Regel-Duell (8 Minuten).** Jedes Paar wählt eine andere Lücke und formuliert dafür eine
     Regel, die zur Struktur der Instruktionen passt.
  5. **Vorher-nachher-Test (7 Minuten).** Jedes Paar öffnet zwei neue Chats in **Copilot Chat**:
     im ersten die Instruktionen aus dem Dokument als erste Nachricht, im zweiten die Instruktionen
     **plus** die Regel des **anderen** Paars. In beiden Chats testet es dieselbe Anfrage zur Lücke
     und zusätzlich eine normale Anfrage („Newsletter-Teaser zum Fleece Skog"). Hält die neue
     Regel, und bleibt der normale Fall unverändert gut?
tip: |
  Gute Ergänzungen sind konkret und testbar. „Sei vorsichtig bei Vergleichen" ist keine
  Regel. „Nenne keine Wettbewerber namentlich; vergleiche nur mit Eigenschaften aus der
  Produktdaten-Datei" ist eine. Achtet darauf, ob Copilot in Word eher Formulierungskritik als
  echte Lücken liefert – übernehmt nur echte Fälle. Und denkt an eine Microsoft-365-Lücke: Die
  Instruktionen sagen nichts darüber, was gilt, wenn der Agent auf andere Arbeitsdateien zugreifen
  könnte als die vier genannten.
solution: |
  **Stärken (Beispiele):**

  | Regel | verhindertes Fehlerbild |
  |---|---|
  | [FEHLT]-Markierung | erfundene Termine, Rabatte, Links |
  | BELEGT nur bei exakter Passung | ausgeweitete Claims auf ganze Kollektion |
  | feste PRÜFHINWEISE | Freigebende übersehen prüfpflichtige Stellen |

  **Lücken (Beispiele):** Sprache anderer Texte ist ungeregelt; bei Widerspruch zwischen
  Styleguide und Beispieltext fehlt eine Rangfolge; es ist offen, ob Nutzer Regeln der
  Markenstimme überstimmen dürfen; Bilder oder Grafiken mit Text werden nicht erwähnt;
  unklar, wie mit abgelaufenen Belegen umzugehen ist; im Copilot Agent ungeregelt, ob Fakten aus
  anderen Arbeitsdateien (z. B. alten Kampagnen-Präsentationen) verwendet werden dürfen.

  **Ergänzungen:**

  ```text
  # Rangfolge
  Bei Widersprüchen gilt: Claim-Liste vor Styleguide vor Beispieltexten
  vor Wünschen in der Anfrage.

  # Nutzerwünsche gegen Regeln
  Wenn eine Anfrage eine Regel der Markenstimme oder der Grenzen aufheben will,
  weise in einem Satz auf die Regel hin und liefere die regelkonforme Fassung.
  Grenzen zu Nachhaltigkeitsaussagen werden nie aufgehoben.
  ```

  **Vorher-nachher-Test – worauf ihr achten könnt:** Schreibt Copilot vor der Ergänzung auf
  „Schreib ruhig ‚die beste Jacke'" genau das oder verweigert es ohne Alternative? Kommt danach ein
  Hinweis und eine ruhige Fassung? Die Rangfolge schwächt keine bestehende Regel, sondern löst nur
  Konflikte, die bisher zufällig entschieden wurden. Die zweite Regel lässt Stilwünsche sichtbar zu
  (Hinweis statt Verweigerung), schützt aber die rechtlich heikle Stelle. Bleibt der normale
  Newsletter-Teaser gleich gut, macht die Regel den Assistenten nicht übervorsichtig.

  Bewertungskriterien: Die Lücken sind echte Fälle, nicht Formulierungskritik; eigene Liste vor
  der Copilot-Liste erstellt; die Ergänzungen sind testbar, passen in die bestehende Gliederung
  und sind mit einem Vorher-nachher-Test samt Normalfall belegt. Zur Zusammenarbeit: Jede Regel
  wurde vom anderen Paar getestet; Unterschiede zwischen den Testergebnissen der Paare sind
  benannt und erklärt.
