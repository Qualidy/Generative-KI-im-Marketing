title: Interview im Tandem, Abschnitt in Word – mit Gegenprobe
difficulty: 2
question: |
  **Gruppe:** 4 Personen in zwei Paaren (bei 3 Personen übernimmt eine Person die Gegenprobe
  allein), ca. 30 Minuten. **Am Ende liegt vor:** eine geteilte **Copilot Page**
  „Interview-Zitate" mit geprüften Zitaten und Gliederung, ein Word-Abschnitt mit echtem Zitat
  und ein Vergleich mit einem Abschnitt ohne Interview.

  Thema: ein Blogartikel für Fjordlicht oder für ein Unternehmen eurer Wahl, zu einem Thema, bei
  dem eine Person aus der Gruppe selbst Erfahrung hat (z. B. ein Hobby oder ein Produkt, das sie
  gut kennt).

  **Rollen in Paar 1 (Interview):** **Erfahrungsträgerin** beantwortet die Fragen,
  **Prüfer** sitzt daneben, notiert stichwortartig, was tatsächlich gesagt wurde, und prüft
  später die Zitate. **Paar 2 (Gegenprobe):** schreibt denselben Abschnitt ohne Interview.

  1. **Interview (Paar 1).** Die Erfahrungsträgerin lässt sich in Copilot Chat mit dem
     Interview-Prompt aus Abschnitt 15.4 interviewen und antwortet ehrlich und konkret. Lasst die
     Antworten als Zitate zusammenfassen, übernehmt die Antwort in eine **Copilot Page**
     „Interview-Zitate" und teilt sie mit der Gruppe. Der Prüfer gleicht jedes Zitat mit seinen
     Notizen ab und korrigiert es direkt in der Page.
  2. **Gliederung (Paar 1).** Lasst im selben Chat eine Gliederung mit fünf
     Zwischenüberschriften erstellen, fügt sie in die Page ein und überarbeitet sie
     (mindestens eine Änderung).
  3. **Abschnitt in Word (Paar 1).** Legt im Ordner „Fjordlicht-Kurs" ein Word-Dokument an und
     lasst mit **Entwurf mit Copilot** genau **einen** Abschnitt schreiben (max. 250 Wörter) –
     mit dem Platzhalter `[ERFAHRUNG EINFÜGEN]`. Für Fjordlicht verweist ihr auf
     `/Fjordlicht-Basisdaten` (falls die Datei fehlt: Kap. 11 bzw. Fakten in den Prompt
     einfügen). Setzt danach ein geprüftes Zitat an der Platzhalterstelle ein.
  4. **Gegenprobe (Paar 2, parallel).** Paar 2 übernimmt die Gliederung aus der Page und lässt
     denselben Abschnitt in einem **neuen** Copilot-Chat schreiben – **ohne** Interview und ohne
     Platzhalter. Beide Personen führen den Prompt aus; ihr fügt beide Fassungen in die Page ein.
  5. **Vergleich (alle).** Markiert in den Fassungen ohne Interview jeden Satz, der Erfahrung
     behauptet, die niemand geliefert hat. Einigt euch auf einen Satz für das Plenum: Warum ist
     der Abschnitt mit Interview für E-E-A-T stärker?
tip: |
  Achtet in Schritt 1 darauf, ob die Zusammenfassung wirklich nur Aussagen der
  Erfahrungsträgerin enthält – oder ob kleine Details, Zahlen oder Verallgemeinerungen
  hinzugekommen sind. Darum braucht es den Prüfer mit eigenen Notizen: Er hat zugehört, ohne
  selbst zu antworten. Die Page bündelt Zitate, Gliederung und beide Gegenproben an einem Ort,
  den alle bearbeiten können.
solution: |
  Prompt für Schritt 3 in Word (Entwurf mit Copilot):

  ```text
  Schreibe Abschnitt 3 "Waschen in der Maschine" für den Blog
  "Draußen-Notizen" nach dieser Gliederung: [Gliederung].
  Nutze nur Fakten aus /Fjordlicht-Basisdaten. Max. 250 Wörter,
  eine nummerierte Schritt-Liste. Ton laut Markenstimme in den
  Basisdaten. Wo Erfahrung aus dem Reparaturservice passt, setze
  [ERFAHRUNG EINFÜGEN] statt etwas zu erfinden.
  ```

  Mögliche Beobachtungen:

  | Fassung | Merkmal |
  |---|---|
  | ohne Interview (Paar 2) | allgemeine Tipps, Formulierungen wie „viele Menschen" oder „Erfahrungen zeigen", eventuell erfundene Anekdoten („Ein Kunde erzählte uns …"); die beiden Fassungen unterscheiden sich im Wortlaut, ähneln sich aber im Allgemeinen |
  | mit Interview (Paar 1) | konkrete Details, eigene Formulierungen, erkennbar aus einer Quelle |

  Kommt in der Zitat-Zusammenfassung ein Detail vor, das die Erfahrungsträgerin nicht gesagt hat
  (etwa eine Zahl), und der Prüfer findet es anhand seiner Notizen, hat die Gruppe den Kern der
  Übung erfasst.

  Bewertungskriterien: geteilte Page mit geprüften Zitaten und fünf überarbeiteten
  Gliederungspunkten; Word-Abschnitt mit eingesetztem echtem Zitat; in beiden Gegenproben ist
  mindestens eine erfundene Erfahrung markiert; Unterschiede zwischen den beiden
  Gegenproben-Fassungen sind benannt; der Plenumssatz begründet den Vorteil für E-E-A-T.
