title: Bildauswahl im Team – mit Raster und Copilot als Zweitmeinung
difficulty: 3
question: |
  **Gruppe:** 3–4 Personen, ca. 30 Minuten. Am Ende liegen eine gemeinsame Excel-Bewertung aller
  Varianten (eine Spalte je Person plus Copilot) und eine begründete Gruppenentscheidung für
  **eine** Variante vor.

  **Rollen:** **Excel-Verantwortliche** (legt die Tabelle an und arbeitet mit Copilot in Excel),
  **Advocatus Diaboli** (vertritt in Schritt 5 bewusst eine andere Variante), **Protokoll**
  (hält die Entscheidung fest). Alle erzeugen und bewerten.

  1. **Kandidaten erzeugen (Arbeitsteilung).** Jede Person erzeugt in ihrem Copilot Chat zwei
     Varianten für eine Instagram-Anzeige im Hochformat der Regenjacke „Sølv" mit der Aufgabe
     „Aufmerksamkeit im Herbstfeed" – mit eigenem Motivansatz, aber mit `/Fjordlicht-Bildsprache`
     aus Kurzübung 2 (falls nicht vorhanden, den Baustein aus 32.2 einfügen). Legt alle Bilder
     nummeriert in einen gemeinsamen OneDrive-Ordner.
  2. **Still bewerten.** Die Excel-Verantwortliche legt eine Excel-Datei in OneDrive an
     (Daten als Tabelle formatiert): eine Zeile je Variante und Kriterium aus dem Raster in
     Abschnitt 32.7, eine Punktespalte je Person. Jede Person bewertet alle Varianten (0–2 Punkte
     je Kriterium) **ohne** auf die Spalten der anderen zu schauen – auf dem Smartphone, in
     Originalgröße, etwa über die OneDrive-App.
  3. **Copilot bewerten lassen.** Eine Person startet einen neuen Chat, lädt die Varianten hoch,
     gibt Raster und `/Fjordlicht-Bildsprache` mit und lässt begründet bewerten. Copilots Punkte
     kommen als weitere Spalte in die Tabelle.
  4. **Abgleich.** Lasst euch von Copilot in Excel eine Spalte mit der Spannweite der
     menschlichen Bewertungen und eine mit der Differenz zum Copilot-Wert vorschlagen und die
     größten Abweichungen hervorheben. Besprecht jede hervorgehobene Zeile: berechtigter Hinweis,
     unterschiedlicher Geschmack in der Gruppe oder Grenze der KI-Bewertung?
  5. **Entscheidung.** Der Advocatus Diaboli plädiert eine Minute lang für eine andere Variante
     als die mit der höchsten Summe. Danach entscheidet die Gruppe; das Protokoll begründet die
     Wahl in drei Sätzen – so, dass eine Kollegin ohne die anderen Bilder sie nachvollziehen kann.
tip: |
  Die stille Bewertung in Schritt 2 ist der Kern: Wer zuerst die Punkte der anderen sieht,
  passt sich unbewusst an. Achtet darauf, ob Copilot technische Fehler wirklich findet –
  sechs Finger, verdrehte Reißverschlüsse, unlesbare Etiketten. Und: Copilot bewertet hier Bilder,
  die es selbst erzeugt hat – ein Grund mehr, das eigene Urteil zuerst festzuhalten.
solution: |
  Ein brauchbarer Bewertungsprompt für Copilot Chat:

  ```text
  Du bist Art Director für Fjordlicht. Bewerte die hochgeladenen Bilder mit
  diesem Raster, je Kriterium 0 bis 2 Punkte, mit einem Satz Begründung:
  [Raster einfügen]
  Bildsprache-Guide: /Fjordlicht-Bildsprache
  Bildaufgabe: Aufmerksamkeit im Instagram-Herbstfeed, Hochformat, Smartphone.
  Ein Bild mit 0 Punkten bei Ehrlichkeit oder technischer Sauberkeit scheidet aus.
  Gib das Ergebnis als Tabelle aus, am Ende eine Rangfolge, und nenne, was du
  nicht sicher beurteilen kannst.
  ```

  Prompt in Excel: „Füge eine Spalte mit der Differenz zwischen dem höchsten und dem niedrigsten
  Wert unserer Personenspalten hinzu und eine Spalte mit der Differenz zwischen unserem
  Durchschnitt und dem Copilot-Wert. Hebe alle Zeilen hervor, in denen eine der beiden
  Differenzen mindestens 2 beträgt."

  Mögliche Ergebnisse des Abgleichs:

  - **Abweichungen in der Gruppe:** Sie treten oft bei „Markenfit" und „Blickführung" auf – hier
    lohnt die Frage, ob der Bildsprache-Baustein eine Lücke hat oder ob es Geschmack ist.
  - **Berechtigte Hinweise von Copilot:** etwa eine präzise Begründung, warum die Blickführung
    nicht stimmt oder ein Bild vom Guide abweicht (Farbe zu gesättigt, Siegerpose).
  - **Grenzen:** Prüft, ob Copilot kleine technische Fehler übersieht, ob es das ästhetischste
    Bild am höchsten bewertet und dass es die Wirkung im schnellen Scrollen auf dem Smartphone
    nicht selbst erleben kann.
  - **Ehrlichkeit:** Ob die gezeigte Jacke dem echten Produkt „Sølv" entspricht, kann nur
    jemand beurteilen, der das Produkt kennt – bei generierten Jacken ist das fast nie der Fall
    (Kap. 33).

  Bewertungskriterien: alle Varianten von jeder Person still und mit Raster bewertet;
  mindestens zwei Abweichungen innerhalb der Gruppe und zwei zwischen Gruppe und Copilot benannt
  und erklärt; die Formelspalten sind geprüft; das Gegenplädoyer hat stattgefunden und ist im
  Protokoll erwähnt; die Entscheidung ist in drei nachvollziehbaren Sätzen begründet;
  ausdrücklicher Hinweis, dass erst ein Test mit Publikum (Kap. 16) über die Wirkung entscheidet.
