title: Landingpage-Test im geteilten Testlog auswerten
difficulty: 2
question: |
  **Gruppe:** 3–4 Personen, ca. 30 Minuten. **Rollen:** **Excel-Verantwortliche** (legt die Mappe
  an und bedient Copilot in Excel), **Nachrechner** (prüft jede Zahl selbst),
  **Statistik-Fragende** (eine oder zwei Personen, Copilot Chat), **Protokoll** (Blatt
  „Testlog"; bei 3 Personen übernimmt das der Nachrechner). **Am Ende liegt vor:** die geteilte
  Arbeitsmappe „Fjordlicht-Testlog.xlsx" mit ausgewerteter Tabelle, Diagramm und erstem
  Testlog-Eintrag.

  Fjordlicht hat auf der Landingpage für den Pflege-Kalender zwei Button-Texte getestet. Die
  Testdauer (14 Tage) war vorher festgelegt. Fiktive Daten:

  ```text
  Variante;Button;Besuche;Anmeldungen
  A;Jetzt anmelden;3200;224
  B;Kalender holen;3180;270
  ```

  1. **Daten anlegen.** Die Excel-Verantwortliche legt im Ordner „Fjordlicht-Kurs" (OneDrive)
     die Arbeitsmappe „Fjordlicht-Testlog.xlsx" an, trägt die Daten ein, formatiert den Bereich
     als Tabelle und teilt die Mappe mit der Gruppe.
  2. **Copilot in Excel.** Lasst Copilot eine Formelspalte „Anmelderate" und eine Spalte
     „Unterschied zu A" (relativ) vorschlagen, prüft die Formel und fügt sie ein. Lasst die
     höhere Anmelderate hervorheben und ein Säulendiagramm der beiden Raten erstellen.
  3. **Nachrechnen.** Der Nachrechner rechnet beide Raten und den relativen Unterschied selbst
     nach (Anmeldungen geteilt durch Besuche) und prüft, ob die Formeln auf die richtigen Zellen
     zeigen.
  4. **Gleicher Prompt, mehrere Ergebnisse.** Die Statistik-Fragenden geben – jede Person in
     ihrem eigenen Copilot Chat – denselben Prompt ein: Chi-Quadrat-Test für die beiden Raten
     (5 % Signifikanz), Erklärung in vier Sätzen fürs Team, und wie viele Besuche pro Variante
     nötig gewesen wären, um 7,0 % zu 8,4 % sicher zu erkennen (80 % Teststärke). Achtet darauf,
     ob p-Wert und Stichprobengröße in den Antworten übereinstimmen und ob ein Rechenweg genannt
     wird. Vergleicht eure Werte erst danach mit den Referenzwerten in der Lösung.
  5. **Testlog.** Das Protokoll legt in derselben Mappe ein Blatt „Testlog" mit den Feldern aus
     Abschnitt 16.6 an und trägt das Ergebnis ein, das die Gruppe nach dem Vergleich für
     belastbar hält. Danach speichert jede Person eine Kopie der Mappe in ihrem eigenen Ordner
     „Fjordlicht-Kurs" – ihr braucht sie im Workshop und in Kap. 20 wieder.
tip: |
  Achtet darauf, ob eine Antwort den Unterschied als „Beweis" bezeichnet oder Ursachen behauptet
  („weil Nutzer konkrete Vorteile bevorzugen"). Signifikanz sagt nur, dass der Unterschied
  wahrscheinlich nicht zufällig ist – nicht, warum er entsteht. Weichen die Zahlen der
  Statistik-Fragenden voneinander ab, ist das kein Detail: Eine Rechnung, die bei zwei Personen
  verschieden ausfällt, darf ohne Prüfung nicht ins Testlog. In die Mappe gehören nur
  aggregierte Zahlen, keine Empfängerlisten (Kap. 4).
solution: |
  Beispiel-Prompt für Copilot Chat:

  ```text
  Ein A/B-Test auf einer Landingpage: A 3200 Besuche, 224 Anmeldungen;
  B 3180 Besuche, 270 Anmeldungen. Prüfe mit einem Chi-Quadrat-Test,
  ob der Unterschied bei 5 % Signifikanzniveau signifikant ist. Zeige
  den Rechenweg. Erkläre das Ergebnis in 4 Sätzen für das Marketingteam
  und nenne, was der Test NICHT zeigt. Berechne außerdem, wie viele
  Besuche pro Variante nötig gewesen wären, um 7,0 % gegenüber 8,4 %
  zu erkennen (5 % Signifikanz zweiseitig, 80 % Teststärke).
  ```

  Referenzwerte:

  | Kennzahl | Wert |
  |---|---|
  | Anmelderate A | 7,0 % |
  | Anmelderate B | ca. 8,5 % |
  | relativer Unterschied | ca. +21 % |
  | p-Wert (Chi-Quadrat, ohne Korrektur) | ca. 0,026 |
  | Ergebnis | signifikant bei 5 % |
  | nötige Besuche für 7,0 % → 8,4 % | ca. 5.700 pro Variante |

  Je nach Rechenweg (z. B. mit Yates-Korrektur) weicht der p-Wert leicht ab; das ist kein Fehler.
  Größere Abweichungen zwischen den Antworten der Gruppenmitglieder – etwa ein p-Wert von 0,26
  oder eine Stichprobe von wenigen Hundert – zeigen, warum Rechenergebnisse aus dem Chat geprüft
  werden müssen. Bemerkenswert ist die Stichprobenfrage: Der Test war für diesen Effekt
  eigentlich zu klein geplant. Dass er trotzdem signifikant wurde, liegt daran, dass der
  beobachtete Unterschied etwas größer war. Eine Wiederholung oder Weiterführung stärkt das
  Ergebnis.

  Testlog-Eintrag (Kurzform): Hypothese „Nutzen im Button erhöht Anmelderate"; Ergebnis A 7,0 %,
  B 8,5 %, p ≈ 0,03; Erkenntnis: Nutzenformulierung bei diesem Leadmagneten wirksam; nächster
  Schritt: Prinzip bei der nächsten Landingpage erneut testen.

  Bewertungskriterien: Tabelle mit geprüften Formelspalten und Diagramm in der geteilten Mappe;
  Raten vom Nachrechner unabhängig bestätigt; Abweichungen zwischen den Copilot-Antworten der
  Gruppenmitglieder benannt und erklärt; Testlog-Eintrag enthält alle Felder aus Abschnitt 16.6;
  jede Person hat „Fjordlicht-Testlog.xlsx" in ihrem eigenen Ordner.
