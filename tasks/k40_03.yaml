title: Einen Einführungsplan kritisch bewerten
difficulty: 3
question: |
  Die Geschäftsführung von Fjordlicht hat von einer Agentur folgenden Plan zur KI-Einführung im
  Marketing erhalten und bittet dich um eine kritische Einschätzung:

  ```text
  Woche 1: Alle fünf Teammitglieder erhalten Zugang zu fünf verschiedenen KI-Tools
           (kostenlose Versionen, um Kosten zu sparen).
  Woche 2: Upload des kompletten CRM-Exports in ChatGPT zur Zielgruppenanalyse.
  Woche 3: Start der Avatar-Videoreihe mit KI-Klon der Geschäftsführerin für TikTok.
  Woche 4: Verzehnfachung der Blogartikel von 4 auf 40 pro Monat.
  Ziel: 50 Prozent Zeitersparnis im Marketing.
  Messung: Zufriedenheitsumfrage im Team nach drei Monaten.
  ```

  1. Benenne mindestens **sechs Probleme** des Plans und ordne sie Kapiteln des Kurses zu.
  2. Lass **Copilot Chat** denselben Plan bewerten. Vergleiche: Welche Probleme findet Copilot,
     welche übersieht es, wo ist es zu nachsichtig?
  3. Stelle Copilot die Nachfrage: „Wäre Woche 2 in Ordnung, wenn wir den CRM-Export statt in
     ChatGPT in Microsoft 365 Copilot hochladen?" Bewerte die Antwort mit Kap. 4.
  4. Formuliere einen **Gegenvorschlag** nach den fünf Schritten aus Abschnitt 40.3 auf einer
     halben Seite. Lass dir dabei von **Copilot in Word** einen Entwurf erstellen und überarbeite
     ihn. Optional: Lass **Copilot in PowerPoint** aus dem Word-Dokument drei Folien für die
     Geschäftsführung erstellen.
tip: |
  Gehe den Plan Zeile für Zeile mit drei Brillen durch: Daten und Recht, Qualität und Marke,
  Messbarkeit. Fast jede Zeile hat mindestens ein Problem. Bei Schritt 3 hilft die Frage: Was
  löst Enterprise Data Protection – und was nicht?
solution: |
  | Problem | Warum | Kapitel |
  |---|---|---|
  | fünf Tools ohne Auswahl | keine Werkzeugliste, kein einheitlicher Standard | 4, 40 |
  | kostenlose Versionen | ggf. Training auf Eingaben, kein AVV | 4 |
  | CRM-Export in Consumer-Tool | personenbezogene Daten, DSGVO-Verstoß | 4, 17 |
  | Avatar-Klon als erster Schritt | hohes Risiko, Einwilligung, Kennzeichnungspflicht als Deepfake | 36, 38, 39 |
  | 40 Blogartikel pro Monat | massenhafter Content, Qualitäts- und SEO-Risiko | 15, 22 |
  | Ziel ohne Ausgangswert | 50 Prozent wovon? keine Baseline | 20, 40 |
  | Messung nur per Zufriedenheit | misst Gefühl, nicht Wirkung | 16, 20 |
  | keine Richtlinie, keine Freigabe | Verantwortung ungeklärt | 4, 39 |

  Copilot erkennt meist den Datenschutzverstoß, bewertet aber Ziel und Messung oft zu nachsichtig
  und schlägt selten vor, den Avatar-Schritt zu streichen.

  Zu Schritt 3: Mit Microsoft 365 Copilot bleiben die Daten im Mandanten, Enterprise Data
  Protection gilt, und Berechtigungen werden beachtet – das löst das Problem des
  Consumer-Werkzeugs. Es löst **nicht** die Fragen nach Zweckbindung und Datenminimierung: Für
  eine Zielgruppenanalyse braucht es keinen vollständigen Export mit Namen und Kontaktdaten.
  Besser ist ein anonymisierter oder aggregierter Auszug, abgestimmt mit Datenschutz (Kap. 4, 17).
  Wenn Copilot die Frage pauschal mit „ja" beantwortet, ist die Antwort zu nachsichtig.

  Beispiel-Prompt für Copilot in Word:

  ```text
  Entwirf auf einer halben Seite einen Gegenvorschlag zur KI-Einführung im
  Fjordlicht-Marketing (5 Personen, Microsoft 365 Copilot vorhanden).
  Gliedere nach: 1. Bestandsaufnahme mit Zeitmessung, 2. Pilot (ein Use Case,
  vier Wochen), 3. einseitige Richtlinie, 4. Messung gegen Ausgangswert,
  5. Entscheidung über Ausweiten oder Stoppen. Keine personenbezogenen Daten,
  keine Avatar- oder Klonprojekte im Pilot.
  ```

  Gegenvorschlag in Kurzform: Bestandsaufnahme der Aufgaben mit Zeitmessung; Pilot mit Microsoft
  365 Copilot und dem Content-Assistenten für Newsletter-Entwürfe; einseitige Richtlinie mit
  Datenampel und Kennzeichnungslinie; Messung von Zeit, Korrekturschleifen und Kanal-KPIs gegen
  die Baseline; Entscheidung nach vier Wochen über Ausweitung.

  Bewertungskriterien: mindestens sechs Probleme mit Begründung, Vergleich mit der
  Copilot-Bewertung konkret, Nachfrage zu Woche 2 differenziert beantwortet (Mandant ja,
  Datenminimierung trotzdem), Gegenvorschlag enthält alle fünf Schritte und eine Baseline.
