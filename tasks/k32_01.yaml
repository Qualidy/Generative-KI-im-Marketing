title: Bildaufgabe und Kanal zuordnen
difficulty: 1
question: |
  Fjordlicht plant fünf Bilder. Bestimme für jedes die **Bildaufgabe** aus Abschnitt 32.1
  (Aufmerksamkeit, Gefühl, Information, Vertrauen, Handlung), das passende **Format** aus
  Abschnitt 32.6 und **eine** Kompositionsentscheidung, die sich daraus ergibt.

  1. Reel-Titelbild für ein Video „Drei Wege, deine Regenjacke zu imprägnieren"
  2. Produktseite der Wanderhose „Vidde": Detail der verstärkten Knie
  3. LinkedIn-Post für Fjordlicht Business: Team einer Gärtnerei in Firmenjacken
  4. Newsletter-Header zum Herbstauftakt „Draußen-Notizen im Oktober"
  5. Landingpage-Banner „Jetzt Fleece Skog entdecken" mit Button

  Welche der fünf Bilder eignen sich überhaupt für Bild-KI – und bei welchen wäre ein echtes
  Foto Pflicht? Begründe kurz.
tip: |
  Frage dich zuerst, was die betrachtende Person **nach** dem Bild tun oder wissen soll. Die
  Kompositionsentscheidung folgt dann fast von selbst.
solution: |
  | Nr. | Aufgabe | Format | Kompositionsentscheidung |
  |---|---|---|---|
  | 1 | Aufmerksamkeit | 9:16 | Motiv mittig, Ränder für Bedienelemente frei, ein starker Kontrast |
  | 2 | Information | 1:1 oder 4:5 | Nahaufnahme, Knie formatfüllend, neutraler Hintergrund |
  | 3 | Vertrauen | 1:1 oder 4:5 | Augenhöhe, Arbeitssituation, Personen nicht posierend |
  | 4 | Gefühl | ca. 2:1 bis 3:1 | weite Herbstlandschaft, Motiv auch schmal erkennbar |
  | 5 | Handlung | 16:9 oder breiter | Negativraum für Headline, Person blickt Richtung Button |

  **Echtes Foto Pflicht:** Nr. 2, weil das echte Produktdetail gezeigt werden muss – eine
  KI-Variante würde Nähte und Material frei erfinden. Nr. 3 ebenfalls: Wer echte Kundschaft
  zeigt, muss echte Menschen zeigen; ein generiertes „Kundenteam" wäre irreführend (Kap. 34).

  **Bild-KI geeignet:** Nr. 4 als Stimmungsbild ohne Produktaussage. Nr. 1 und 5 nur, wenn das
  Produkt echt ist – etwa ein echtes Produktfoto, dessen Umgebung mit KI erweitert wird (Kap. 33).
